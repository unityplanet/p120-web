<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090b0c">
  <title>Почему P-120? — Preview v1.3</title>
  <style>
    html,body{margin:0;min-height:100%;background:#090b0c;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .loading small{display:block;margin-top:8px;opacity:.55;font-size:12px}
    .error{max-width:680px;text-align:left;line-height:1.5;color:#f2eee7}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div>P-120 · Why P-120<small>Загрузка editorial preview v1.3…</small></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./payload-v13.b64?v=1',{cache:'no-store'});
      if(!response.ok) throw new Error('Payload HTTP '+response.status);
      const b64=(await response.text()).replace(/\s+/g,'');
      const binary=atob(b64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      if(typeof DecompressionStream!=='function') throw new Error('This browser does not support gzip preview decoding');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(err){
      const el=document.getElementById('loading');
      el.innerHTML='<div class="error"><strong>Preview load error</strong><br><br>'+String(err)+'<br><br>Обновите страницу ещё раз. Если ошибка сохранится, сообщите мне.</div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
