name: P120 SEC-GH-02 Actions Governance Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-actions-governance-cleanup-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p120-sec-gh-02-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire historical writers and install governance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          wf = Path('.github/workflows')
          cleanup_name = 'p120-actions-governance-cleanup-v1.yml'
          active_writer = 'p120-en-system-build-v0.4.yml'
          retire = [
            'apply-v171b-visual-layer.yml','p120-pass2-route-inventory.yml','apply-extended-research-ui-v1.yml',
            'fix-creator-shared-navigation.yml','fix-why-p120-bilingual-ui.yml','apply-plex-sitewide-typography.yml',
            'apply-founder-marginal-voice-v1.yml','apply-prata-sitewide-typography.yml','p120-pass2-2-runtime-isolation-qa.yml',
            'run-p120-system-migration-v1.yml','apply-founder-prata-secondary-serif.yml','apply-v171i-graphite-contrast.yml',
            'p120-independent-render-corrections-v1.yml','apply-v171c-composition-fix.yml','p120-pass3-session-isolation-apply.yml',
            'p120-independent-render-v11-harness-fix.yml','install-founder-marginal-typography-lab.yml',
            'p120-system-start-route-normalization-v1.yml','p120-pass2-1-1-editorial-boundary.yml','apply-locale-v1.yml',
            'p120-pass2-native-route-authority.yml','unpack-p120-hosting.yml','extract-public-localization-inventory.yml',
            'p120-pass2-closure-qa.yml','p120-system-nav-reconciliation-v1.yml','fix-why-symbolic-bridge-nav.yml',
            'materialize-why-p120-preview.yml','p120-system-state-reconciliation-v1.yml','apply-manual-report-handoff-v1.yml',
            'apply-v171d-manifesto.yml','mobile-primary-cta-pass2.yml','p120-instrument-localization-source-v1.yml',
            'apply-submission-intake-v1.yml','build-v171f-hosting-package.yml','apply-extended-navigation-v1.yml',
            'apply-v171g-compatibility-reading.yml','apply-founder-editorial-story-v1.yml','why-p120-first-paint-stabilization.yml',
            'apply-extended-research-set-v1.yml','integrate-why-p120-production.yml','integrate-bilingual-public-site-v1.yml',
            'p120-system-controlled-migration-v1.yml'
          ]
          assert len(retire) == 42 and len(set(retire)) == 42
          retired=[]; absent=[]
          for name in retire:
              p=wf/name
              if p.exists(): p.unlink(); retired.append(name)
              else: absent.append(name)

          # Active EN review remains executable but cannot write to the repository.
          review=wf/'p120-en-translation-review-v0.1.yml'
          if not review.exists(): raise SystemExit('EN_REVIEW_WORKFLOW_MISSING')
          s=review.read_text(encoding='utf-8').replace('contents: write','contents: read')
          start=s.find('\n      - name: Commit review package\n')
          end=s.find('\n      - name: Upload review artifact', start+1)
          if start < 0 or end < 0: raise SystemExit(f'EN_REVIEW_COMMIT_BLOCK_NOT_FOUND start={start} end={end}')
          s=s[:start]+s[end:]
          if 'git push' in s or 'contents: write' in s: raise SystemExit('EN_REVIEW_NOT_READ_ONLY')
          review.write_text(s,encoding='utf-8')

          # Sole temporary writer: EN native-route materializer, write scoped to its job only.
          builder=wf/active_writer
          if not builder.exists(): raise SystemExit('EN_BUILDER_MISSING')
          s=builder.read_text(encoding='utf-8')
          old='permissions:\n  contents: write\n\njobs:\n  build-native-system-routes:\n'
          new='permissions:\n  contents: read\n\njobs:\n  build-native-system-routes:\n    permissions:\n      contents: write\n'
          if old not in s: raise SystemExit('EN_BUILDER_PERMISSION_BLOCK_MISMATCH')
          builder.write_text(s.replace(old,new,1),encoding='utf-8')

          # Any surviving historical workflow that still asked for contents:write is downgraded.
          downgraded=[]
          for p in sorted(wf.glob('*.yml')):
              if p.name in {cleanup_name,active_writer}: continue
              s=p.read_text(encoding='utf-8')
              t=re.sub(r'(?m)^(\s*)contents:\s*write\s*$',r'\1contents: read',s)
              if t != s: downgraded.append(p.name); p.write_text(t,encoding='utf-8')

          governance='''# P-120 GitHub Actions Governance\n\n**Control:** SEC-GH-02 · GitHub Actions executable-surface reduction  \n**Status:** ACTIVE  \n**Effective:** 2026-09-05\n\n## Default rule\nGitHub Actions are read-only by default. Historical one-time apply/fix/migration workflows are not retained as executable automation; Git history is the archive.\n\n## Temporary write allowlist\n- `p120-en-system-build-v0.4.yml` — ACTIVE EN localization materializer. Repository write authority is scoped to the single materialization job. Remove this exception after EN route generation is frozen.\n\n## Invariants\n1. No other workflow may contain `contents: write`.\n2. No other workflow may execute `git push`.\n3. QA/review/audit workflows are read-only.\n4. `pull_request_target` is prohibited without a dedicated security approval.\n5. `pages: write` / `id-token: write` require separate deployment authority and are not part of this allowlist.\n6. Changes under `.github/workflows/**` are checked by `p120-actions-governance-qa.yml`.\n\nThis governance control changes CI/CD authority only. Measurement, scoring, mappings, respondent wording, Supabase data and report logic are unchanged.\n'''
          Path('.github/P120_ACTIONS_GOVERNANCE.md').write_text(governance,encoding='utf-8')

          qa='''name: P120 Actions Governance QA\n\non:\n  push:\n    branches: [main]\n    paths:\n      - '.github/workflows/**'\n      - '.github/P120_ACTIONS_GOVERNANCE.md'\n  pull_request:\n    paths:\n      - '.github/workflows/**'\n      - '.github/P120_ACTIONS_GOVERNANCE.md'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  least-privilege:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n      - name: Enforce P-120 Actions least privilege\n        shell: bash\n        run: |\n          python - <<'PY2'\n          from pathlib import Path\n          import re\n          wf=Path('.github/workflows')\n          allow={'p120-en-system-build-v0.4.yml'}\n          writes=[]; pushes=[]; violations=[]\n          for p in sorted(wf.glob('*.yml')):\n              s=p.read_text(encoding='utf-8')\n              if re.search(r'(?m)^\\s*contents:\\s*write\\s*$',s): writes.append(p.name)\n              if re.search(r'(?m)^\\s*git\\s+push\\b',s): pushes.append(p.name)\n              if 'pull_request_target:' in s: violations.append(p.name+':pull_request_target')\n              if re.search(r'(?m)^\\s*(pages|id-token):\\s*write\\s*$',s): violations.append(p.name+':deployment_write')\n          if set(writes)!=allow: violations.append(f'contents_write observed={writes} expected={sorted(allow)}')\n          if set(pushes)!=allow: violations.append(f'git_push observed={pushes} expected={sorted(allow)}')\n          print('P120_ACTIONS_WORKFLOW_COUNT=',len(list(wf.glob('*.yml'))))\n          print('P120_ACTIONS_CONTENTS_WRITE=',writes)\n          print('P120_ACTIONS_GIT_PUSH=',pushes)\n          if violations:\n              print('\\n'.join('VIOLATION: '+v for v in violations)); raise SystemExit(1)\n          print('P120_SEC_GH_02_GOVERNANCE=PASS')\n          PY2\n'''
          (wf/'p120-actions-governance-qa.yml').write_text(qa,encoding='utf-8')

          # Validate final authority before commit.
          writes=[]; pushes=[]; deploy_writes=[]
          for p in sorted(wf.glob('*.yml')):
              if p.name==cleanup_name: continue
              s=p.read_text(encoding='utf-8')
              if re.search(r'(?m)^\s*contents:\s*write\s*$',s): writes.append(p.name)
              if re.search(r'(?m)^\s*git\s+push\b',s): pushes.append(p.name)
              if re.search(r'(?m)^\s*(pages|id-token):\s*write\s*$',s): deploy_writes.append(p.name)
          if set(writes)!={active_writer}: raise SystemExit('WRITE_ALLOWLIST_MISMATCH '+repr(writes))
          if set(pushes)!={active_writer}: raise SystemExit('PUSH_ALLOWLIST_MISMATCH '+repr(pushes))
          if deploy_writes: raise SystemExit('UNAUTHORIZED_DEPLOY_WRITE '+repr(deploy_writes))

          record={
            'schema':'p120.security.github_actions_pass.v1','control':'SEC-GH-02','date':'2026-09-05',
            'baseline_self_mutating_workflows':44,'retired_writer_workflows':len(retired),
            'retirement_already_absent':absent,'read_only_converted':['p120-en-translation-review-v0.1.yml'],
            'additional_contents_write_downgraded':downgraded,'temporary_write_allowlist':[active_writer],
            'observed_contents_write_after':writes,'observed_git_push_after':pushes,
            'measurement_scoring_impact':'NONE','status':'PASS_PENDING_POST_COMMIT_GOVERNANCE_QA'
          }
          Path('P120_GITHUB_ACTIONS_SECURITY_PASS_v1.0.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          (wf/cleanup_name).unlink()
          print(json.dumps(record,indent=2))
          PY

      - name: Commit controlled Actions reduction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github P120_GITHUB_ACTIONS_SECURITY_PASS_v1.0.json
          git diff --cached --check
          git commit -m 'P120 SEC-GH-02: reduce GitHub Actions write surface'
          git push
