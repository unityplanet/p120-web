name: P120 SEC-GH-02 Actions Governance Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-actions-governance-cleanup-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p120-sec-gh-02-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire historical writers and install governance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          wf = Path('.github/workflows')
          cleanup_name = 'p120-actions-governance-cleanup-v1.yml'
          active_writer = 'p120-en-system-build-v0.4.yml'

          retire = [
            'apply-v171b-visual-layer.yml',
            'p120-pass2-route-inventory.yml',
            'apply-extended-research-ui-v1.yml',
            'fix-creator-shared-navigation.yml',
            'fix-why-p120-bilingual-ui.yml',
            'apply-plex-sitewide-typography.yml',
            'apply-founder-marginal-voice-v1.yml',
            'apply-prata-sitewide-typography.yml',
            'p120-pass2-2-runtime-isolation-qa.yml',
            'run-p120-system-migration-v1.yml',
            'apply-founder-prata-secondary-serif.yml',
            'apply-v171i-graphite-contrast.yml',
            'p120-independent-render-corrections-v1.yml',
            'apply-v171c-composition-fix.yml',
            'p120-pass3-session-isolation-apply.yml',
            'p120-independent-render-v11-harness-fix.yml',
            'install-founder-marginal-typography-lab.yml',
            'p120-system-start-route-normalization-v1.yml',
            'p120-pass2-1-1-editorial-boundary.yml',
            'apply-locale-v1.yml',
            'p120-pass2-native-route-authority.yml',
            'unpack-p120-hosting.yml',
            'extract-public-localization-inventory.yml',
            'p120-pass2-closure-qa.yml',
            'p120-system-nav-reconciliation-v1.yml',
            'fix-why-symbolic-bridge-nav.yml',
            'materialize-why-p120-preview.yml',
            'p120-system-state-reconciliation-v1.yml',
            'apply-manual-report-handoff-v1.yml',
            'apply-v171d-manifesto.yml',
            'mobile-primary-cta-pass2.yml',
            'p120-instrument-localization-source-v1.yml',
            'apply-submission-intake-v1.yml',
            'build-v171f-hosting-package.yml',
            'apply-extended-navigation-v1.yml',
            'apply-v171g-compatibility-reading.yml',
            'apply-founder-editorial-story-v1.yml',
            'why-p120-first-paint-stabilization.yml',
            'apply-extended-research-set-v1.yml',
            'integrate-why-p120-production.yml',
            'integrate-bilingual-public-site-v1.yml',
            'p120-system-controlled-migration-v1.yml',
          ]
          assert len(retire) == 42 and len(set(retire)) == 42

          existing = []
          already_absent = []
          for name in retire:
              p = wf / name
              if p.exists():
                  p.unlink()
                  existing.append(name)
              else:
                  already_absent.append(name)

          # Preserve the active EN translation review, but make it artifact-only/read-only.
          review = wf / 'p120-en-translation-review-v0.1.yml'
          if not review.exists():
              raise SystemExit('Active EN translation review workflow missing')
          s = review.read_text(encoding='utf-8')
          s = s.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n')
          s, n = re.subn(
              r'\n      - name: Commit review package\n.*?(?=\n      - name: Upload review artifact)',
              '', s, flags=re.S
          )
          if n != 1:
              raise SystemExit(f'Expected exactly one EN review commit block, removed={n}')
          if re.search(r'(?m)^\s*git\s+push\b', s) or 'contents: write' in s:
              raise SystemExit('EN translation review did not become read-only')
          review.write_text(s, encoding='utf-8')

          # Narrow the only temporarily-authorized writer to one job, not the whole workflow.
          builder = wf / active_writer
          if not builder.exists():
              raise SystemExit('Active EN system builder missing')
          s = builder.read_text(encoding='utf-8')
          old = 'permissions:\n  contents: write\n\njobs:\n  build-native-system-routes:\n'
          new = 'permissions:\n  contents: read\n\njobs:\n  build-native-system-routes:\n    permissions:\n      contents: write\n'
          if old not in s:
              raise SystemExit('EN system builder permission block not in expected form')
          builder.write_text(s.replace(old, new, 1), encoding='utf-8')

          # All other surviving workflows: explicit read-only contents by default.
          for p in sorted(wf.glob('*.yml')):
              if p.name in {cleanup_name, active_writer}:
                  continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^(\s*)contents:\s*write\s*$', r'\1contents: read', text)
              if not re.search(r'(?m)^permissions:\s*$', text):
                  if '\njobs:\n' not in text:
                      raise SystemExit(f'Cannot insert permissions before jobs in {p.name}')
                  text = text.replace('\njobs:\n', '\npermissions:\n  contents: read\n\njobs:\n', 1)
              p.write_text(text, encoding='utf-8')

          governance = '''# P-120 GitHub Actions Governance\n\n**Control:** SEC-GH-02 · GitHub Actions executable-surface reduction  \n**Status:** ACTIVE  \n**Effective:** 2026-09-05\n\n## Default rule\n\nGitHub Actions are read-only by default. A workflow may receive repository write authority only when the write is an explicit, current production/development contract and the workflow is named in the temporary allowlist below. Historical one-time apply/fix/migration workflows must not remain executable merely for archival purposes; Git history is the archive.\n\n## Current write allowlist\n\n- `p120-en-system-build-v0.4.yml` — TEMPORARY / ACTIVE EN LOCALIZATION BUILD. `contents: write` is scoped to the materialization job only. Remove this exception when EN route generation no longer needs to commit generated routes.\n\n## Required invariants\n\n1. No other workflow may contain `contents: write`.\n2. No other workflow may execute `git push`.\n3. Surviving workflows must declare an explicit top-level `permissions:` block.\n4. `pull_request_target` is prohibited unless separately security-reviewed and explicitly authorized.\n5. `pages: write` and `id-token: write` are prohibited in repository workflows unless a dedicated deployment authority is approved.\n6. QA/review/audit workflows are read-only. Generated QA material should normally be uploaded as workflow artifacts rather than committed by the workflow.\n7. Changes to this control file or `.github/workflows/**` are checked by `p120-actions-governance-qa.yml`.\n\n## Scope note\n\nThis control changes CI/CD authority only. It does not change P-120 measurement, scoring, mappings, respondent wording, scientific content, Supabase data, or report logic.\n'''
          Path('.github/P120_ACTIONS_GOVERNANCE.md').write_text(governance, encoding='utf-8')

          qa = '''name: P120 Actions Governance QA\n\non:\n  push:\n    branches: [main]\n    paths:\n      - '.github/workflows/**'\n      - '.github/P120_ACTIONS_GOVERNANCE.md'\n  pull_request:\n    paths:\n      - '.github/workflows/**'\n      - '.github/P120_ACTIONS_GOVERNANCE.md'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  least-privilege:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n      - name: Enforce P-120 Actions least privilege\n        shell: bash\n        run: |\n          python - <<'PY2'\n          from pathlib import Path\n          import re\n          wf = Path('.github/workflows')\n          write_allow = {'p120-en-system-build-v0.4.yml'}\n          violations = []\n          write_files = []\n          push_files = []\n          for p in sorted(wf.glob('*.yml')):\n              text = p.read_text(encoding='utf-8')\n              if not re.search(r'(?m)^permissions:\\s*$', text):\n                  violations.append(f'{p.name}: missing explicit top-level permissions block')\n              has_write = bool(re.search(r'(?m)^\\s*contents:\\s*write\\s*$', text))\n              has_push = bool(re.search(r'(?m)^\\s*git\\s+push\\b', text))\n              if has_write:\n                  write_files.append(p.name)\n              if has_push:\n                  push_files.append(p.name)\n              if (has_write or has_push) and p.name not in write_allow:\n                  violations.append(f'{p.name}: unauthorized repository write surface')\n              if 'pull_request_target:' in text:\n                  violations.append(f'{p.name}: pull_request_target is prohibited')\n              if re.search(r'(?m)^\\s*(pages|id-token):\\s*write\\s*$', text):\n                  violations.append(f'{p.name}: pages/id-token write requires separate deployment authority')\n          if set(write_files) != write_allow:\n              violations.append(f'write allowlist mismatch: observed={write_files} expected={sorted(write_allow)}')\n          if set(push_files) != write_allow:\n              violations.append(f'git push allowlist mismatch: observed={push_files} expected={sorted(write_allow)}')\n          print(f'P120_ACTIONS_WORKFLOWS={len(list(wf.glob("*.yml")))}')\n          print(f'P120_ACTIONS_WRITE_FILES={write_files}')\n          print(f'P120_ACTIONS_GIT_PUSH_FILES={push_files}')\n          if violations:\n              print('\\n'.join('VIOLATION: '+v for v in violations))\n              raise SystemExit(1)\n          print('P120_SEC_GH_02_GOVERNANCE=PASS')\n          PY2\n'''
          (wf / 'p120-actions-governance-qa.yml').write_text(qa, encoding='utf-8')

          pass_record = {
              'schema':'p120.security.github_actions_pass.v1',
              'control':'SEC-GH-02',
              'date':'2026-09-05',
              'baseline_self_mutating_workflows':44,
              'retired_writer_workflows':len(existing),
              'already_absent_from_retirement_set':already_absent,
              'read_only_converted':['p120-en-translation-review-v0.1.yml'],
              'temporary_write_allowlist':[active_writer],
              'expected_self_mutating_workflows_after':1,
              'measurement_scoring_impact':'NONE',
              'status':'PASS_PENDING_POST_COMMIT_QA'
          }
          Path('P120_GITHUB_ACTIONS_SECURITY_PASS_v1.0.json').write_text(json.dumps(pass_record, indent=2)+'\n', encoding='utf-8')

          # Pre-commit invariant check: no unauthorized push/write remains.
          bad = []
          for p in sorted(wf.glob('*.yml')):
              if p.name == cleanup_name:
                  continue
              text = p.read_text(encoding='utf-8')
              has_write = bool(re.search(r'(?m)^\s*contents:\s*write\s*$', text))
              has_push = bool(re.search(r'(?m)^\s*git\s+push\b', text))
              if (has_write or has_push) and p.name != active_writer:
                  bad.append(p.name)
              if 'pull_request_target:' in text:
                  bad.append(p.name+':pull_request_target')
              if re.search(r'(?m)^\s*(pages|id-token):\s*write\s*$', text):
                  bad.append(p.name+':deployment-write')
          if bad:
              raise SystemExit('Unauthorized workflow authority remains: '+', '.join(sorted(set(bad))))

          # Self-retire the privileged cleanup workflow so it cannot be rerun later.
          (wf / cleanup_name).unlink()
          print(json.dumps(pass_record, indent=2))
          PY

      - name: Commit controlled Actions reduction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github P120_GITHUB_ACTIONS_SECURITY_PASS_v1.0.json
          git diff --cached --check
          git commit -m 'P120 SEC-GH-02: reduce GitHub Actions write surface'
          git push
