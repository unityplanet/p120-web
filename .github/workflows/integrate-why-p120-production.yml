name: Integrate Why P-120 into production

on:
  push:
    paths:
      - '.github/workflows/integrate-why-p120-production.yml'
      - '.github/scripts/integrate_why_p120.py'
      - '.github/scripts/apply_why_p120_act2_semantic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 .github/scripts/integrate_why_p120.py

      - name: Validate Brand Origin script
        run: node --check why-p120/why-p120.js

      - name: Build bilingual ACT 2 semantic object
        run: python3 .github/scripts/apply_why_p120_act2_semantic.py

      - name: Convert static Brand Origin teaser to scroll interstitial
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style = r'''<style id="brand-origin-scroll-interstitial-v1">
          .brand-origin-teaser{display:none!important}
          .brand-origin-scroll-trigger{display:block;width:100%;height:1px;pointer-events:none;opacity:0}
          .brand-origin-interstitial{position:fixed;z-index:88;left:50%;bottom:clamp(20px,3vw,42px);width:min(1160px,calc(100vw - 56px));transform:translate(-50%,calc(100% + 90px));opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.10);border-radius:clamp(24px,2.4vw,38px);background:radial-gradient(700px 380px at 78% 38%,rgba(86,116,137,.15),transparent 64%),linear-gradient(135deg,#07090a 0%,#0a0d0f 60%,#101316 100%);color:#f3eee5;box-shadow:0 36px 120px rgba(0,0,0,.34);overflow:hidden;transition:transform .52s cubic-bezier(.2,.74,.18,1),opacity .38s ease;isolation:isolate}
          .brand-origin-interstitial.is-open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
          .brand-origin-interstitial:before{content:"";position:absolute;right:-7%;top:-60%;width:min(560px,46vw);aspect-ratio:1;border-radius:50%;border:1px solid rgba(129,153,176,.15);box-shadow:0 0 0 56px rgba(129,153,176,.032),0 0 0 112px rgba(129,153,176,.018);pointer-events:none}
          .brand-origin-interstitial-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(360px,1.1fr);gap:clamp(30px,5vw,72px);align-items:center;padding:clamp(30px,4.6vw,62px)}
          .brand-origin-interstitial-copy{max-width:560px}.brand-origin-interstitial-kicker{display:block;font:800 9px/1.2 Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.16em;color:#c7a05b;margin-bottom:14px}
          .brand-origin-interstitial h2{font-family:"Noto Serif Display","Noto Serif",Georgia,serif;font-size:clamp(42px,4.5vw,74px);font-weight:500;line-height:.96;letter-spacing:-.045em;color:#f5efe6;margin:0 0 18px}.brand-origin-interstitial p{font-size:clamp(16px,1.15vw,19px);line-height:1.55;color:rgba(241,236,226,.72);margin:0;max-width:35ch}
          .brand-origin-interstitial-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.brand-origin-interstitial a,.brand-origin-interstitial button{font:800 12px/1 Inter,system-ui,sans-serif;border-radius:999px;min-height:46px;padding:0 19px;cursor:pointer}.brand-origin-interstitial a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;background:#f3eee5;color:#121212;border:1px solid #f3eee5}.brand-origin-interstitial .brand-origin-continue{background:transparent;color:#f3eee5;border:1px solid rgba(255,255,255,.28)}
          .brand-origin-interstitial-visual{position:relative;min-height:180px;display:grid;place-items:center;text-align:center}.brand-origin-interstitial-visual strong{font-family:"Noto Serif Display","Noto Serif",Georgia,serif;font-size:clamp(82px,8vw,146px);font-weight:500;line-height:.82;letter-spacing:-.07em;color:#f5f0e7;white-space:nowrap}.brand-origin-interstitial-visual span{font-family:"Noto Serif",Georgia,serif;font-size:clamp(24px,2.2vw,38px);color:#d8c29e;margin-top:14px}.brand-origin-interstitial-ghost{position:absolute;right:-5%;bottom:-42%;font-family:"Noto Serif Display","Noto Serif",Georgia,serif;font-size:min(25vw,330px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.045);z-index:-1;user-select:none}
          .brand-origin-interstitial-close{position:absolute;z-index:3;right:15px;top:15px;width:38px;height:38px!important;min-height:38px!important;padding:0!important;border:1px solid rgba(255,255,255,.18)!important;background:rgba(255,255,255,.04)!important;color:#f3eee5!important;font-size:20px!important;font-weight:400!important;display:grid;place-items:center}
          @media(max-width:800px){.brand-origin-interstitial{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:auto;border-radius:28px;transform:translateY(calc(100% + 40px))}.brand-origin-interstitial.is-open{transform:translateY(0)}.brand-origin-interstitial-inner{grid-template-columns:1fr;padding:30px 22px 24px;gap:18px}.brand-origin-interstitial h2{font-size:clamp(40px,11vw,60px);padding-right:30px}.brand-origin-interstitial-visual{min-height:105px;display:flex;align-items:baseline;justify-content:flex-start;gap:14px;text-align:left}.brand-origin-interstitial-visual strong{font-size:clamp(64px,19vw,92px)}.brand-origin-interstitial-visual span{font-size:clamp(21px,6vw,30px);margin:0}.brand-origin-interstitial-ghost{display:none}.brand-origin-interstitial-actions{display:grid;grid-template-columns:1fr}.brand-origin-interstitial a,.brand-origin-interstitial button{width:100%;justify-content:center}}
          @media(prefers-reduced-motion:reduce){.brand-origin-interstitial{transition:none}}
          </style>'''

          script = r'''<script id="brand-origin-scroll-interstitial-runtime-v1">
          (()=>{
            'use strict';
            const KEY='p120-brand-origin-interstitial-v1';
            const isEn=/\/en\/(?:index\.html)?$/i.test(location.pathname);
            let io=null, observed=null, panel=null, shownMemory=false;
            const copy=isEn?{
              kicker:'THE NAME · BRAND ORIGIN',title:'Why P-120?',body:'72 + 48 explain the number. But not the whole meaning of the name.',cta:'Discover the story',cont:'Continue reading',eq:'72 + 48 = 120'
            }:{
              kicker:'THE NAME · BRAND ORIGIN',title:'Почему P-120?',body:'72 + 48 объясняют число. Но не весь смысл названия.',cta:'Узнать историю',cont:'Продолжить чтение',eq:'72 + 48 = 120'
            };
            const seen=()=>{try{return sessionStorage.getItem(KEY)==='1'}catch(_){return shownMemory}};
            const markSeen=()=>{shownMemory=true;try{sessionStorage.setItem(KEY,'1')}catch(_){}};
            function closePanel(){if(panel)panel.classList.remove('is-open')}
            function ensurePanel(){
              if(panel&&document.body.contains(panel))return panel;
              panel=document.createElement('aside');
              panel.className='brand-origin-interstitial';
              panel.setAttribute('role','dialog');
              panel.setAttribute('aria-modal','false');
              panel.setAttribute('aria-label',copy.title);
              const href=isEn?'../why-p120/':'why-p120/';
              panel.innerHTML=`<button type="button" class="brand-origin-interstitial-close" aria-label="${isEn?'Close':'Закрыть'}">×</button><div class="brand-origin-interstitial-inner"><div class="brand-origin-interstitial-copy"><span class="brand-origin-interstitial-kicker">${copy.kicker}</span><h2>${copy.title}</h2><p>${copy.body}</p><div class="brand-origin-interstitial-actions"><a href="${href}">${copy.cta} <span aria-hidden="true">→</span></a><button type="button" class="brand-origin-continue">${copy.cont}</button></div></div><div class="brand-origin-interstitial-visual" aria-hidden="true"><strong>P-120</strong><span>${copy.eq}</span><i class="brand-origin-interstitial-ghost">P</i></div></div>`;
              document.body.appendChild(panel);
              panel.querySelector('.brand-origin-interstitial-close').addEventListener('click',closePanel);
              panel.querySelector('.brand-origin-continue').addEventListener('click',closePanel);
              panel.querySelector('a').addEventListener('click',markSeen);
              return panel;
            }
            function showPanel(){if(seen())return;markSeen();ensurePanel();requestAnimationFrame(()=>panel.classList.add('is-open'))}
            function sync(){
              const teaser=document.querySelector('.brand-origin-teaser');
              if(!teaser){closePanel();return}
              teaser.setAttribute('aria-hidden','true');
              let trigger=teaser.previousElementSibling;
              if(!trigger||!trigger.classList.contains('brand-origin-scroll-trigger')){
                trigger=document.createElement('span');
                trigger.className='brand-origin-scroll-trigger';
                trigger.setAttribute('aria-hidden','true');
                teaser.parentNode.insertBefore(trigger,teaser);
              }
              if(seen()||observed===trigger)return;
              if(io)io.disconnect();
              observed=trigger;
              if('IntersectionObserver' in window){
                io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){showPanel();io.disconnect()}}),{threshold:0,rootMargin:'0px 0px -32% 0px'});
                io.observe(trigger);
              }else{
                const onScroll=()=>{const r=trigger.getBoundingClientRect();if(r.top<innerHeight*.68&&r.bottom>0){removeEventListener('scroll',onScroll);showPanel()}};
                addEventListener('scroll',onScroll,{passive:true});onScroll();
              }
            }
            document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
            const mo=new MutationObserver(()=>requestAnimationFrame(sync));
            mo.observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync,{once:true});else sync();
          })();
          </script>'''

          for name in ('index.html','en/index.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'id="brand-origin-scroll-interstitial-v1"' not in s:
                  s=s.replace('</head>',style+'\n</head>',1)
              if 'id="brand-origin-scroll-interstitial-runtime-v1"' not in s:
                  s=s.replace('</body>',script+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

          print('Brand Origin static teaser hidden; scroll interstitial runtime installed')
          PY

      - name: Commit integrated production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html why-p120/index.html en/why-p120/index.html why-p120/why-p120.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update Why P-120 production integration'
            git push origin HEAD:main
          fi
