name: Integrate Why P-120 into production

on:
  push:
    paths:
      - '.github/workflows/integrate-why-p120-production.yml'
      - '.github/scripts/integrate_why_p120.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 .github/scripts/integrate_why_p120.py

      - name: Validate Brand Origin script
        run: node --check why-p120/why-p120.js

      - name: Commit integrated production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html why-p120/index.html why-p120/why-p120.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Why P-120 brand origin into production'
            git push origin HEAD:main
          fi
