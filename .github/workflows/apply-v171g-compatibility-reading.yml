name: Apply P-120 v1.7.1g compatibility reading

on:
  push:
    branches: [main]
    paths:
      - visual-fix-v1.7.1g.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          tag = '<link rel="stylesheet" href="visual-fix-v1.7.1g.css?v=171g" data-p120-visual-fix="v1.7.1g" />'
          text = re.sub(r'\s*<link[^>]+data-p120-visual-fix="v1\.7\.1g"[^>]*>\s*', '\n', text, count=1, flags=re.I)
          if '</head>' not in text:
              raise SystemExit('index.html: </head> not found')
          text = text.replace('</head>', '  ' + tag + '\n</head>', 1)

          start = '/* P120 v1.7.1g COMPATIBILITY READING START */'
          end = '/* P120 v1.7.1g COMPATIBILITY READING END */'
          text = re.sub(re.escape(start) + r'.*?' + re.escape(end) + r'\s*', '', text, flags=re.S)

          renderer_lines = [
              start,
              'function isCompatibilityReadingSection(section){',
              '  const body=section?.body||[];',
              "  return body[0]==='Можно очень любить человека и при этом по-разному переживать близость.';",
              '}',
              'function renderCompatibilityReading(section){',
              "  const body=section.body||[];",
              "  const title=body[0]||'';",
              '  const cards=body.slice(1,5);',
              '  const outro=body.slice(5,7);',
              '  return `<section class="compatibility-reading" aria-label="${esc(title)}">',
              '    <aside class="compatibility-reading-rail">',
              '      <div class="compatibility-reading-eyebrow">${esc(section.flash||\'\')}</div>',
              '      <div class="compatibility-reading-orbit" aria-hidden="true"><span></span><i></i><b></b></div>',
              '    </aside>',
              '    <div class="compatibility-reading-main">',
              '      <h2 class="compatibility-reading-title">${esc(title)}</h2>',
              '      <div class="compatibility-reading-grid">',
              '        ${cards.map((p,i)=>`<article class="compatibility-reading-card"><span class="compatibility-reading-index">0${i+1}</span><p>${esc(p)}</p></article>`).join(\'\')}',
              '      </div>',
              '      <div class="compatibility-reading-outro">',
              '        <p class="compatibility-reading-outro-lead">${esc(outro[0]||\'\')}</p>',
              '        <p class="compatibility-reading-outro-note">${esc(outro[1]||\'\')}</p>',
              '      </div>',
              '    </div>',
              '  </section>`;',
              '}',
              end,
          ]
          renderer = '\n'.join(renderer_lines) + '\n'

          anchor = 'function renderEditorialSection(section){'
          if anchor not in text:
              raise SystemExit('renderEditorialSection anchor not found')
          text = text.replace(anchor, renderer + '\n' + anchor, 1)

          old_route = '${renderEditorialBody(section)}'
          new_route = '${isCompatibilityReadingSection(section)?renderCompatibilityReading(section):renderEditorialBody(section)}'
          if new_route not in text:
              count = text.count(old_route)
              if count != 1:
                  raise SystemExit(f'Expected one generic editorial body route, found {count}')
              text = text.replace(old_route, new_route, 1)

          p.write_text(text, encoding='utf-8')
          print('v1.7.1g patch applied')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply v1.7.1g framed compatibility reading design"
          git push
