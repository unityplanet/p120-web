name: P120 HG-CGA PASS2 one-time integration

on:
  push:
    branches: [feat/hgcga-web-implementation-pass2]
    paths:
      - '.github/workflows/hgcga-pass2-one-time.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hgcga-web-implementation-pass2
      - name: Install controlled HG-CGA surfaces and navigation patch
        shell: bash
        env:
          ASSET_B64: 
        run: |
          python - <<'PY2'
          import os,base64,tarfile,io
          from pathlib import Path
          data=base64.b64decode(os.environ['ASSET_B64'])
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
              tf.extractall('.')

          def must_replace(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'anchor not found: {label}')
              return s.replace(old,new)

          p=Path('p120-brand-system-v1.0.js')
          s=p.read_text(encoding='utf-8')
          s=must_replace(s,
              "    deeper:'Go deeper', deeperNote:'Extended Research Set · optional research', together:'Together?', togetherNote:'Dyadic research layer · relationship research',\n    contact:'Contact', contactNote:'Write to P-120',",
              "    deeper:'Go deeper', deeperNote:'Extended Research Set · optional research', together:'Together?', togetherNote:'Dyadic research layer · relationship research',\n    decisionResearch:'Decision research', decisionResearchNote:'Human-governed cognitive analysis research',\n    contact:'Contact', contactNote:'Write to P-120',",'brand EN copy')
          s=must_replace(s,
              "    deeper:'Хотите глубже?', deeperNote:'Система углублённых исследований', together:'Мы вместе?', togetherNote:'Исследование пары',\n    contact:'Контакты', contactNote:'Связаться с P-120',",
              "    deeper:'Хотите глубже?', deeperNote:'Система углублённых исследований', together:'Мы вместе?', togetherNote:'Исследование пары',\n    decisionResearch:'Исследование решений', decisionResearchNote:'Проект управляемого когнитивного анализа',\n    contact:'Контакты', contactNote:'Связаться с P-120',",'brand RU copy')
          s=must_replace(s,
              "    for(const k of ['intellectual-property','privacy','terms','about','why-p120','creator','extended','together','science','contact']){",
              "    if(p.includes('/research/how-we-decide/')) return 'research/how-we-decide';\n    for(const k of ['intellectual-property','privacy','terms','about','why-p120','creator','extended','together','science','contact']){",'brand page kind')
          s=must_replace(s,
              "<a class=\"p120-brand53-mega-card\" href=\"${routeFor('together')}\"${current('together')}><strong>${copy.together}</strong><small>${copy.togetherNote}</small></a></section>",
              "<a class=\"p120-brand53-mega-card\" href=\"${routeFor('together')}\"${current('together')}><strong>${copy.together}</strong><small>${copy.togetherNote}</small></a><a class=\"p120-brand53-mega-card\" href=\"${routeFor('research/how-we-decide')}\"${current('research/how-we-decide')}><strong>${copy.decisionResearch}</strong><small>${copy.decisionResearchNote}</small></a></section>",'brand mega research card')
          s=must_replace(s,
              "<a href=\"${routeFor('together')}\">${copy.together}</a><a href=\"${routeFor('science')}\">${copy.science}</a>",
              "<a href=\"${routeFor('together')}\">${copy.together}</a><a href=\"${routeFor('research/how-we-decide')}\">${copy.decisionResearch}</a><a href=\"${routeFor('science')}\">${copy.science}</a>",'brand footer research link')
          marker="  function patchFooter(){\n"
          mobile_fn="""  function patchResearchMobileDiscovery(){
    const href=routeFor('research/how-we-decide');
    const selectors='.about-drawer nav,.creator-drawer nav,.wp-drawer nav,.explore-drawer nav,nav[aria-label="Мобильная навигация"],nav[aria-label="Mobile navigation"]';
    document.querySelectorAll(selectors).forEach(nav=>{
      if(nav.querySelector('[data-p120-decision-research-discovery]')) return;
      const a=document.createElement('a');
      a.href=href; a.dataset.p120DecisionResearchDiscovery='5.3.3';
      a.innerHTML=`<strong>${copy.decisionResearch}</strong><small>${copy.decisionResearchNote}</small>`;
      if(pageKind==='research/how-we-decide') a.setAttribute('aria-current','page');
      nav.appendChild(a);
    });
  }

"""
          if 'function patchResearchMobileDiscovery()' not in s:
              s=must_replace(s,marker,mobile_fn+marker,'brand mobile discovery insertion')
          s=must_replace(s,"      patchMobileContact();\n      patchFooter();","      patchMobileContact();\n      patchResearchMobileDiscovery();\n      patchFooter();",'brand reconcile research mobile')
          p.write_text(s,encoding='utf-8')

          def patch_nav_text(s,label):
              s=must_replace(s,
                  "    together:'Together?', togetherNote:'Dyadic research layer',\n    coming:'Coming', language:'Language'",
                  "    together:'Together?', togetherNote:'Dyadic research layer',\n    decisionResearch:'Decision research', decisionResearchNote:'Human-governed cognitive analysis research',\n    coming:'Coming', language:'Language'",label+' EN copy')
              s=must_replace(s,
                  "    together:'Мы вместе?', togetherNote:'Dyadic research layer · исследование пары',\n    coming:'Готовится', language:'Language'",
                  "    together:'Мы вместе?', togetherNote:'Dyadic research layer · исследование пары',\n    decisionResearch:'Исследование решений', decisionResearchNote:'Проект управляемого когнитивного анализа',\n    coming:'Готовится', language:'Language'",label+' RU copy')
              s=must_replace(s,
                  "    together:{status:'reserved',route:'together'}\n  };",
                  "    together:{status:'reserved',route:'together'},\n    decisionResearch:{status:'active',href:'research/how-we-decide/'}\n  };",label+' route')
              s=must_replace(s,
                  "${itemMarkup('deeper',copy.deeper,copy.deeperNote)}${itemMarkup('together',copy.together,copy.togetherNote)}",
                  "${itemMarkup('deeper',copy.deeper,copy.deeperNote)}${itemMarkup('together',copy.together,copy.togetherNote)}${itemMarkup('decisionResearch',copy.decisionResearch,copy.decisionResearchNote)}",label+' desktop item')
              s=must_replace(s,
                  "[['deeper',copy.deeper,copy.deeperNote],['together',copy.together,copy.togetherNote]]",
                  "[['deeper',copy.deeper,copy.deeperNote],['together',copy.together,copy.togetherNote],['decisionResearch',copy.decisionResearch,copy.decisionResearchNote]]",label+' mobile item')
              return s
          for fn in ['navigation-architecture-v2.js','p120-public-runtime-v1.0.js']:
              pp=Path(fn); txt=pp.read_text(encoding='utf-8'); pp.write_text(patch_nav_text(txt,fn),encoding='utf-8')
          PY2
          node --check p120-brand-system-v1.0.js
          node --check navigation-architecture-v2.js
          node --check p120-public-runtime-v1.0.js
          node --check research/how-we-decide/how-we-decide-v0.2.js
          node --check en/research/how-we-decide/how-we-decide-v0.2.js
          git config user.name 'p120-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add p120-brand-system-v1.0.js navigation-architecture-v2.js p120-public-runtime-v1.0.js research/how-we-decide en/research/how-we-decide
          git commit -m 'Integrate HG-CGA decision research surface [skip ci]'
          git push origin HEAD:feat/hgcga-web-implementation-pass2
