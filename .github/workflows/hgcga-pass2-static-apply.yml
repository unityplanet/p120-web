name: HG-CGA PASS2 static-surface apply

on:
  push:
    branches:
      - feat/hgcga-web-implementation-pass2
    paths:
      - .github/workflows/hgcga-pass2-static-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hgcga-web-implementation-pass2
          fetch-depth: 0
      - name: Apply static-surface reconciliation
        run: python tools/hgcga_pass2_static_surface_patch.py
      - name: Verify static research discovery where static reconciliation is required
        shell: python
        run: |
          from pathlib import Path
          files=['about/index.html','creator/index.html','extended/index.html','together/index.html','contact/index.html','en/about/index.html','en/creator/index.html','en/extended/index.html','en/together/index.html','en/contact/index.html']
          bad=[]
          for f in files:
              t=Path(f).read_text(encoding='utf-8')
              if 'research/how-we-decide/' not in t:
                  bad.append(f)
          if bad:
              raise SystemExit('missing static research discovery: '+', '.join(bad))
          print('static-surface research discovery: PASS')
          print('why-p120 and science remain runtime-controlled and are verified by browser regression.')
      - name: Commit controlled static-surface navigation delta
        run: |
          if git diff --quiet; then
            echo 'No static-surface delta.'
            exit 0
          fi
          git config user.name 'p120-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add about creator extended together contact en/about en/creator en/extended en/together en/contact
          git commit -m 'Wire HG-CGA research into global static navigation [skip ci]'
          git push origin HEAD:feat/hgcga-web-implementation-pass2
