name: P-120 EN Translation Review v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-en-translation-review-v0.1.yml'
      - 'localization/p120-en-instrument-meta-draft-v0.1.json'
      - 'localization/p120-en-items-*.js'
      - 'localization/p120-instrument-ru-source-v1.0.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bilingual translation review register
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json, re

          root = Path('localization')
          ru = json.loads((root/'p120-instrument-ru-source-v1.0.json').read_text(encoding='utf-8'))
          meta = json.loads((root/'p120-en-instrument-meta-draft-v0.1.json').read_text(encoding='utf-8'))

          en = {}
          for p in sorted(root.glob('p120-en-items-*.js')):
              s = p.read_text(encoding='utf-8')
              m = re.search(r'Object\.assign\(window\.P120_EN_ITEM_TRANSLATIONS \|\| \{\},\s*(\{.*\})\);\s*$', s, re.S)
              if not m:
                  raise SystemExit(f'Cannot parse {p}')
              en.update(json.loads(m.group(1)))

          items = ru['items']
          ids = [x['id'] for x in items]
          if len(items) != 180 or len(set(ids)) != 180:
              raise SystemExit(f'RU source integrity failure: {len(items)} items / {len(set(ids))} unique IDs')
          missing = [i for i in ids if i not in en]
          extra = [i for i in en if i not in set(ids)]
          if missing or extra:
              raise SystemExit(f'EN coverage failure. missing={missing} extra={extra}')

          standard_ru_prompt = 'Если сохранить можно только один механизм, что для вас труднее заменить?'
          source_anomaly = set()
          for x in items:
              if x.get('type') == 'comparative' and x.get('text') != standard_ru_prompt:
                  source_anomaly.add(x['id'])

          def esc_md(s):
              return str(s or '').replace('|','\\|').replace('\n','<br>')

          # TSV - analysis master
          tsv_path = root/'P120_EN_TRANSLATION_REVIEW_v0.1.tsv'
          with tsv_path.open('w', encoding='utf-8', newline='') as f:
              w = csv.writer(f, delimiter='\t', lineterminator='\n')
              w.writerow(['item_id','module','type','ru_text','en_text_draft','ru_option_a','en_option_a_draft','ru_option_b','en_option_b_draft','review_status','source_note'])
              for x in items:
                  y = en[x['id']]
                  note = 'SOURCE CONCATENATION ANOMALY IN CURRENT RUNTIME EXPORT - verify against frozen scientific authority before release' if x['id'] in source_anomaly else ''
                  status = 'DRAFT / SEMANTIC AUDIT REQUIRED'
                  w.writerow([x['id'],x['module'],x['type'],x.get('text',''),y.get('text',''),x.get('optionA',''),y.get('optionA',''),x.get('optionB',''),y.get('optionB',''),status,note])

          # Markdown - human review copy
          md = []
          md += ['# P-120 English Translation Review Register', '',
                 '**Document status:** DRAFT / CONTROLLED REVIEW COPY / NOT FOR RUNTIME RELEASE  ',
                 '**Localization status:** Construct-preserving English draft; semantic-equivalence audit pending  ',
                 '**RU source:** Frozen P-120 runtime export currently mounted at `/system/`  ',
                 '**EN target route after approval:** `/en/system/`  ',
                 '**Measurement/scoring changes:** NONE', '',
                 '## Control summary', '',
                 f'- RU items: **{len(items)}**',
                 f'- EN draft coverage: **{len(en)}/{len(items)}**',
                 '- Item IDs: **preserved 180/180**',
                 '- Module order preserved: **SAT24 → P72 → P72D → AO12 → SOMA24**',
                 '- This file is a review instrument, not a release authority.',
                 '- English wording may be revised during semantic, cognitive-readability, and back-translation audit without changing item IDs or scoring bindings.', '',
                 '## Instrument-level localization', '',
                 f'**Status RU:** {esc_md(ru.get("status"))}  ',
                 f'**Status EN draft:** {esc_md(meta.get("instrumentStatus"))}', '',
                 f'**Disclaimer RU:** {esc_md(ru.get("disclaimer"))}', '',
                 f'**Disclaimer EN draft:** {esc_md(meta.get("disclaimer"))}', '',
                 '### Module titles and respondent instructions', '']

          ru_modules = {m['id']:m for m in ru.get('modules',[])}
          for mid in ['SAT24','P72','P72D','AO12','SOMA24']:
              r = ru_modules[mid]; e = meta['modules'][mid]
              md += [f'#### {mid} · {esc_md(r.get("name"))}', '',
                     f'**RU title:** {esc_md(r.get("title"))}  ',
                     f'**EN draft:** {esc_md(e.get("title"))}', '',
                     f'**RU subtitle:** {esc_md(r.get("subtitle"))}  ',
                     f'**EN draft:** {esc_md(e.get("subtitle"))}', '',
                     f'**RU intro:** {esc_md(r.get("intro"))}', '',
                     f'**EN draft:** {esc_md(e.get("intro"))}', '']

          md += ['---', '', '## Item-by-item bilingual register', '']
          current = None
          for x in items:
              if x['module'] != current:
                  current = x['module']
                  md += [f'### {current}', '']
              y = en[x['id']]
              flag = ' ⚠ SOURCE EXPORT ANOMALY' if x['id'] in source_anomaly else ''
              md += [f'#### {x["id"]}{flag}', '',
                     f'**RU:** {esc_md(x.get("text"))}', '',
                     f'**EN draft:** {esc_md(y.get("text"))}', '']
              if x.get('type') == 'comparative':
                  md += [f'**RU A:** {esc_md(x.get("optionA"))}', '',
                         f'**EN A draft:** {esc_md(y.get("optionA"))}', '',
                         f'**RU B:** {esc_md(x.get("optionB"))}', '',
                         f'**EN B draft:** {esc_md(y.get("optionB"))}', '']
              if x['id'] in source_anomaly:
                  md += ['> **Review flag:** The current runtime export contains concatenated/shifted Russian comparative text. The English draft reconstructs the apparent intended sentence structure for review only. Verify against the frozen scientific item authority before any EN release.', '']
              md += ['**Review status:** DRAFT / semantic-equivalence audit required', '', '---', '']

          md += ['## Required next gate', '',
                 '**EN LOCALIZATION PASS 2 — Item-by-Item Semantic Equivalence Audit**', '',
                 'Audit dimensions: construct preservation; polarity; intensity and frequency qualifiers; temporal/context qualifiers; construct-boundary drift; comparative-option symmetry; natural English readability; back-translation discrepancy; source-export anomalies.', '']

          (root/'P120_EN_TRANSLATION_REVIEW_v0.1.md').write_text('\n'.join(md), encoding='utf-8')

          summary = {
              'status':'PASS - DRAFT REVIEW PACKAGE BUILT',
              'ru_item_count':len(items),
              'en_item_count':len(en),
              'id_coverage':'180/180',
              'source_export_anomaly_ids':sorted(source_anomaly),
              'runtime_release_authorized':False,
              'next_gate':'EN LOCALIZATION PASS 2 - Item-by-Item Semantic Equivalence Audit'
          }
          (root/'P120_EN_TRANSLATION_REVIEW_v0.1.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Commit review package
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- localization/P120_EN_TRANSLATION_REVIEW_v0.1.*)" ]; then
            echo 'Review package already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add localization/P120_EN_TRANSLATION_REVIEW_v0.1.md localization/P120_EN_TRANSLATION_REVIEW_v0.1.tsv localization/P120_EN_TRANSLATION_REVIEW_v0.1.json
            git commit -m 'Build P-120 EN translation review package v0.1'
            git push
          fi

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: P120_EN_TRANSLATION_REVIEW_v0.1
          path: |
            localization/P120_EN_TRANSLATION_REVIEW_v0.1.md
            localization/P120_EN_TRANSLATION_REVIEW_v0.1.tsv
            localization/P120_EN_TRANSLATION_REVIEW_v0.1.json
          if-no-files-found: error
