name: Fix Science Navigation Direction v1.4
on:
  push:
    paths:
      - '.github/workflows/fix-science-navigation-direction-v1-4.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply owned-scroll route correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=r'''/* P-120 Science Navigation Reconciliation v1.0
             Navigation ownership only. No measurement, scoring, report or scientific-content changes. */
          (()=>{
            'use strict';
            const HASHES=new Set(['#scientific-base','#science-base']);
            const DESKTOP_MIN=1121;
            let frame=0,restore=null;
            const root=()=>document.scrollingElement||document.documentElement;
            const reduced=()=>!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            function topOffset(){const h=Math.max(58,Math.round(document.querySelector('.topbar')?.getBoundingClientRect().height||70));const n=innerWidth>=DESKTOP_MIN?Math.max(48,Math.round(document.querySelector('.chapter-jump-nav-inner')?.getBoundingClientRect().height||48))+18:14;return h+n;}
            function write(v){root().scrollTop=Math.max(0,v);}
            function begin(){if(restore){restore();restore=null;}const h=document.documentElement,b=document.body,hs=h.style.scrollBehavior,bs=b?.style.scrollBehavior||'';h.style.scrollBehavior='auto';if(b)b.style.scrollBehavior='auto';restore=()=>{h.style.scrollBehavior=hs;if(b)b.style.scrollBehavior=bs;restore=null;};}
            function end(){if(restore){const fn=restore;requestAnimationFrame(fn);}}
            function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
            function scrollChapter(attempt=0){
              const home=document.querySelector('.editorial-home'),target=document.getElementById('science-foundation');
              if(!(home&&target)){if(attempt<45)setTimeout(()=>scrollChapter(attempt+1),45);return;}
              if(frame){cancelAnimationFrame(frame);frame=0;}begin();
              const r=root(),start=r.scrollTop,dest=Math.max(0,start+target.getBoundingClientRect().top-topOffset()),delta=dest-start;
              document.documentElement.dataset.p120ScienceDirection='chapter';
              if(reduced()||Math.abs(delta)<2){write(dest);end();return;}
              const dur=Math.min(760,Math.max(360,Math.abs(delta)*.42)),t0=performance.now();
              const step=now=>{const p=Math.min(1,(now-t0)/dur);write(start+delta*ease(p));if(p<1){frame=requestAnimationFrame(step);return;}frame=0;const live=document.getElementById('science-foundation');if(live){const c=live.getBoundingClientRect().top-topOffset();if(Math.abs(c)>2)write(root().scrollTop+c);}end();};
              frame=requestAnimationFrame(step);
            }
            function clean(){if(HASHES.has(location.hash))history.replaceState(null,'',location.pathname+location.search);}
            function openBase(attempt=0){
              if(document.querySelector('.science-page,[data-science-root],#science-top')){clean();document.documentElement.dataset.p120ScienceDirection='base';return;}
              const b=document.querySelector('.topnav [data-science],button[data-science],.science-navlink[data-science]');
              if(b){clean();b.click();document.documentElement.dataset.p120ScienceDirection='base';return;}
              if(attempt<60)setTimeout(()=>openBase(attempt+1),45);
            }
            document.addEventListener('click',e=>{const b=e.target.closest?.('[data-chapter-jump="science"],[data-chapter-mobile="science"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();scrollChapter();},true);
            function hash(){if(HASHES.has(location.hash))setTimeout(()=>openBase(),0);}
            addEventListener('hashchange',hash);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hash,{once:true});else hash();
            document.documentElement.dataset.p120ScienceNavigation='reconciled-v1';
          })();
          '''.replace('          ','')
          Path('science-navigation-reconciliation-v1.0.js').write_text(js,encoding='utf-8')
          p=Path('p120-brand-system-v1.0.js');t=p.read_text(encoding='utf-8');old="${homeAnchor('science-foundation')}";new="${localeRoot(isEn)}#scientific-base"
          if old not in t and new not in t:raise SystemExit('brand Science route not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          for fn,src in [('index.html','science-navigation-reconciliation-v1.0.js?v=scinav10'),('en/index.html','../science-navigation-reconciliation-v1.0.js?v=scinav10')]:
              p=Path(fn);t=p.read_text(encoding='utf-8');mark='data-p120-science-navigation="reconciled-v1"'
              if mark not in t:t=t.replace('</body>',f'<script src="{src}" {mark}></script>\n</body>')
              p.write_text(t,encoding='utf-8')
          Path('P120_SCIENCE_NAVIGATION_RECONCILIATION_v1.0.md').write_text('# P-120 Science Navigation Reconciliation v1.0\n\nStatus: production navigation correction.\n\n## Invariant\n- Home Chapter Navigator → **Science / Наука** = in-page owned scroll to `#science-foundation`.\n- Global navigation → **Scientific Base / Научная база** = dedicated application Science screen.\n- Dedicated pages → locale root `#scientific-base`, resolved by root bridge to the dedicated Science screen.\n- RU and EN behavior is symmetric.\n\nNo measurement, scoring, scientific-content, document-version or report-engine changes.\n',encoding='utf-8')
          PY
      - name: Static QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('p120-brand-system-v1.0.js').read_text();j=Path('science-navigation-reconciliation-v1.0.js').read_text();ru=Path('index.html').read_text();en=Path('en/index.html').read_text()
          assert "${localeRoot(isEn)}#scientific-base" in b and "homeAnchor('science-foundation')" not in b
          assert 'document.scrollingElement' in j and '[data-chapter-jump="science"]' in j and '#scientific-base' in j
          assert 'science-navigation-reconciliation-v1.0.js?v=scinav10' in ru and '../science-navigation-reconciliation-v1.0.js?v=scinav10' in en
          print('STATIC PASS')
          PY
      - name: Browser QA RU EN
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-science-nav-http.log 2>&1 & sleep 2
          cat > science-nav-qa.mjs <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),bad=[];const ok=(v,m)=>{console.log(`${v?'PASS':'FAIL'} ${m}`);if(!v)bad.push(m)};
          async function root(path,lang,pdf){const p=await browser.newPage({viewport:{width:1920,height:1080}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});await p.waitForTimeout(700);const c=p.locator('[data-chapter-jump="science"]').first();ok(await c.count()===1,lang+' chapter control');if(await c.count()){const before=await p.evaluate(()=>document.scrollingElement.scrollTop);await c.dispatchEvent('click');await p.waitForTimeout(1100);const after=await p.evaluate(()=>document.scrollingElement.scrollTop),r=await p.locator('#science-foundation').boundingBox();ok(await p.locator('.editorial-home').count()===1,lang+' chapter stays Home');ok(await p.locator('.science-page,[data-science-root],#science-top').count()===0,lang+' chapter not Base');ok(after>before+100,lang+' chapter scrolls');ok(!!r&&r.y<1080&&r.y+(r.height||1)>0,lang+' science section visible');console.log(lang+' '+JSON.stringify({before,after,rect:r}))}const s=p.locator('.topnav [data-science]').first();ok(await s.count()===1,lang+' global Base control');if(await s.count()){await s.dispatchEvent('click');await p.waitForTimeout(550);ok(await p.locator('.science-page,[data-science-root],#science-top').count()>0,lang+' global opens Base');const h=await p.locator('a[href*="p120-scientific-concept-paper"]').first().getAttribute('href').catch(()=>null);ok(!!h&&h.endsWith(pdf),lang+' locale PDF')}await p.close()}
          async function dedicated(path,lang,label){const p=await browser.newPage({viewport:{width:1920,height:1080}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});await p.waitForTimeout(650);const a=p.locator('.p120-brand53-navitem').filter({hasText:label}).first();ok(await a.count()===1,lang+' dedicated Base link');if(await a.count()){const h=await a.getAttribute('href');ok(h?.includes('#scientific-base')&&!h.includes('#science-foundation'),lang+' distinct Base route');await a.click({force:true});await p.waitForTimeout(1200);ok(await p.locator('.science-page,[data-science-root],#science-top').count()>0,lang+' dedicated resolves Base')}await p.close()}
          await root('/','RU','assets/p120-scientific-concept-paper-v1.2.pdf');await root('/en/','EN','assets/p120-scientific-concept-paper-en-v1.2.pdf');await dedicated('/why-p120/','RU','Научная база');await dedicated('/en/why-p120/','EN','Scientific Base');await browser.close();if(bad.length){console.error(bad.join('\n'));process.exit(1)}
          JS
          node science-nav-qa.mjs
      - name: Commit production correction
        run: |
          git config user.name "p120-release-bot";git config user.email "actions@users.noreply.github.com"
          git add science-navigation-reconciliation-v1.0.js p120-brand-system-v1.0.js index.html en/index.html P120_SCIENCE_NAVIGATION_RECONCILIATION_v1.0.md
          git diff --cached --quiet && exit 0
          git commit -m "NAV: separate Science chapter from Scientific Base" && git push
