name: Apply Science Public v1.2

on:
  push:
    paths:
      - '.github/workflows/apply-science-public-v12.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public science metadata, RU localization and Noto title
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          RU_TITLE = 'P-120 vNext — Научный концептуальный документ'
          RU_VERSION = 'Публичная исследовательская редакция A4 · v1.2'
          RU_DATE = '1 сентября 2026'
          RU_FORMULA = 'оригинальная кандидатная интеграция и операционализация'
          EN_VERSION = 'Public Research Edition A4 · v1.2'
          EN_DATE = '1 September 2026'

          p = Path('SCIENCE_LOCALIZATION_SOURCE.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['document']['title'] = RU_TITLE
          data['document']['version'] = RU_VERSION
          data['document']['date'] = RU_DATE
          data['document']['pages'] = 15
          data['positioning']['formula'] = RU_FORMULA
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          replacements = [
              ('"title":"P-120 vNext — Scientific Concept Paper"', f'"title":"{RU_TITLE}"'),
              ('"version":"Академическая редакционная версия A4 · v1.1"', f'"version":"{RU_VERSION}"'),
              ('"date":"29 августа 2026"', f'"date":"{RU_DATE}"'),
              ('"pages":21', '"pages":15'),
              ('"formula":"original candidate integration and operationalization"', f'"formula":"{RU_FORMULA}"'),
          ]
          for old,new in replacements:
              if old in t:
                  t = t.replace(old,new)

          marker = 'id="p120-science-public-v12-runtime"'
          if marker not in t:
              js = "<script id=\"p120-science-public-v12-runtime\">(()=>{'use strict';const R={title:'P-120 vNext — Научный концептуальный документ',version:'Публичная исследовательская редакция A4 · v1.2',date:'1 сентября 2026',pages:15,formula:'оригинальная кандидатная интеграция и операционализация'};function a(){const d=window.P120_SCIENCE;if(d&&d.document)Object.assign(d.document,{title:R.title,version:R.version,date:R.date,pages:R.pages,pdf:'assets/p120-scientific-concept-paper-v1.1.pdf'});if(d&&d.positioning)d.positioning.formula=R.formula;document.querySelectorAll('h1').forEach(h=>{if((h.textContent||'').includes('Научная база P-120')){h.style.fontFamily='\\\"Noto Serif Display\\\",\\\"Noto Serif\\\",Georgia,serif';h.dataset.p120Typography='noto-serif-display'}});const m=[['P-120 vNext — Scientific Concept Paper',R.title],['Академическая редакционная версия A4 · v1.1',R.version],['29 августа 2026 · 21 стр.','1 сентября 2026 · 15 стр.'],['29 августа 2026',R.date],['original candidate integration and operationalization',R.formula]];const w=document.createTreeWalker(document.body||document.documentElement,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let s=n.nodeValue,q=s;m.forEach(([x,y])=>q=q.split(x).join(y));if(q!==s)n.nodeValue=q}}let q=0;const s=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;a()})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',a,{once:true});else a();new MutationObserver(s).observe(document.documentElement,{subtree:true,childList:true,characterData:true})})();</script>"
              t = t.replace('</body>', js + '\n</body>')
          p.write_text(t, encoding='utf-8')

          p = Path('en/index.html')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('"version":"Academic Editorial A4 · v1.1"', f'"version":"{EN_VERSION}"')
              t = t.replace('"version":"Academic Editorial Edition A4 · v1.1"', f'"version":"{EN_VERSION}"')
              t = t.replace('"date":"29 August 2026"', f'"date":"{EN_DATE}"')
              t = t.replace('"pages":21', '"pages":15')
              p.write_text(t, encoding='utf-8')

          Path('P120_SCIENTIFIC_CONCEPT_PUBLIC_v1.2_RELEASE.md').write_text(
              '# P-120 Scientific Concept Paper — Public Research Edition v1.2\n\n'
              '- Date: 2026-09-01\n'
              '- Scope: public/user-facing scientific document metadata and localization only.\n'
              '- RU document title and originality formula localized for the public interface.\n'
              '- Public document metadata updated to v1.2 / 15 pages.\n'
              '- Scientific Base H1 explicitly bound to Noto Serif Display per P120 typography policy.\n'
              '- Existing PDF URL retained for backward-compatible binary replacement.\n'
              '- Measurement, scoring, thresholds, research status and internal scientific governance: unchanged.\n',
              encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=['P-120 vNext — Научный концептуальный документ','Публичная исследовательская редакция A4 · v1.2','1 сентября 2026','"pages":15','оригинальная кандидатная интеграция и операционализация','p120-science-public-v12-runtime','Noto Serif Display']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing after patch: '+repr(missing))
          print('PASS')
          PY
      - name: Commit production patch
        run: |
          git config user.name "p120-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html SCIENCE_LOCALIZATION_SOURCE.json P120_SCIENTIFIC_CONCEPT_PUBLIC_v1.2_RELEASE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCIENCE PUBLIC v1.2: update document metadata, RU localization and Noto title"
          git push
