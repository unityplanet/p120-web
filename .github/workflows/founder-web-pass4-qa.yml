name: FOUNDER-WEB PASS 4 QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/founder-web-pass4-qa.yml'

permissions:
  contents: read

jobs:
  pass4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static, privacy and build gates
        shell: bash
        run: |
          set -euo pipefail
          python qa/check_founder_story.py
          node --check founder-editorial-story-v1.0.js
          python qa/check_build.py
          grep -q 'founder-editorial-story-v1.0.css' index.html
          grep -q 'founder-editorial-story-v1.0.js' index.html

      - name: Prepare pre-Founder regression baseline
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          s=s.replace('  <link rel="stylesheet" href="founder-editorial-story-v1.0.css" data-p120-founder-story="v1.0">\n','')
          s=s.replace('  <script src="founder-editorial-story-v1.0.js" defer data-p120-founder-story="v1.0"></script>\n','')
          Path('qa-baseline.html').write_text(s,encoding='utf-8')

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run PASS 4 browser audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/p120-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep .25; done
          node qa/founder_mobile_debug.mjs
          node qa/founder_pass4_audit.mjs

      - name: Upload PASS 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_FOUNDERWEB_PASS4_EVIDENCE
          path: |
            pass4-artifacts/
            pass4-mobile-debug.png
          if-no-files-found: warn
          retention-days: 30

# PASS 4 rerun after CTA binding reconciliation.
