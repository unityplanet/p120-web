name: P-120 PASS 2 Closure QA

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass2'
    paths:
      - '.github/scripts/p120_pass2_closure_qa.py'
      - '.github/workflows/p120-pass2-closure-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PASS 2 branch with rollback refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run route, language, measurement and design QA
        shell: bash
        run: |
          # Harden the conservative checked-in parser in the ephemeral QA
          # workspace: include async functions and target the actual tryAI name.
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/p120_pass2_closure_qa.py')
          s=p.read_text(encoding='utf-8')
          old="m=re.search(rf'function\\s+{re.escape(name)}\\s*\\([^)]*\\)\\s*\\{{',app)"
          new="m=re.search(rf'(?:async\\s+)?function\\s+{re.escape(name)}\\s*\\([^)]*\\)\\s*\\{{',app)"
          if old not in s: raise SystemExit('QA function parser signature not found')
          s=s.replace(old,new,1)
          s=s.replace("'renderQuestion','checkAI','renderResults'","'renderQuestion','tryAI','renderResults'",1)
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/p120_pass2_closure_qa.py

      - name: Syntax-check every inline System JavaScript block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out=Path('/tmp/p120-pass2-js'); out.mkdir(exist_ok=True)
          n=0
          for route in ['system/index.html','en/system/index.html']:
              s=Path(route).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
              for i,b in enumerate(blocks):
                  p=out/f'{route.replace("/","-")}-{i:02d}.js'
                  p.write_text(b,encoding='utf-8'); n+=1
          print(f'extracted {n} inline JS blocks')
          PY
          for f in /tmp/p120-pass2-js/*.js; do node --check "$f"; done

      - name: Verify PASS 2 diff scope protects editorial and Scientific Base
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base='883dba58e553ac91ad0c32e4787c630b26dc45e8'
          files=subprocess.check_output(['git','diff','--name-only',base+'...HEAD'],text=True).splitlines()
          protected=[]
          for p in files:
              if p in ('index.html','en/index.html'):
                  protected.append(p)
              if p.startswith(('science/','scientific/','research/science/')):
                  protected.append(p)
              if p.startswith('P120_SCIENTIFIC_') or p.startswith('P120_SCIENCE_'):
                  protected.append(p)
          if protected:
              raise SystemExit('PASS 2 touched protected editorial/science paths: '+', '.join(protected))
          print('Protected editorial/science diff scope: PASS')
          print('PASS 2 changed paths:',len(files))
          PY

      - name: Commit closure QA evidence
        shell: bash
        run: |
          git checkout -- .github/scripts/p120_pass2_closure_qa.py
          if [ -z "$(git status --porcelain -- P120_WEB_RECONCILIATION_PASS2_CLOSURE_QA.json)" ]; then
            echo 'Closure QA evidence already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add P120_WEB_RECONCILIATION_PASS2_CLOSURE_QA.json
            git commit -m 'Record PASS 2 closure QA evidence'
            git push
          fi
