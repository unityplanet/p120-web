name: Patch Scientific Base Direct Link v1
on:
  push:
    paths:
      - '.github/workflows/patch-science-direct-link-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch brand navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('p120-brand-system-v1.0.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("['intellectual-property','privacy','terms','why-p120','creator','extended','together']","['intellectual-property','privacy','terms','why-p120','creator','extended','together','science']")
          t=t.replace("${localeRoot(isEn)}#scientific-base","${routeFor('science')}")
          p.write_text(t,encoding='utf-8')
          assert "${routeFor('science')}" in t
          PY
      - name: Commit
        run: |
          git config user.name "p120-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add p120-brand-system-v1.0.js
          git diff --cached --quiet && exit 0
          git commit -m "SCIENCE: use dedicated page in sitewide navigation"
          git push
