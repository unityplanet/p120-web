name: Extract science localization source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-science-localization-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract sanitized science JSON
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('index.html').read_text(encoding='utf-8')
          marker='window.P120_SCIENCE='
          start=text.index(marker)+len(marker)
          # JSON is followed by ; on the same generated assignment. Parse with raw_decode.
          obj,end=json.JSONDecoder().raw_decode(text[start:])
          if isinstance(obj.get('document'),dict):
              obj['document'].pop('pdf',None)
          # Citations/titles are publication records and should remain in their published language.
          obj.pop('references',None)
          Path('SCIENCE_LOCALIZATION_SOURCE.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          print('science localization source written')
          PY
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SCIENCE_LOCALIZATION_SOURCE.json
          if git diff --cached --quiet; then
            echo 'Science source unchanged.'
          else
            git commit -m 'Extract sanitized science localization source'
            git push
          fi
