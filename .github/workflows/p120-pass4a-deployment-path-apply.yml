name: P120 PASS 4A Path Contract Read-Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-path-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Science path tokens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ru=Path('science/index.html').read_text(encoding='utf-8')
          en=Path('en/science/index.html').read_text(encoding='utf-8')
          assert '<script src="p120-scientific-base-runtime-v1.0.js?v=sbm10" data-p120-scientific-base-runtime="v1.0"></script>' in ru
          assert '<script src="../p120-en-science-localization-runtime-v1.0.js?v=ensci10" data-p120-en-science-localization="v1.0"></script>' in en
          print('PASS 4A path contract: PASS')
          PY
