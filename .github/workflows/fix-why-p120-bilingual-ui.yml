name: Fix Why P-120 bilingual UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-why-p120-bilingual-ui.yml'
      - '.github/scripts/fix_why_p120_bilingual_ui.py'
  workflow_run:
    workflows:
      - 'Integrate bilingual public site v1.7'
      - 'Integrate Why P-120 into production'
    types: [completed]

permissions:
  contents: write

concurrency:
  group: p120-why-bilingual-ui
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Apply bilingual UI corrections
        run: python3 .github/scripts/fix_why_p120_bilingual_ui.py

      - name: Static acceptance gates
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/fix_why_p120_bilingual_ui.py
          grep -q 'id="wp-bilingual-ui-fix-v1"' why-p120/index.html
          grep -q 'class="wp-lang-switch"' why-p120/index.html
          grep -q 'data-why-origin>Why P-120?</button>' en/index.html
          grep -q 'data-nav="why-p120">What makes it different</button>' en/index.html
          grep -q 'Six directions of meaning.' en/why-p120/index.html

      - name: Commit corrected public UI
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Bilingual UI already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add why-p120/index.html en/why-p120/index.html en/index.html
          git commit -m 'Auto-heal Why P-120 bilingual UI alignment'
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
