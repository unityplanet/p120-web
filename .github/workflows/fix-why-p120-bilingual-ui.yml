name: Fix Why P-120 bilingual UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-why-p120-bilingual-ui.yml'
      - '.github/scripts/fix_why_p120_bilingual_ui.py'
      - 'why-p120/index.html'
      - 'en/why-p120/index.html'
      - 'en/index.html'

permissions:
  contents: write

concurrency:
  group: p120-why-bilingual-ui
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Apply bilingual UI corrections
        run: python3 .github/scripts/fix_why_p120_bilingual_ui.py

      - name: Install durable integration hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Why P-120 production integration must always finish with the
          # bilingual alignment pass after rebuilding the semantic object.
          p = Path('.github/workflows/integrate-why-p120-production.yml')
          s = p.read_text(encoding='utf-8')
          trigger = "      - '.github/scripts/apply_why_p120_act2_semantic.py'"
          extra_trigger = "      - '.github/scripts/fix_why_p120_bilingual_ui.py'"
          if extra_trigger not in s:
              if trigger not in s:
                  raise SystemExit('Why integration trigger anchor not found')
              s = s.replace(trigger, trigger + '\n' + extra_trigger, 1)
          step = """      - name: Apply bilingual UI alignment fix
        run: python3 .github/scripts/fix_why_p120_bilingual_ui.py

"""
          marker = '      - name: Convert static Brand Origin teaser to scroll interstitial\n'
          if 'name: Apply bilingual UI alignment fix' not in s:
              if marker not in s:
                  raise SystemExit('Why integration step anchor not found')
              s = s.replace(marker, step + marker, 1)
          p.write_text(s, encoding='utf-8')

          # The RU→EN public-site rebuild can regenerate en/index.html from the
          # Russian source. Apply the same alignment pass immediately after that
          # generation and before JS/static checks.
          p = Path('.github/workflows/integrate-bilingual-public-site-v1.yml')
          s = p.read_text(encoding='utf-8')
          nav_trigger = "      - 'navigation-architecture-v2.js'"
          if extra_trigger not in s:
              if nav_trigger not in s:
                  raise SystemExit('Bilingual build trigger anchor not found')
              s = s.replace(nav_trigger, nav_trigger + '\n' + extra_trigger, 1)
          step = """      - name: Apply Why P-120 bilingual UI alignment
        run: python3 .github/scripts/fix_why_p120_bilingual_ui.py
"""
          marker = '      - name: Check generated runtime and localization scripts\n'
          if 'name: Apply Why P-120 bilingual UI alignment' not in s:
              if marker not in s:
                  raise SystemExit('Bilingual build step anchor not found')
              s = s.replace(marker, step + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('Durable Why P-120 bilingual hooks: PASS')
          PY

      - name: Static acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/fix_why_p120_bilingual_ui.py
          grep -q 'id="wp-bilingual-ui-fix-v1"' why-p120/index.html
          grep -q 'class="wp-lang-switch"' why-p120/index.html
          grep -q 'data-why-origin>Why P-120?</button>' en/index.html
          grep -q 'data-nav="why-p120">What makes it different</button>' en/index.html
          grep -q 'Six directions of meaning.' en/why-p120/index.html
          grep -q 'Apply bilingual UI alignment fix' .github/workflows/integrate-why-p120-production.yml
          grep -q 'Apply Why P-120 bilingual UI alignment' .github/workflows/integrate-bilingual-public-site-v1.yml

      - name: Commit corrected public UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Bilingual UI already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add why-p120/index.html en/why-p120/index.html en/index.html .github/workflows/integrate-why-p120-production.yml .github/workflows/integrate-bilingual-public-site-v1.yml
          git commit -m 'Persist Why P-120 bilingual UI alignment'
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
