name: QA Scientific Base Dedicated v1
on:
  push:
    paths:
      - '.github/workflows/qa-scientific-base-dedicated-v1.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-science-qa.log 2>&1 & sleep 2
          cat > qa.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch({headless:true}), bad=[];
          const ok=(v,m)=>{console.log(`${v?'PASS':'FAIL'} ${m}`);if(!v)bad.push(m)};
          async function page(path,lang,title,pdf){const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});ok(await p.locator('html').getAttribute('lang')===lang,lang+' lang');ok((await p.locator('h1').innerText()).includes(title),lang+' title');ok(await p.locator('.science-lang').isVisible(),lang+' language switch visible');ok(await p.locator('.science-lang a').count()===2,lang+' RU/EN controls');ok((await p.locator('[data-science-pdf]').getAttribute('href')).endsWith(pdf),lang+' PDF');await p.close()}
          async function global(path,expected){const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});await p.waitForTimeout(500);const s=p.locator('[data-science]').first();ok(await s.count()>0,path+' Science control');await s.click({force:true});await p.waitForURL(u=>u.pathname===expected,{timeout:5000});ok(new URL(p.url()).pathname===expected,path+' -> '+expected);await p.close()}
          async function sw(){const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('http://127.0.0.1:4173/science/');await p.locator('.science-lang a[lang="en"]').click();await p.waitForURL(u=>u.pathname==='/en/science/');ok(new URL(p.url()).pathname==='/en/science/','RU->EN preserves Science');await p.locator('.science-lang a[lang="ru"]').click();await p.waitForURL(u=>u.pathname==='/science/');ok(new URL(p.url()).pathname==='/science/','EN->RU preserves Science');await p.close()}
          await page('/science/','ru','Научная база','assets/p120-scientific-concept-paper-v1.2.pdf');await page('/en/science/','en','Scientific Base','assets/p120-scientific-concept-paper-en-v1.2.pdf');await global('/','/science/');await global('/en/','/en/science/');await sw();await b.close();if(bad.length)process.exit(1);
          JS
          node qa.mjs
