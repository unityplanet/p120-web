name: Apply P-120 Extended Research Set v1.0

on:
  push:
    branches: [main]
    paths:
      - 'extended-research-set-v1.0.css'
      - 'extended-research-set-v1.0.html'
      - 'EXTENDED_RESEARCH_SET_SECTION_SPEC.md'
      - '.github/workflows/apply-extended-research-set-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject additive Extended Research Set chapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          fragment_path = Path('extended-research-set-v1.0.html')
          css_path = Path('extended-research-set-v1.0.css')
          if not index_path.exists() or not fragment_path.exists() or not css_path.exists():
              raise SystemExit('Required source file missing')

          text = index_path.read_text(encoding='utf-8')
          fragment = fragment_path.read_text(encoding='utf-8').strip()

          # Idempotently remove an earlier injected copy.
          text = re.sub(
              r'\s*<!-- P120 EXTENDED RESEARCH SET:START -->.*?<!-- P120 EXTENDED RESEARCH SET:END -->\s*',
              '\n', text, flags=re.S
          )
          text = re.sub(
              r'\s*<!-- P120 EXTENDED PLACEMENT:START -->.*?<!-- P120 EXTENDED PLACEMENT:END -->\s*',
              '\n', text, flags=re.S
          )
          text = re.sub(
              r'\s*<link[^>]+data-p120-extended-research="v1\.0"[^>]*>\s*',
              '\n', text, flags=re.I
          )

          link = '<link rel="stylesheet" href="extended-research-set-v1.0.css?v=ers10" data-p120-extended-research="v1.0" />'
          if '</head>' not in text:
              raise SystemExit('No </head> marker in index.html')
          text = text.replace('</head>', '  ' + link + '\n</head>', 1)

          placement = r'''<!-- P120 EXTENDED PLACEMENT:START -->
          <script data-p120-extended-placement="v1.0">
          (() => {
            const section = document.getElementById('extended-research-set');
            if (!section) return;

            const normalize = value => (value || '').replace(/\s+/g, ' ').trim();
            const directSelectors = [
              '#science', '#scientific', '#scientific-base', '#science-base',
              '[data-section-id="science"]', '[data-section="science"]',
              '.science-section', '.scientific-section', '.editorial-science'
            ];

            function findScienceTarget(){
              for (const selector of directSelectors){
                const el = document.querySelector(selector);
                if (el && el !== section && !section.contains(el)) return el;
              }

              const patterns = [
                /Большинство существующих исследований и психологических инструментов/i,
                /Посмотреть научную основу/i,
                /Научная база/i
              ];
              const nodes = [...document.querySelectorAll('main section, main article, main .editorial-chapter, #app section, #app article, #app .editorial-chapter')]
                .filter(el => el !== section && !section.contains(el));
              const matches = nodes.filter(el => {
                const content = normalize(el.textContent);
                return content.length > 40 && content.length < 14000 && patterns.some(rx => rx.test(content));
              });
              if (!matches.length) return null;
              matches.sort((a,b) => normalize(a.textContent).length - normalize(b.textContent).length);
              let target = matches[0];
              const chapter = target.closest('.editorial-chapter');
              if (chapter && chapter !== section && !section.contains(chapter)) target = chapter;
              return target;
            }

            function placeBeforeScience(){
              const target = findScienceTarget();
              if (!target || !target.parentNode) return false;
              target.parentNode.insertBefore(section, target);
              section.dataset.placement = 'before-science';
              return true;
            }

            function fallbackPlace(){
              const footer = [...document.querySelectorAll('footer')].find(el => !section.contains(el));
              if (footer && footer.parentNode){
                footer.parentNode.insertBefore(section, footer);
                section.dataset.placement = 'before-footer';
                return;
              }
              const main = document.querySelector('main') || document.getElementById('app');
              if (main){
                main.appendChild(section);
                section.dataset.placement = 'end-of-main';
              } else {
                section.dataset.placement = 'fallback';
              }
            }

            if (placeBeforeScience()) return;
            const observer = new MutationObserver(() => {
              if (placeBeforeScience()) observer.disconnect();
            });
            observer.observe(document.body, {childList:true, subtree:true});
            window.setTimeout(() => {
              if (section.dataset.placement === 'pending') fallbackPlace();
              observer.disconnect();
            }, 3500);
          })();
          </script>
          <!-- P120 EXTENDED PLACEMENT:END -->'''

          if '</body>' not in text:
              raise SystemExit('No </body> marker in index.html')
          injection = '\n' + fragment + '\n' + placement + '\n'
          text = text.replace('</body>', injection + '</body>', 1)
          index_path.write_text(text, encoding='utf-8')

          # Static safety assertions.
          checks = {
              'section': text.count('id="extended-research-set"') == 1,
              'css-link': text.count('data-p120-extended-research="v1.0"') == 1,
              'COM': 'data-extended-module="COM"' in text,
              'MOT': 'data-extended-module="MOT"' in text,
              'SELF': 'data-extended-module="SELF"' in text,
              'LIFE': 'data-extended-module="LIFE"' in text,
              'no-extended-total': 'P120_TOTAL_EXTENDED' not in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Static Extended Set assertions failed: ' + ', '.join(failed))
          print('Extended Research Set static integration: PASS')
          PY

      - name: Commit integrated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already integrated.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Integrate Extended Research Set section v1.0'
            git push
          fi

      - name: Build hosting package
        shell: bash
        run: |
          rm -rf _hosting_package
          mkdir -p _hosting_package
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          out = Path('_hosting_package')
          excluded_names = {'.git', '.github', '_hosting_package'}
          excluded_suffixes = {'.zip'}
          runtime_exts = {'.html','.css','.js','.svg','.png','.jpg','.jpeg','.webp','.woff','.woff2','.json','.webmanifest','.txt','.md','.pdf'}
          explicit = {'.nojekyll'}
          for p in root.iterdir():
              if p.name in excluded_names or p.name.startswith('.git'):
                  continue
              if p.is_dir():
                  # Keep ordinary runtime asset directories, but not tooling directories.
                  if p.name.startswith('_'):
                      continue
                  shutil.copytree(p, out / p.name, dirs_exist_ok=True)
                  continue
              if p.suffix.lower() in excluded_suffixes:
                  continue
              if p.suffix.lower() in runtime_exts or p.name in explicit:
                  shutil.copy2(p, out / p.name)
          PY
          cp EXTENDED_RESEARCH_SET_SECTION_SPEC.md _hosting_package/
          cp CHANGELOG.md _hosting_package/
          cd _hosting_package
          zip -qr ../P120_Web_Editorial_EXTENDED_RESEARCH_SET_SECTION_v1.0_HOSTING_PACKAGE.zip .
          cd ..
          unzip -t P120_Web_Editorial_EXTENDED_RESEARCH_SET_SECTION_v1.0_HOSTING_PACKAGE.zip
          sha256sum P120_Web_Editorial_EXTENDED_RESEARCH_SET_SECTION_v1.0_HOSTING_PACKAGE.zip | tee EXTENDED_SET_PACKAGE_SHA256.txt

      - name: Upload hosting package
        uses: actions/upload-artifact@v4
        with:
          name: P120_Web_Editorial_EXTENDED_RESEARCH_SET_SECTION_v1.0_HOSTING_PACKAGE
          path: |
            P120_Web_Editorial_EXTENDED_RESEARCH_SET_SECTION_v1.0_HOSTING_PACKAGE.zip
            EXTENDED_SET_PACKAGE_SHA256.txt
          retention-days: 30
