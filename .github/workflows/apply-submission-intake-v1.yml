name: Apply P-120 submission intake v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-submission-intake-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static syntax checks
        shell: bash
        run: |
          node --check p120-submission-config-v1.0.js
          node --check p120-submission-intake-v1.0.js
          python - <<'PY'
          from pathlib import Path
          js = Path('p120-submission-intake-v1.0.js').read_text(encoding='utf-8')
          required = [
              "p120_web_prototype_v01",
              "p120.web.raw-response-package.v1.0",
              "RESEARCH_CANDIDATE_AUTOMATIC_INTAKE",
              "payload_sha256",
              "telemetry_included: false",
              "direct_name_email_phone_added_by_intake: false",
              "grant insert" if False else "fetch(`${c.projectUrl}/rest/v1/${encodeURIComponent(c.table)}`",
          ]
          for token in required:
              if token not in js:
                  raise SystemExit(f'intake JS acceptance token missing: {token}')
          sql = Path('supabase/migrations/20260831_p120_submission_intake_v1.sql').read_text(encoding='utf-8')
          for token in [
              'enable row level security',
              'grant insert on table public.p120_submissions to anon',
              'revoke all on table public.p120_submissions from anon, authenticated',
              'p120_public_insert_only',
          ]:
              if token not in sql:
                  raise SystemExit(f'database acceptance token missing: {token}')
          print('submission intake static gate: PASS')
          PY

      - name: Patch RU and EN entry pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              Path('index.html'): [
                  '<script src="p120-submission-config-v1.0.js?v=psi10" data-p120-submission-config="v1.0"></script>',
                  '<script src="p120-submission-intake-v1.0.js?v=psi10" data-p120-submission-intake="v1.0"></script>',
              ],
              Path('en/index.html'): [
                  '<script src="../p120-submission-config-v1.0.js?v=psi10" data-p120-submission-config="v1.0"></script>',
                  '<script src="../p120-submission-intake-v1.0.js?v=psi10" data-p120-submission-intake="v1.0"></script>',
              ],
          }

          for path, tags in targets.items():
              text = path.read_text(encoding='utf-8')
              if '</body>' not in text:
                  raise SystemExit(f'{path}: </body> not found')
              additions = []
              if 'data-p120-submission-config="v1.0"' not in text:
                  additions.append(tags[0])
              if 'data-p120-submission-intake="v1.0"' not in text:
                  additions.append(tags[1])
              if additions:
                  text = text.replace('</body>', '  ' + '\n  '.join(additions) + '\n</body>', 1)
                  path.write_text(text, encoding='utf-8')
                  print(f'{path}: patched {len(additions)} tag(s)')
              else:
                  print(f'{path}: already wired')
          PY

      - name: Wiring acceptance checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'index.html': [
                  'src="p120-submission-config-v1.0.js?v=psi10"',
                  'src="p120-submission-intake-v1.0.js?v=psi10"',
              ],
              'en/index.html': [
                  'src="../p120-submission-config-v1.0.js?v=psi10"',
                  'src="../p120-submission-intake-v1.0.js?v=psi10"',
              ],
          }
          for file, needles in checks.items():
              text = Path(file).read_text(encoding='utf-8')
              if text.count('data-p120-submission-config="v1.0"') != 1:
                  raise SystemExit(f'{file}: config marker count != 1')
              if text.count('data-p120-submission-intake="v1.0"') != 1:
                  raise SystemExit(f'{file}: intake marker count != 1')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{file}: missing {needle}')
          print('submission intake wiring gate: PASS')
          PY

      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html
          git commit -m 'feat: wire P-120 automatic submission intake [skip ci]'
          git push origin HEAD:main
