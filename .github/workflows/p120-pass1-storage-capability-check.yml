name: P120 PASS1 Storage Capability Check
on:
  push:
    branches:
      - 'p120/pass1-synthetic-e2e'
    paths:
      - '.github/workflows/p120-pass1-storage-capability-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check server credential availability without disclosure
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          P120_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.P120_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          check() { if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          check SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}"
          check SUPABASE_SECRET_KEY "${SUPABASE_SECRET_KEY:-}"
          check P120_SUPABASE_SERVICE_ROLE_KEY "${P120_SUPABASE_SERVICE_ROLE_KEY:-}"
          check SUPABASE_ACCESS_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
