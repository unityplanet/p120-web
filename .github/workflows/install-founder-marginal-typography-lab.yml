name: Install Founder Marginal Typography Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'founder-marginal-typography-lab-v0.1.css'
      - 'founder-marginal-typography-lab-v0.1.js'
      - '.github/scripts/install_founder_marginal_typography_lab.py'
      - '.github/workflows/install-founder-marginal-typography-lab.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply non-default Founder typography lab
        run: python .github/scripts/install_founder_marginal_typography_lab.py
      - name: Validate experiment remains opt-in
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['creator/index.html','en/creator/index.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert 'founder-marginal-typography-lab-v0.1.css' in s
              assert 'founder-marginal-typography-lab-v0.1.js' in s
              assert 'ibm-plex-sans:300,300i' in s
          js=Path('founder-marginal-typography-lab-v0.1.js').read_text(encoding='utf-8')
          assert "if (!['light','italic'].includes(mode)) return;" in js
          print('Founder marginal typography lab install contract: PASS')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator/index.html en/creator/index.html
          git commit -m 'feat: install opt-in Founder typography lab'
          git push
