name: P120 PASS 4A Live Verification

on:
  push:
    branches:
      - 'work/p120-deployment-path-reconciliation-pass4a'
    paths:
      - 'qa/pass4a_live_verification.mjs'
      - '.github/workflows/p120-pass4a-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify actual GitHub Pages RU/EN Science routes
        run: node qa/pass4a_live_verification.mjs
      - name: Upload PASS 4A live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_PASS4A_LIVE_VERIFICATION
          path: qa-evidence-pass4a-live/
          retention-days: 30
