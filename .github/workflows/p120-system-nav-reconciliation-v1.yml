name: P-120 System Navigation Reconciliation v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-system-nav-reconciliation-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize System navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          anchor='<button class="navlink science-navlink" data-science>Научная база</button>'
          for filename,is_system in [('index.html',False),('system/index.html',True)]:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              text=re.sub(r'\n\s*<a class="navlink system-navlink" href="system/"[^>]*>Система</a>','',text)
              if anchor not in text:
                  raise SystemExit(f'Navigation anchor missing in {filename}')
              current=' aria-current="page"' if is_system else ''
              link=f'<a class="navlink system-navlink" href="system/"{current} style="text-decoration:none">Система</a>\n          '
              text=text.replace(anchor,link+anchor,1)
              if text.count('>Система</a>') != 1:
                  raise SystemExit(f'System navigation count mismatch in {filename}: '+str(text.count('>Система</a>')))
              p.write_text(text,encoding='utf-8')
          print('System navigation reconciliation: PASS')
          PY

      - name: Verify frozen migration record remains valid
        shell: bash
        run: |
          grep -q 'Frozen instrument parity: \*\*PASS\*\*' P120_WEB_SYSTEM_MIGRATION_v1.0.md
          grep -q 'Assessment runtime parity: \*\*PASS\*\*' P120_WEB_SYSTEM_MIGRATION_v1.0.md
          grep -q 'Item count / uniqueness: \*\*180 / 180 — PASS\*\*' P120_WEB_SYSTEM_MIGRATION_v1.0.md
          grep -q 'data-p120-page="system"' system/index.html
          ! grep -q 'P120 EXTENDED RESEARCH SET:START' system/index.html
          echo 'Reconciliation QA: PASS'

      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet -- index.html system/index.html; then
            echo 'Navigation already reconciled.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html system/index.html
            git commit -m 'Reconcile System navigation after migration'
            git push
          fi
