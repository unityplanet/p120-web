name: P120 WEB - Mobile Primary CTA PASS 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-primary-cta-pass2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-mobile-primary-cta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject PASS 2 authority after frozen brand layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          CSS = Path('p120-mobile-primary-cta-pass2.css')
          if not CSS.exists():
              raise SystemExit('PASS 2 CSS authority is missing')

          css = CSS.read_text(encoding='utf-8')
          required_css = [
              '.mobile-bottom-nav button.cta.active',
              'body[data-theme="graphite"] .mobile-bottom-nav button.cta.active',
              'body[data-theme="museum"] .mobile-bottom-nav button.cta.active',
              '#171715', '#667F7B', '#49635F', '#337F79', '#255F5C'
          ]
          missing = [token for token in required_css if token not in css]
          if missing:
              raise SystemExit('PASS 2 CSS invariant missing: ' + ', '.join(missing))

          targets = {
              Path('index.html'): '<link rel="stylesheet" href="p120-mobile-primary-cta-pass2.css?v=cta2" data-p120-mobile-primary-cta="pass2" />',
              Path('en/index.html'): '<link rel="stylesheet" href="../p120-mobile-primary-cta-pass2.css?v=cta2" data-p120-mobile-primary-cta="pass2" />',
              Path('en/system/index.html'): '<link rel="stylesheet" href="p120-mobile-primary-cta-pass2.css?v=cta2" data-p120-mobile-primary-cta="pass2" />',
          }

          anchor_token = 'data-p120-pass53-visual-corrections="5.3.2"'

          for path, tag in targets.items():
              text = path.read_text(encoding='utf-8')
              # Remove any prior PASS 2 link so the operation is idempotent.
              lines = [line for line in text.splitlines() if 'data-p120-mobile-primary-cta="pass2"' not in line]
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

              anchor_lines = text.splitlines()
              insert_at = None
              for i, line in enumerate(anchor_lines):
                  if anchor_token in line:
                      insert_at = i + 1
                      break
              if insert_at is None:
                  raise SystemExit(f'{path}: frozen PASS 5.3 visual anchor not found')

              anchor_lines.insert(insert_at, '  ' + tag)
              path.write_text('\n'.join(anchor_lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')

          # Scope gate: the frozen brand authority files must not be modified by this pass.
          frozen = ['p120-brand-system-v1.0.css', 'p120-pass53-visual-corrections-v1.0.css']
          for item in frozen:
              if not Path(item).exists():
                  raise SystemExit(f'Frozen authority missing: {item}')
          PY

      - name: Static regression gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = ['index.html', 'en/index.html', 'en/system/index.html']
          for item in targets:
              text = Path(item).read_text(encoding='utf-8')
              if text.count('data-p120-mobile-primary-cta="pass2"') != 1:
                  raise SystemExit(f'{item}: PASS 2 link count must be exactly 1')
              if text.index('data-p120-mobile-primary-cta="pass2"') < text.index('data-p120-pass53-visual-corrections="5.3.2"'):
                  raise SystemExit(f'{item}: PASS 2 must load after PASS 5.3 visual corrections')

          changed = set()
          import subprocess
          out = subprocess.check_output(['git','diff','--name-only'], text=True)
          changed = {line.strip() for line in out.splitlines() if line.strip()}
          allowed = {'index.html','en/index.html','en/system/index.html'}
          if not changed.issubset(allowed):
              raise SystemExit('Out-of-scope files changed: ' + ', '.join(sorted(changed - allowed)))
          if not changed:
              print('PASS 2 links already present; no implementation diff required.')
          else:
              print('PASS 2 static gate PASS:', ', '.join(sorted(changed)))
          PY

      - name: Commit PASS 2 integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "PASS 2 integration already present."
            exit 0
          fi
          git config user.name "P-120 CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html en/system/index.html
          git commit -m "P120 WEB: integrate PASS 2 mobile CTA restoration"
          git push
