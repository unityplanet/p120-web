name: P-120 PASS 2 Route Language Inventory

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass1'
    paths:
      - '.github/workflows/p120-pass2-route-inventory.yml'
      - '.github/scripts/p120_pass2_route_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build route-language inventory
        run: python .github/scripts/p120_pass2_route_inventory.py
      - name: Commit inventory
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- P120_WEB_RECONCILIATION_PASS2_CYRILLIC_RUNTIME_INVENTORY.txt)" ]; then
            echo 'Inventory already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add P120_WEB_RECONCILIATION_PASS2_CYRILLIC_RUNTIME_INVENTORY.txt
            git commit -m 'Inventory PASS 2 System runtime language surfaces'
            git push
          fi