name: P120 EN Science Localization Probe v1
on:
  push:
    branches:
      - 'fix/p120-independent-render-corrections-v1'
    paths:
      - 'qa/en_science_localization_probe_v1.mjs'
      - '.github/workflows/p120-en-science-localization-probe-v1.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p120-independent-render-corrections-v1
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/p120-en-science-probe-http.log 2>&1 &
          sleep 2
      - name: Probe rendered EN Scientific Base
        run: node qa/en_science_localization_probe_v1.mjs
