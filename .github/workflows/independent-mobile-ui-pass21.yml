name: P120 WEB Independent Mobile UI PASS 2.1 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/mobile-ui-pass21-ef6020a
    paths:
      - 'qa/independent_mobile_ui_pass21.mjs'
      - '.github/workflows/independent-mobile-ui-pass21.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Independent CTA + progress runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify audit branch parent target
        shell: bash
        run: |
          git log --oneline --decorate -5
          git merge-base --is-ancestor ef6020afa0df6035bbbfe540a1ace815341589d4 HEAD
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Syntax-check independent harness
        run: node --check qa/independent_mobile_ui_pass21.mjs
      - name: Start exact-source local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-independent-mobile-ui-http.log 2>&1 &
          sleep 2
      - name: Run independent local + production matrix
        env:
          P120_LOCAL_BASE: http://127.0.0.1:4173
          P120_LIVE_BASE: https://unityplanet.github.io/p120-web
        run: node qa/independent_mobile_ui_pass21.mjs
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEB_INDEPENDENT_MOBILE_UI_PASS21_AUDIT
          path: qa-artifacts/mobile-ui-pass21-independent
          retention-days: 30
