name: Apply P-120 v1.7.1c composition fix

on:
  push:
    branches:
      - main
    paths:
      - visual-fix-v1.7.1c.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.7.1c corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Load the targeted composition layer after v1.7.1b.
          tag = '<link rel="stylesheet" href="visual-fix-v1.7.1c.css?v=171c" data-p120-visual-fix="v1.7.1c" />'
          pattern = re.compile(r'\s*<link[^>]+data-p120-visual-fix="v1\.7\.1c"[^>]*>\s*', re.I)
          if pattern.search(text):
              text = pattern.sub('\n  ' + tag + '\n', text, count=1)
          else:
              if '</head>' not in text:
                  raise SystemExit('index.html has no </head>')
              text = text.replace('</head>', '  ' + tag + '\n</head>', 1)

          # 2) Rendering-only correction in the science editorial body.
          # There are 11 topic labels after the intro; the previous slice rendered
          # only 10 and incorrectly left “отзывчивость партнёра” in prose.
          start = text.find("if(section.style==='science')")
          end = text.find("if(section.style==='life')", start)
          if start < 0 or end < 0:
              raise SystemExit('science renderer markers not found')
          chunk = text[start:end]
          if 'b.slice(1,11)' in chunk:
              chunk = chunk.replace('b.slice(1,11)', 'b.slice(1,12)', 1)
          if 'b.slice(11)' in chunk:
              chunk = chunk.replace('b.slice(11)', 'b.slice(12)', 1)
          if 'b.slice(1,11)' in chunk or 'b.slice(11)' in chunk:
              raise SystemExit('science slice correction incomplete')
          text = text[:start] + chunk + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "v1.7.1c corrections already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply v1.7.1c screenshot composition corrections"
          git push
