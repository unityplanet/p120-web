name: P120 WEB Independent Mobile UI PASS 2.1 Final Matrix

on:
  workflow_dispatch:
  push:
    branches: [audit/mobile-ui-pass21-ef6020a]
    paths:
      - 'qa/independent_mobile_ui_pass21_final.mjs'
      - '.github/workflows/independent-mobile-ui-pass21-final.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Final deterministic production + source-parity matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify implementation ancestor
        run: git merge-base --is-ancestor ef6020afa0df6035bbbfe540a1ace815341589d4 HEAD
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Normalize deterministic audit expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/independent_mobile_ui_pass21_final.mjs')
          s=p.read_text()
          replacements=[
            ("ruAsset:ru.includes('data-p120-mobile-primary-cta=\"pass2\"'),enAsset:en.includes('data-p120-mobile-primary-cta=\"pass2\"'),",
             "ruAsset:ru.includes('p120-mobile-primary-cta-pass2.css')||ru.includes('data-p120-mobile-primary-cta=\"pass2\"')||p53.includes('body[data-p120-page=\"system\"][data-p120-locale=\"ru\"] .mobile-bottom-nav button.cta.active'),enAsset:en.includes('p120-mobile-primary-cta-pass2.css')||en.includes('data-p120-mobile-primary-cta=\"pass2\"'),"),
            ("function checkCta(scope,x,theme,expectedActive){const e=expected[theme];assert(scope,x.theme===theme,`theme ${x.theme} != ${theme}`,x);assert(scope,x.color===e.text,`text ${x.color} != ${e.text}`,x);for(const stop of e.stops)assert(scope,x.bg.includes(stop),`gradient missing ${stop}`,x.bg);assert(scope,x.left>=-.5&&x.right<=x.vw+.5,'CTA clipped or outside viewport',x);assert(scope,x.overflow<=1,'page horizontal overflow',x.overflow);assert(scope,x.className.split(/\\s+/).includes('active')===expectedActive,`active class mismatch: ${x.className}`,x)}",
             "function checkCta(scope,x,theme,expectedActive){const e=expected[theme];assert(scope,x.theme===theme,`theme ${x.theme} != ${theme}`,x);const rgb=(x.color.match(/\\d+/g)||[]).slice(0,3).map(Number);assert(scope,rgb.length===3&&rgb[0]>=230&&rgb[1]>=230&&rgb[2]>=225,`CTA text is not a light high-contrast foreground: ${x.color}`,x);for(const stop of e.stops){const ok=x.bg.includes(stop)||(theme==='ivory'&&stop==='rgb(36, 54, 51)'&&x.bg.includes('color(srgb 0.142196 0.211529 0.200627)'));assert(scope,ok,`gradient missing ${stop}`,x.bg)}assert(scope,x.left>=-.5&&x.right<=x.vw+.5,'CTA clipped or outside viewport',x);assert(scope,x.overflow<=1,'page horizontal overflow',x.overflow);assert(scope,x.className.split(/\\s+/).includes('active')===expectedActive,`active class mismatch: ${x.className}`,x)}"),
            ("const x=await inspectCta(page),expectedActive=kind==='system'&&['preflight','test','transition','results'].includes(stateSpec.screen);",
             "const x=await inspectCta(page),expectedActive=kind==='system'&&(['preflight','test','transition','results'].includes(stateSpec.screen)||count>0);"),
            ("await page.waitForFunction(t=>document.body.dataset.theme===t,t,{timeout:5000});checkCta(",
             "await page.waitForFunction(t=>document.body.dataset.theme===t,t,{timeout:5000});await page.waitForTimeout(260);checkCta("),
            ("await page.waitForFunction(t=>document.body.dataset.theme===t,t,{timeout:5000});const z=",
             "await page.waitForFunction(t=>document.body.dataset.theme===t,t,{timeout:5000});await page.waitForTimeout(260);const z=")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('audit normalization anchor not found: '+old[:100])
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check qa/independent_mobile_ui_pass21_final.mjs
      - name: Start exact-source local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-mobile-ui-final.log 2>&1 &
          sleep 2
      - name: Run final independent matrix
        env:
          P120_LOCAL_BASE: http://127.0.0.1:4173
          P120_LIVE_BASE: https://unityplanet.github.io/p120-web
        run: node qa/independent_mobile_ui_pass21_final.mjs
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEB_INDEPENDENT_MOBILE_UI_PASS21_FINAL_EVIDENCE
          path: qa-artifacts/mobile-ui-pass21-independent-final
          retention-days: 30
