name: Apply P-120 v1.7.1b visual layer

on:
  push:
    branches:
      - main
    paths:
      - visual-fix-v1.7.1b.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-visual-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject visual layer link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '<link rel="stylesheet" href="visual-fix-v1.7.1b.css?v=171b" data-p120-visual-fix="v1.7.1b" />'
          pattern = re.compile(r'\s*<link[^>]+data-p120-visual-fix="v1\.7\.1b"[^>]*>\s*', re.I)

          if pattern.search(text):
              text = pattern.sub("\n  " + tag + "\n", text, count=1)
          else:
              if "</head>" not in text:
                  raise SystemExit("index.html has no </head>")
              text = text.replace("</head>", "  " + tag + "\n</head>", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit injected link
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Visual layer link already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply v1.7.1b live visual corrective layer"
          git push
