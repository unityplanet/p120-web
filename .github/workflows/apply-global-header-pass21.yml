name: P120 WEB Global Header PASS 2.1 Apply

on:
  push:
    branches: [main]
    paths:
      - 'qa/apply_global_header_pass21.py'
      - 'qa/run_global_header_pass21.py'
      - '.github/workflows/apply-global-header-pass21.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply presentation-preserving header hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate patcher syntax
        run: |
          python3 -m py_compile qa/apply_global_header_pass21.py
          python3 -m py_compile qa/run_global_header_pass21.py
      - name: Normalize compact EN Explore header formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ('en/extended/index.html','en/together/index.html'):
              p=Path(rel)
              text=p.read_text(encoding='utf-8')
              text=text.replace('<button class="explore-menu-btn"','\n    <button class="explore-menu-btn"',1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Apply deterministic PASS 2.1 patch
        run: python3 qa/run_global_header_pass21.py
      - name: Validate diff
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
      - name: Commit hardened production sources
        run: |
          git config user.name "P-120 CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            index.html en/index.html \
            science/index.html en/science/index.html \
            system/index.html en/system/index.html \
            extended/index.html en/extended/index.html \
            together/index.html en/together/index.html \
            creator/index.html en/creator/index.html \
            why-p120/index.html en/why-p120/index.html \
            intellectual-property/index.html en/intellectual-property/index.html \
            terms/index.html en/terms/index.html \
            privacy/index.html en/privacy/index.html \
            p120-brand-system-v1.0.js explore-system-v1.0.js founder-route-v1.1.js p120-legal-runtime-v1.0.js
          git commit -m "P120 WEB: PASS 2.1 harden global header authority"
          git push origin HEAD:main
