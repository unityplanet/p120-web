name: P120 WEB-SCIENCE PASS 4D Claim Boundary Parity Seal

on:
  push:
    branches:
      - 'web-science-ext-pass4d-claim-boundary-parity-qa'
    paths:
      - '.github/workflows/p120-webscience-pass4d-seal.yml'
      - '.github/scripts/p120_webscience_pass4d_closure.py'
      - 'qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs'
      - 'qa/webscience_pass4d_claim_boundary_browser_gate_v0.8.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-pass4d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PASS 4C baseline and protected scientific scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='211c0f4f0d2601c46bc2d4d283ade84aee474c47'
          git diff --quiet "$BASE" HEAD -- \
            science/index.html en/science/index.html \
            p120-scientific-base-runtime-v1.0.js \
            p120-webscience-pass4b-renderer-v0.6.js \
            p120-webscience-pass4c-library-v0.7.js \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json \
            P120_WEBSCI_PRODUCTION_registry_v1.0_2026-09-02.json \
            p120-session-contract-v1.0.js p120-submission-intake-v1.0.js manual-report-handoff-v1.0.js
          echo 'PASS 4C protected scientific/runtime baseline: PASS'

      - name: Re-run PASS 4A scientific projection gate
        run: node qa/webscience_pass4a_projection_gate_v0.5.mjs

      - name: Run PASS 4D static claim-boundary and bilingual gate
        shell: bash
        run: |
          set -euo pipefail
          node qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs || {
            jq '.failures' qa-evidence-webscience-pass4d/P120_WEBSCI_EXT_PASS4_PASS4D_STATIC_QA_RESULT_v0.8.json
            exit 1
          }

      - name: Re-materialize and verify Global-70 reproducibility
        shell: bash
        run: |
          set -euo pipefail
          node qa/webscience_pass4c_materialize_global_library_v0.7.mjs
          git diff --exit-code -- webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json

      - name: Verify QA script syntax
        run: |
          node --check qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs
          node --check qa/webscience_pass4d_claim_boundary_browser_gate_v0.8.mjs

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local P-120 site
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/p120-pass4d-http.log 2>&1 &
          sleep 2
          curl -fsS 'http://127.0.0.1:4179/science/' >/dev/null
          curl -fsS 'http://127.0.0.1:4179/en/science/' >/dev/null

      - name: Re-run PASS 4C Global-70 browser regression
        run: node qa/webscience_pass4c_library_gate_v0.7.mjs

      - name: Run PASS 4D rendered claim-boundary and RU/EN parity gate
        run: node qa/webscience_pass4d_claim_boundary_browser_gate_v0.8.mjs

      - name: Build controlled PASS 4D closure records
        run: python3 .github/scripts/p120_webscience_pass4d_closure.py

      - name: Commit controlled PASS 4D closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P120 Research System'
          git config user.email '57597994+unityplanet@users.noreply.github.com'
          git add webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_* webscience/pass4/README.md
          git commit -m 'WEB-SCIENCE PASS 4D: close claim-boundary and RU-EN parity QA'
          git push origin HEAD:web-science-ext-pass4d-claim-boundary-parity-qa

      - name: Build sealed PASS 4D package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='P120_WEBSCI_EXT_PASS4D_v0.8_PASS_PACKAGE'
          mkdir -p "$ROOT/webscience/pass4" "$ROOT/qa" "$ROOT/RELEASE_CONTROL" "$ROOT/qa-evidence/screenshots" "$ROOT/SOURCE_AUTHORITY"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_REPORT_v0.8.md "$ROOT/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_DECISION_v0.8.md "$ROOT/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_STATIC_QA_RESULT_v0.8.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_BROWSER_QA_RESULT_v0.8.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_CLAIM_MATRIX_v0.8.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_QA_SUMMARY_v0.8.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_MANIFEST_v0.8.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_SHA256SUMS_v0.8.txt "$ROOT/RELEASE_CONTROL/"
          cp qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs qa/webscience_pass4d_claim_boundary_browser_gate_v0.8.mjs "$ROOT/qa/"
          cp qa-evidence-webscience-pass4d/P120_WEBSCI_EXT_PASS4_PASS4D_STATIC_QA_RESULT_v0.8.json qa-evidence-webscience-pass4d/P120_WEBSCI_EXT_PASS4_PASS4D_BROWSER_QA_RESULT_v0.8.json qa-evidence-webscience-pass4d/P120_WEBSCI_EXT_PASS4_PASS4D_CLAIM_MATRIX_v0.8.json "$ROOT/qa-evidence/"
          cp qa-evidence-webscience-pass4d/screenshots/* "$ROOT/qa-evidence/screenshots/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/README.md "$ROOT/PASS4_WORKSTREAM_README.md"
          printf '%s\n' \
            'Repository: unityplanet/p120-web' \
            'Branch: web-science-ext-pass4d-claim-boundary-parity-qa' \
            'Baseline PASS 4C: 211c0f4f0d2601c46bc2d4d283ade84aee474c47' \
            "Closure commit: $(git rev-parse HEAD)" \
            'Production merge: NOT PERFORMED' \
            > "$ROOT/RELEASE_CONTROL/REPOSITORY_PROVENANCE.txt"
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt)
          zip -qr "${ROOT}.zip" "$ROOT"
          sha256sum "${ROOT}.zip" > "${ROOT}.zip.sha256"

      - name: Upload PASS 4D package and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_EXT_PASS4D_v0.8_PASS_PACKAGE
          path: |
            P120_WEBSCI_EXT_PASS4D_v0.8_PASS_PACKAGE.zip
            P120_WEBSCI_EXT_PASS4D_v0.8_PASS_PACKAGE.zip.sha256
            qa-evidence-webscience-pass4d/
          if-no-files-found: error
