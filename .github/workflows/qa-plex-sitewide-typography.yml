name: P-120 Plex Sitewide Typography QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'why-p120/**'
      - 'creator/**'
      - 'en/creator/**'
      - 'founder-editorial-story-v1.0.css'
      - 'founder-visual-objects-v1.0.css'
      - 'qa/plex_sitewide_typography.mjs'
      - '.github/workflows/qa-plex-sitewide-typography.yml'

permissions:
  contents: read

jobs:
  typography-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run local site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/p120-plex-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent http://127.0.0.1:8765/creator/ >/dev/null
          curl --fail --silent http://127.0.0.1:8765/why-p120/ >/dev/null
      - name: Cross-site typography and geometry QA
        env:
          P120_QA_BASE: http://127.0.0.1:8765/
        run: node qa/plex_sitewide_typography.mjs
      - name: Upload typography evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120-PLEX-SITEWIDE-TYPOGRAPHY-EVIDENCE
          path: qa-artifacts/plex-sitewide/
          if-no-files-found: warn
          retention-days: 30
