name: P120 WEB Header PASS 2.1 PATCH 2 Fixture Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-pass21-patch2-fixture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile saved-session QA fixture to canonical RU respondent authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/global_header_code_hardening_pass21.mjs')
          s=p.read_text(encoding='utf-8')
          old="    localStorage.setItem('p120_web_prototype_v01',JSON.stringify(fixture));"
          new="    localStorage.setItem('p120_runtime_session_ru_v1',JSON.stringify({...fixture,sessionLocale:'ru'}));"
          if s.count(old)!=1:
              raise SystemExit(f'expected one legacy header-QA fixture, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- qa/global_header_code_hardening_pass21.mjs
      - name: Commit QA-harness-only correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "P-120 Controlled Automation"
          git config user.email "actions@users.noreply.github.com"
          git add qa/global_header_code_hardening_pass21.mjs
          git commit -m "P120 WEB: align header QA fixture with canonical session authority"
          git push origin HEAD:main
