name: P120 Reference Renderer v1.0.1 CI
on:
  push:
    branches:
      - 'p120/reference-renderer-reissue'
permissions:
  contents: read
jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical source
        run: python -m py_compile reference_renderer/p120_reference_renderer.py
      - name: Run contract tests
        run: python reference_renderer/tests/test_reference_renderer.py
      - name: Source identity
        shell: bash
        run: |
          sha256sum reference_renderer/p120_reference_renderer.py
          test "$(sha256sum reference_renderer/p120_reference_renderer.py | awk '{print $1}')" = "279f5e4cd1c8b932466dd628319b2f082e1d7d3b2b520455eae94cbade4f7c00"
