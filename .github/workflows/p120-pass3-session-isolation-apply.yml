name: P120 PASS 3 Session Isolation Apply

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass3'
    paths:
      - '.github/scripts/p120_pass3_session_isolation.py'
      - 'p120-session-contract-v1.0.js'
      - '.github/workflows/p120-pass3-session-isolation-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pass3-session-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p120-runtime-reconciliation-pass3
          fetch-depth: 0
      - name: Apply controlled PASS 3 session boundary
        run: python3 .github/scripts/p120_pass3_session_isolation.py
      - name: Verify protected content was not structurally altered
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          def instrument(path):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'window\.P120_INSTRUMENT\s*=\s*(\{.*?\});\s*</script>',s,re.S)
              if not m: raise SystemExit(f'instrument missing: {path}')
              return json.loads(m.group(1))
          def manifest(x):
              return [(i['id'],i.get('module'),i.get('type'),tuple(c.get('value') for c in i.get('choices',[]))) for i in x['items']]
          ru=instrument('system/index.html'); en=instrument('en/system/index.html')
          if len(ru['items'])!=180 or len(en['items'])!=180: raise SystemExit('item count changed')
          if manifest(ru)!=manifest(en): raise SystemExit('measurement manifest mismatch')
          print('Protected measurement manifest: PASS 180/180')
          PY
      - name: Commit PASS 3 materialization
        shell: bash
        run: |
          files=(index.html en/index.html system/index.html en/system/index.html)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo 'PASS 3 materialization already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'Materialize PASS 3 locale-isolated sessions'
            git push
          fi
