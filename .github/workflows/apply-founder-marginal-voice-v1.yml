name: Apply Founder Marginal Voice v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-founder-marginal-voice-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote Light Italic marginal voice to production
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('creator/index.html')
          s=p.read_text()
          s=s.replace('../founder-marginal-typography-lab-v0.1.css?v=fndlab01','../founder-marginal-voice-v1.0.css?v=fndmv10')
          s=s.replace('data-p120-founder-type-lab="v0.1"','data-p120-founder-marginal="v1.0"')
          s=s.replace('../founder-marginal-typography-lab-v0.1.js?v=fndlab01','../founder-marginal-voice-v1.0.js?v=fndmv10')
          p.write_text(s)
          PY
          git rm -f founder-marginal-typography-lab-v0.1.css founder-marginal-typography-lab-v0.1.js || true
      - name: Commit controlled production adoption
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator/index.html founder-marginal-voice-v1.0.css founder-marginal-voice-v1.0.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: freeze Plex Light Italic as Founder marginal voice"
          git push
