name: Apply P-120 locale instrumentation v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-locale-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch locale into automatic and manual payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          intake = Path('p120-submission-intake-v1.0.js')
          text = intake.read_text(encoding='utf-8')
          needle = "      participant_id: state.participantId,\n      instrument: {"
          replacement = "      participant_id: state.participantId,\n      locale: isEn ? 'en' : 'ru',\n      instrument: {"
          if "locale: isEn ? 'en' : 'ru'" not in text:
              if needle not in text:
                  raise SystemExit('intake participant insertion point missing')
              text = text.replace(needle, replacement, 1)
          fp_needle = "        participant_id:pkg.participant_id,\n        form_version:pkg.instrument.form_version,"
          fp_replacement = "        participant_id:pkg.participant_id,\n        locale:pkg.locale,\n        form_version:pkg.instrument.form_version,"
          if "        locale:pkg.locale," not in text:
              if fp_needle not in text:
                  raise SystemExit('intake fingerprint insertion point missing')
              text = text.replace(fp_needle, fp_replacement, 1)
          intake.write_text(text, encoding='utf-8')

          handoff = Path('manual-report-handoff-v1.0.js')
          text = handoff.read_text(encoding='utf-8')
          needle = "      participant_id: state.participantId,\n      instrument: {"
          replacement = "      participant_id: state.participantId,\n      locale: isEn ? 'en' : 'ru',\n      instrument: {"
          if "locale: isEn ? 'en' : 'ru'" not in text:
              if needle not in text:
                  raise SystemExit('handoff participant insertion point missing')
              text = text.replace(needle, replacement, 1)
          handoff.write_text(text, encoding='utf-8')

          for path in [Path('index.html'), Path('en/index.html')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('psi10', 'psi11').replace('mrh10', 'mrh11')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Acceptance checks
        shell: bash
        run: |
          node --check p120-submission-intake-v1.0.js
          node --check manual-report-handoff-v1.0.js
          python - <<'PY'
          from pathlib import Path
          intake = Path('p120-submission-intake-v1.0.js').read_text(encoding='utf-8')
          handoff = Path('manual-report-handoff-v1.0.js').read_text(encoding='utf-8')
          if "locale: isEn ? 'en' : 'ru'" not in intake:
              raise SystemExit('intake locale missing')
          if "locale:pkg.locale" not in intake:
              raise SystemExit('locale missing from fingerprint')
          if "locale: isEn ? 'en' : 'ru'" not in handoff:
              raise SystemExit('handoff locale missing')
          for file in ['index.html','en/index.html']:
              text = Path(file).read_text(encoding='utf-8')
              if 'psi11' not in text or 'mrh11' not in text:
                  raise SystemExit(f'{file}: cache bump missing')
          print('P-120 locale instrumentation gate: PASS')
          PY

      - name: Commit locale instrumentation
        shell: bash
        run: |
          if git diff --quiet -- p120-submission-intake-v1.0.js manual-report-handoff-v1.0.js index.html en/index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p120-submission-intake-v1.0.js manual-report-handoff-v1.0.js index.html en/index.html
          git commit -m 'feat: record RU EN locale in P-120 submissions [skip ci]'
          git push origin HEAD:main
