name: P120 PASS 4 Post-Science Cleanup Apply

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass4'
    paths:
      - '.github/scripts/p120_pass4_post_science_cleanup.py'
      - '.github/workflows/p120-pass4-post-science-cleanup-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p120-runtime-reconciliation-pass4
          fetch-depth: 0

      - name: Verify exact PASS 4 ancestry
        run: |
          test "$(git merge-base HEAD f46b7335e47d75672424136979f91a1a3997aa37)" = "f46b7335e47d75672424136979f91a1a3997aa37"
          echo 'PASS 4 production-baseline ancestry: PASS'

      - name: Snapshot protected production assets
        run: |
          sha256sum \
            index.html en/index.html \
            science/index.html en/science/index.html \
            system/index.html en/system/index.html \
            p120-scientific-base-runtime-v1.0.js \
            P120_WEBSCI_PRODUCTION_registry_v1.0_2026-09-02.json \
            p120-session-contract-v1.0.js \
            p120-submission-intake-v1.0.js \
            manual-report-handoff-v1.0.js \
            science-navigation-reconciliation-v1.0.js \
            p120-en-science-localization-runtime-v1.0.js \
            public-en-science-dictionary-v1.0.js \
            > /tmp/p120-pass4-protected-before.sha256

      - name: Apply narrow post-Science cleanup
        run: python3 .github/scripts/p120_pass4_post_science_cleanup.py

      - name: Verify protected production assets byte-identical
        run: |
          sha256sum -c /tmp/p120-pass4-protected-before.sha256
          echo 'Protected production byte identity: PASS'

      - name: Verify cleanup diff is deletion-only plus PASS 4 control tooling
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allowed_add={
            '.github/scripts/p120_pass4_post_science_inventory.py',
            '.github/workflows/p120-pass4-post-science-inventory.yml',
            'P120_PASS4_POST_SCIENCE_INVENTORY_v1.0.json',
            'P120_PASS4_POST_SCIENCE_INVENTORY_v1.0.md',
            '.github/scripts/p120_pass4_post_science_cleanup.py',
            '.github/workflows/p120-pass4-post-science-cleanup-apply.yml',
          }
          status=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          bad=[]
          for row in status:
            code=row[:2]
            path=row[3:]
            if code.strip()=='D':
              continue
            if path in allowed_add:
              continue
            bad.append(row)
          if bad:
            raise SystemExit('Unauthorized PASS 4 worktree delta: '+repr(bad))
          print('PASS 4 cleanup delta boundary: PASS')
          PY

      - name: Commit cleanup implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Cleanup already materialized.'
          else
            git commit -m 'PASS 4: remove obsolete post-Science operational debris'
            git push
          fi
