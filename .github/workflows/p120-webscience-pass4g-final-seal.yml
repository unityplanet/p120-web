name: P120 WEB-SCIENCE PASS 4G Mandatory Full Package Final Seal

on:
  push:
    branches:
      - 'web-science-ext-pass4g-final-sealing'
    paths:
      - 'qa/webscience_pass4g_final_seal_gate_v1.1.py'
      - '.github/scripts/p120_webscience_pass4g_closure.py'
      - '.github/workflows/p120-webscience-pass4g-final-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-pass4g:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PASS 4F final authority is protected
        shell: bash
        run: |
          set -euo pipefail
          BASE='1155a78646a314e3693aa7b247e667b86507a1d4'
          git diff --quiet "$BASE" HEAD -- \
            science/index.html en/science/index.html \
            p120-scientific-base-runtime-v1.0.js \
            p120-webscience-pass4b-renderer-v0.6.js \
            p120-webscience-pass4c-library-v0.7.js \
            p120-webscience-pass4e-visual-v0.9.css \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json \
            P120_WEBSCI_PRODUCTION_registry_v1.0_2026-09-02.json \
            p120-session-contract-v1.0.js p120-submission-intake-v1.0.js manual-report-handoff-v1.0.js
          git merge-base --is-ancestor "$BASE" HEAD

      - name: Verify PASS 4G scripts
        run: |
          python3 -m py_compile qa/webscience_pass4g_final_seal_gate_v1.1.py
          python3 -m py_compile .github/scripts/p120_webscience_pass4g_closure.py

      - name: Re-run PASS 4A publication projection gate
        run: node qa/webscience_pass4a_projection_gate_v0.5.mjs

      - name: Re-materialize Global-70 and require zero diff
        shell: bash
        run: |
          set -euo pipefail
          node qa/webscience_pass4c_materialize_global_library_v0.7.mjs
          git diff --exit-code -- webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json

      - name: Re-run PASS 4D static claim-boundary parity gate
        run: node qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local P-120 site
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/p120-pass4g-http.log 2>&1 &
          sleep 2
          curl -fsS 'http://127.0.0.1:4179/science/' >/dev/null
          curl -fsS 'http://127.0.0.1:4179/en/science/' >/dev/null

      - name: Re-run PASS 4C Global-70 browser regression
        run: node qa/webscience_pass4c_library_gate_v0.7.mjs

      - name: Re-run PASS 4D rendered claim/parity regression
        run: node qa/webscience_pass4d_claim_boundary_browser_gate_v0.8.mjs

      - name: Re-run PASS 4E browser responsive typography regression
        run: node qa/webscience_pass4e_browser_typography_gate_v0.9.mjs

      - name: Re-run PASS 4F closure reconciliation
        run: python3 qa/webscience_pass4f_closure_reconciliation_gate_v1.0.py

      - name: Run PASS 4G final parent seal gate
        run: python3 qa/webscience_pass4g_final_seal_gate_v1.1.py

      - name: Build final PASS 4 closure records
        run: python3 .github/scripts/p120_webscience_pass4g_closure.py

      - name: Verify final records and repository SHA ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          W=Path('webscience/pass4')
          s=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_STATUS_RECORD_v1.1.json').read_text())
          m=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_MANIFEST_v1.1.json').read_text())
          q=json.loads((W/'P120_WEBSCI_EXT_PASS4_PASS4G_QA_SUMMARY_v1.1.json').read_text())
          idx=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_PACKAGE_INDEX_v1.1.json').read_text())
          assert s['status']=='CLOSED_CONTROLLED_SEALED'
          assert m['status']=='WEBSCI_EXT_PASS4_CLOSED_CONTROLLED_SEALED'
          assert m['unresolved_delta_count']==0
          assert q['status']=='PASS' and q['checks_failed']==0
          assert idx['file_count']==len(idx['files']) and idx['file_count']>40
          for p in idx['files']:
              assert Path(p).exists(), p
          print('final control records: PASS; indexed files:',idx['file_count'])
          PY
          sha256sum -c webscience/pass4/P120_WEBSCI_EXT_PASS4_FINAL_SHA256SUMS_v1.1.txt
          git diff --check

      - name: Commit final PASS 4 parent seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P120 Research System'
          git config user.email '57597994+unityplanet@users.noreply.github.com'
          git add webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4G_* \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_FINAL_* \
                  webscience/pass4/README.md
          git commit -m 'WEB-SCIENCE PASS 4G: seal final mandatory PASS 4 package authority'
          git push origin HEAD:web-science-ext-pass4g-final-sealing

      - name: Build mandatory full sealed PASS 4 package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE'
          mkdir -p "$ROOT/RELEASE_CONTROL"
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path('P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE')
          idx=json.loads(Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_FINAL_PACKAGE_INDEX_v1.1.json').read_text())
          for srcs in idx['files']:
              src=Path(srcs); dst=root/srcs
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
          PY
          printf '%s\n' \
            'Repository: unityplanet/p120-web' \
            'Workstream: WEB-SCIENCE EXT PASS 4' \
            'Final sealing branch: web-science-ext-pass4g-final-sealing' \
            'PASS 4F baseline: 1155a78646a314e3693aa7b247e667b86507a1d4' \
            "PASS 4G closure commit: $(git rev-parse HEAD)" \
            'Parent status: CLOSED / CONTROLLED / SEALED' \
            'Production merge: NOT PERFORMED' \
            'Production activation: SEPARATE CONTROLLED GATE REQUIRED' \
            > "$ROOT/RELEASE_CONTROL/REPOSITORY_PROVENANCE.txt"
          (cd "$ROOT" && find . -type f ! -path './RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt)
          zip -qr "${ROOT}.zip" "$ROOT"
          sha256sum "${ROOT}.zip" > "${ROOT}.zip.sha256"

      - name: Independent post-build package verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT='P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE'
          ZIP="${ROOT}.zip"
          unzip -t "$ZIP" >/tmp/pass4g-zip-test.txt
          EXPECTED=$(cut -d' ' -f1 "${ZIP}.sha256")
          ACTUAL=$(sha256sum "$ZIP" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          rm -rf /tmp/pass4g_verify && mkdir -p /tmp/pass4g_verify
          unzip -q "$ZIP" -d /tmp/pass4g_verify
          cd "/tmp/pass4g_verify/$ROOT"
          sha256sum -c RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt
          sha256sum -c webscience/pass4/P120_WEBSCI_EXT_PASS4_FINAL_SHA256SUMS_v1.1.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          W=Path('webscience/pass4')
          s=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_STATUS_RECORD_v1.1.json').read_text())
          m=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_MANIFEST_v1.1.json').read_text())
          q=json.loads((W/'P120_WEBSCI_EXT_PASS4_PASS4G_QA_SUMMARY_v1.1.json').read_text())
          idx=json.loads((W/'P120_WEBSCI_EXT_PASS4_FINAL_PACKAGE_INDEX_v1.1.json').read_text())
          assert s['status']=='CLOSED_CONTROLLED_SEALED'
          assert m['status']=='WEBSCI_EXT_PASS4_CLOSED_CONTROLLED_SEALED'
          assert q['status']=='PASS' and q['checks_failed']==0
          assert idx['file_count']==len(idx['files'])
          missing=[p for p in idx['files'] if not Path(p).exists()]
          assert not missing, missing
          print('independent package verification: PASS; files:',idx['file_count'])
          PY

      - name: Upload final mandatory sealed PASS 4 package
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE
          path: |
            P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE.zip
            P120_WEBSCI_EXT_PASS4_v1.1_FINAL_SEALED_PACKAGE.zip.sha256
            qa-evidence-webscience-pass4g/
          if-no-files-found: error
