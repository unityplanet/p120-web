name: P120 FA01 Srcdoc Direct Diagnostic

on:
  push:
    branches:
      - audit/fa01-respondent-render-20260905

permissions:
  contents: read

jobs:
  srcdoc-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build isolated exact-transform harness
        run: |
          mkdir -p qa/fa01-srcdoc
          node <<'NODE'
          const fs=require('fs');
          function assignedObject(html,name){
            const tok=name+' = ',t=html.indexOf(tok),start=html.indexOf('{',t+tok.length);
            if(t<0||start<0)throw new Error('assignment_missing');
            let dep=0,str=false,esc=false;
            for(let i=start;i<html.length;i++){
              const c=html[i];
              if(str){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c==='"')str=false;continue}
              if(c==='"'){str=true;continue}if(c==='{')dep++;if(c==='}'&&--dep===0)return JSON.parse(html.slice(start,i+1));
            }
            throw new Error('assignment_unterminated');
          }
          const base=assignedObject(fs.readFileSync('system/index.html','utf8'),'window.P120_INSTRUMENT');
          const roleDefs=[['COM12',24],['MOT12',24],['SELF12',21],['LIFE_T3',4]],mods=[],items=[];
          for(const [role,n] of roleDefs){mods.push({id:role,name:'Synthetic '+role,title:'Synthetic '+role,intro:'QA only',count:n});for(let i=1;i<=n;i++)items.push({id:`QA_${role}_${i}`,module:role,type:'single_choice',text:'Synthetic render item',choices:[{value:'1',label:'Synthetic option',response_state:'ANSWERED'}]});}
          const instrument={...base,status:'Founder Alpha QA',modules:[...base.modules,...mods],items:[...base.items,...items]};
          let adapter=fs.readFileSync('internal/runtime/p120-alpha-system-adapter-v1.0.js','utf8');
          const tail="  $('back').onclick=()=>location.href='../';$('saveFeedback').onclick=saveFeedback;init().catch(e=>{console.error('[P120 FA01 adapter]',e);gate('LAUNCH BLOCKED\\n'+(e.message||String(e)),'danger')});";
          if(!adapter.includes(tail))throw new Error('adapter_tail_marker_missing');
          adapter=adapter.replace(tail,"  window.__P120_TEST=Object.freeze({transform,compose,metaMap});");
          fs.writeFileSync('qa/fa01-srcdoc/adapter-test.js',adapter);
          const runner=`(async()=>{const r=await fetch('/system/index.html',{cache:'no-store'});const system=await r.text();const c={adapterVersion:'fa01-existing-runtime-adapter-v1',sessionId:'11111111-1111-4111-8111-111111111111',sessionKey:'p120_account_runtime_qa',metaKey:'p120_alpha_response_meta_qa',instrument:${JSON.stringify(instrument)},itemMeta:{},packageVersion:'qa',packageHash:'${'2'.repeat(64)}'};const html=window.__P120_TEST.transform(system,c);document.getElementById('systemFrame').srcdoc=html;window.__P120_TRANSFORM_DONE=true;})().catch(e=>{console.error('[DIRECT HARNESS]',e);window.__P120_DIRECT_ERROR=String(e&&e.stack||e)});`;
          fs.writeFileSync('qa/fa01-srcdoc/direct-run.js',runner);
          fs.writeFileSync('qa/fa01-srcdoc/index.html',`<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src https://fonts.bunny.net; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'"></head><body><iframe id="systemFrame" style="width:390px;height:800px"></iframe><script>window.P120_SUBMISSION_CONFIG={projectUrl:'https://qa.invalid',publishableKey:'qa'};window.supabase={createClient:()=>({})}</script><script src="/qa/fa01-srcdoc/adapter-test.js"></script><script src="/qa/fa01-srcdoc/direct-run.js"></script></body></html>`);
          NODE
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-http.log 2>&1 &
          sleep 2
      - name: Diagnose srcdoc execution
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:900}});
            const events=[],errors=[];
            page.on('console',m=>events.push(`[${m.type()}] ${m.text()}`));
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.goto('http://127.0.0.1:4173/qa/fa01-srcdoc/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__P120_TRANSFORM_DONE||window.__P120_DIRECT_ERROR,{timeout:10000});
            await page.waitForTimeout(3000);
            const frames=page.frames().filter(f=>f!==page.mainFrame());
            const frame=frames[0];
            const outer=await page.evaluate(()=>({directError:window.__P120_DIRECT_ERROR||null,transformDone:!!window.__P120_TRANSFORM_DONE,srcdocLength:document.getElementById('systemFrame').srcdoc.length}));
            let inner=null;
            if(frame)inner=await frame.evaluate(()=>({href:location.href,readyState:document.readyState,bodyText:(document.body?.innerText||'').slice(0,800),bodyHTMLLength:document.body?.innerHTML.length||0,appHTMLLength:document.getElementById('app')?.innerHTML.length||0,itemCount:window.P120_INSTRUMENT?.items?.length||0,moduleCount:window.P120_INSTRUMENT?.modules?.length||0,sessionKey:window.P120_SESSION_KEY||null,alphaBridge:!!window.P120AlphaBridge}));
            console.log('OUTER='+JSON.stringify(outer));
            console.log('INNER='+JSON.stringify(inner));
            console.log('PAGE_ERRORS='+JSON.stringify(errors));
            console.log('CONSOLE_EVENTS='+JSON.stringify(events));
            if(!inner||inner.appHTMLLength<50||inner.bodyText.trim().length<30)throw new Error('SRC_DOC_RESPONDENT_RENDER_BLANK');
            if(inner.itemCount!==253||inner.moduleCount!==9)throw new Error('COMPOSED_INSTRUMENT_NOT_253_9');
            if(errors.length)throw new Error('BROWSER_ERRORS_PRESENT');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
