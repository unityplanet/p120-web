name: P120 Web Design Reconciliation PASS 4

on:
  push:
    branches:
      - work/web-design-pass4-homepage-visual-reconciliation
  pull_request:
    paths:
      - 'homepage/homepage-design-reconciliation-pass4.js'
      - 'homepage/homepage-design-reconciliation-pass4.css'
      - 'mobile-session-resume-v1.0.js'
      - 'qa/web_design_reconciliation_pass4_*.mjs'
      - '.github/workflows/p120-web-design-reconciliation-pass4.yml'
      - 'P120_WEB_DESIGN_RECONCILIATION_PASS4*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass4-static:
    name: PASS 4 homepage authority / firewall gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax preflight
        run: |
          node --check homepage/homepage-design-reconciliation-pass4.js
          node --check mobile-session-resume-v1.0.js
          node --check qa/web_design_reconciliation_pass4_static.mjs
          node --check qa/web_design_reconciliation_pass4_render.mjs
      - name: Run PASS 4 static gate
        run: node qa/web_design_reconciliation_pass4_static.mjs
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEB_DESIGN_PASS4_STATIC_QA
          path: qa-evidence-web-design-pass4/
          retention-days: 30

  pass4-render:
    name: PASS 4 responsive render / runtime firewall
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local production and GitHub-Pages-prefix sites
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-pass4-root.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory .. >/tmp/p120-pass4-prefix.log 2>&1 &
          sleep 2
      - name: Run PASS 4 RU/EN responsive render gate
        env:
          P120_QA_BASE: http://127.0.0.1:4174/p120-web
        run: node qa/web_design_reconciliation_pass4_render.mjs
      - name: Re-run Main locale/theme regression
        env:
          P120_QA_BASE: http://127.0.0.1:4174/p120-web
        run: node qa/main_quick_locale_theme_patch3_pass2_reconciled.mjs
      - name: Re-run mobile chapter regression
        env:
          P120_QA_BASE: http://127.0.0.1:4174/p120-web
        run: node qa/mobile_quick_chapter_navigation_pass2.mjs
      - name: Re-run mobile session resume regression
        env:
          P120_QA_BASE: http://127.0.0.1:4174/p120-web
        run: node qa/mobile_session_resume_patch2_pass2.mjs
      - name: Re-run frozen Global Header PASS 2.1 gate
        env:
          P120_QA_BASE: http://127.0.0.1:4173
        run: node qa/global_header_code_hardening_pass21.mjs
      - name: Re-run original Global Header PASS 1 gate
        env:
          P120_QA_BASE: http://127.0.0.1:4173
        run: node qa/global_header_brand_lockup_cleaning_pass1.mjs
      - name: Re-run footer presentation gate under project prefix
        env:
          P120_QA_BASE: http://127.0.0.1:4174/p120-web
        run: node qa/footer_link_presentation_correction_pass1.mjs
      - name: Upload PASS 4 render and cross-regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEB_DESIGN_PASS4_RENDER_QA
          path: |
            qa-artifacts/web-design-pass4
            qa-artifacts/main-quick-locale-theme-patch3-pass2-reconciled
            qa-artifacts/mobile-quick-chapters-pass2
            qa-artifacts/mobile-session-resume-patch2-pass2
            qa-artifacts/header-code-pass21
            qa-artifacts/header-lockup-pass1
            qa-artifacts/footer-link-correction-pass1
          retention-days: 30
