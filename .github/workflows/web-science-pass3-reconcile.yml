name: WEB-SCIENCE EXT PASS 3 Reconcile Gate
on:
  push:
    branches:
      - web-science-ext-pass3-reconcile
    paths:
      - '.github/workflows/web-science-pass3-reconcile.yml'
      - 'science-navigation-reconciliation-v1.0.js'
      - 'p120-science-atlas-adapter-v0.3.js'
      - 'P120_WEBSCI_EXT_runtime_registry_v0.3_2026-09-02.json'
      - 'qa/webscience_pass3_reconcile.mjs'
      - 'en/navigation-unification-v1.0.css'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-science-ext-pass3-reconcile
          fetch-depth: 0
      - name: Verify baseline ancestry
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e2c8c0287b90f43aef50aa716b2a1e621855a15a"
          test "$(git rev-parse e2c8c0287b90f43aef50aa716b2a1e621855a15a:science/index.html)" = "42551c1886361381154fbdd2ef7cad434d62662e"
          test "$(git rev-parse e2c8c0287b90f43aef50aa716b2a1e621855a15a:en/science/index.html)" = "cb7ab0c2be85566469e54de82ecf97f6f76d69e7"
      - name: Static syntax checks
        run: |
          node --check p120-science-atlas-adapter-v0.3.js
          node --check science-navigation-reconciliation-v1.0.js
          node --check extended-research-navigation-v1.0.js
          node --check p120-brand-system-v1.0.js
          node --check p120-public-runtime-v1.0.js
          node --check public-en-runtime-v1.0.js
          node --check p120-en-system-runtime-v0.4.js
          node --check qa/webscience_pass3_reconcile.mjs
          python3 -m json.tool P120_WEBSCI_EXT_runtime_registry_v0.3_2026-09-02.json >/dev/null
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-webscience-reconcile-http.log 2>&1 &
          sleep 2
      - name: Run reconciliation QA
        run: node qa/webscience_pass3_reconcile.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_PASS3_RECONCILE_QA
          path: qa-artifacts/webscience-pass3-reconcile
          retention-days: 30
