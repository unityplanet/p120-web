name: Apply Founder Editorial Story v1.1 Dedicated Page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-founder-editorial-story-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify dedicated-page source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f p120-public-runtime-v1.0.js
          test -f founder-route-v1.1.js
          test -f founder-editorial-story-v1.0.js
          test -f founder-editorial-story-v1.0.css
          test -f creator/index.html
          test -f qa/check_founder_separate_page.py
          grep -q "creator:{status:'reserved',route:'creator'}" p120-public-runtime-v1.0.js
          node --check founder-route-v1.1.js
          node --check founder-editorial-story-v1.0.js

      - name: Reconcile dedicated-page CTA destinations
        shell: python
        run: |
          from pathlib import Path
          p=Path('founder-editorial-story-v1.0.js')
          s=p.read_text(encoding='utf-8')
          old="""        const route=btn.dataset.founderRoute;
        if(route==='science'){
          if(activateExistingHook('[data-science]'))return;
          location.hash='science-top';
        } else if(route==='why'){
          if(activateExistingHook('[data-why-origin]'))return;
          location.href='why-p120/';
        } else if(route==='self'){
          if(activateExistingHook('[data-mobile-start]'))return;
          const preflight=document.querySelector('.preflight');
          preflight?.scrollIntoView({block:'start'});
        }
"""
          new="""        const route=btn.dataset.founderRoute;
        const dedicated=/\\/creator\\/(?:index\\.html)?$/i.test(location.pathname);
        if(dedicated){
          const destination=route==='science'?'../#science-foundation':route==='why'?'../why-p120/':'../?start=1';
          location.href=new URL(destination,location.href).href;
          return;
        }
        if(route==='science'){
          if(activateExistingHook('[data-science]'))return;
          location.hash='science-foundation';
        } else if(route==='why'){
          if(activateExistingHook('[data-why-origin]'))return;
          location.href='why-p120/';
        } else if(route==='self'){
          if(activateExistingHook('[data-mobile-start]'))return;
          location.search='?start=1';
        }
"""
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif "const dedicated=/\\/creator\\/" not in s:
              raise SystemExit('Expected Founder CTA block not found; refusing blind patch')

      - name: Remove long Founder Story from main and wire dedicated route
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<link[^>]+href="founder-editorial-story-v1\.0\.css(?:\?[^\"]*)?"[^>]*>\s*','\n',s,count=1)
          s=re.sub(r'\s*<script[^>]+src="founder-editorial-story-v1\.0\.js(?:\?[^\"]*)?"[^>]*></script>\s*','\n',s,count=1)
          route='<script src="founder-route-v1.1.js?v=fnd11" defer data-p120-founder-route="v1.1"></script>'
          if route not in s:
              if '</body>' not in s: raise SystemExit('Missing </body>')
              s=s.replace('</body>',f'  {route}\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Dedicated-page static and privacy gate
        shell: bash
        run: |
          set -euo pipefail
          python qa/check_founder_separate_page.py
          node --check founder-route-v1.1.js
          node --check founder-editorial-story-v1.0.js
          if [ -f qa/check_build.py ]; then python qa/check_build.py; fi

      - name: Commit controlled integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'P-120 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html founder-route-v1.1.js founder-editorial-story-v1.0.css founder-editorial-story-v1.0.js creator/index.html qa/check_founder_separate_page.py .github/workflows/apply-founder-editorial-story-v1.yml
          git commit -m 'fix: reconcile Founder dedicated-page CTAs'
          git push
