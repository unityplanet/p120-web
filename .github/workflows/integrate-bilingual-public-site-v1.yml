name: Integrate bilingual public site v1.6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-bilingual-public-site-v1.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main before build
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Externalize embedded PDF payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, hashlib
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def h(x): return hashlib.sha256(x.encode()).hexdigest()
          def cut(x,a,b): return x[x.index(a):x.index(b,x.index(a))]
          instrument_before=h(cut(s,'window.P120_INSTRUMENT =','window.P120_SCIENCE='))
          assessment_before=h(cut(s,'function renderPreflight(){','function render(){'))
          mobile_before=h(cut(s,'function renderMobileBottomNav(){','function renderMobileDrawer(){'))
          matches=list(re.finditer(r'data:application/pdf;base64,([^"\']+)',s))
          if matches:
            assert len(matches)==3, f'Expected 3 embedded PDFs, found {len(matches)}'
            names=['assets/p120-scientific-concept-paper-v1.1.pdf','assets/p120-simple-v2.2.pdf','assets/p120-social-v3.2.pdf']
            Path('assets').mkdir(exist_ok=True)
            replacements=[]
            for m,name in zip(matches,names):
              raw=base64.b64decode(m.group(1),validate=True)
              assert raw.startswith(b'%PDF-'), f'{name} is not a PDF'
              Path(name).write_bytes(raw)
              replacements.append((m.start(),m.end(),name))
              print('externalized',name,len(raw),'bytes')
            for start,end,name in reversed(replacements): s=s[:start]+name+s[end:]
            p.write_text(s,encoding='utf-8')
          else: print('No embedded PDF payloads found; already externalized.')
          s2=p.read_text(encoding='utf-8')
          assert not re.search(r'data:application/pdf;base64,',s2)
          assert h(cut(s2,'window.P120_INSTRUMENT =','window.P120_SCIENCE='))==instrument_before
          assert h(cut(s2,'function renderPreflight(){','function render(){'))==assessment_before
          assert h(cut(s2,'function renderMobileBottomNav(){','function renderMobileDrawer(){'))==mobile_before
          print('HTML bytes after PDF externalization:',len(s2.encode()))
          PY
      - name: Build RU root and EN public copy with optimized bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('index.html'); ru=p.read_text(encoding='utf-8')
          def h(s): return hashlib.sha256(s.encode()).hexdigest()
          def cut(s,a,b): return s[s.index(a):s.index(b,s.index(a))]
          instrument=h(cut(ru,'window.P120_INSTRUMENT =','window.P120_SCIENCE='))
          assessment=h(cut(ru,'function renderPreflight(){','function render(){'))
          mobile=h(cut(ru,'function renderMobileBottomNav(){','function renderMobileDrawer(){'))

          markers=['data-p120-language-switch="v1.0"','data-p120-depth-statement="v1.1"','data-p120-depth-statement="v1.2"','data-p120-ivory-contrast="v1.7.1j"']
          for marker in markers:
            ru=re.sub(r'\s*<link[^>]+'+re.escape(marker)+r'[^>]*>\s*','\n',ru,flags=re.I)
            ru=re.sub(r'\s*<script[^>]+'+re.escape(marker)+r'[^>]*></script>\s*','\n',ru,flags=re.I)

          # One reduced font family request, loaded without blocking first paint.
          font_url='https://fonts.bunny.net/css?family=inter:400,500,600,700,800|noto-serif:400,500,600,700|noto-serif-display:500,600,700&display=swap'
          ru=re.sub(r'<link\s+href=["\']https://fonts\.bunny\.net/css\?family=[^"\']+["\']\s+rel=["\']stylesheet["\']\s*/?>',
            f'<link rel="preload" as="style" href="{font_url}" onload="this.onload=null;this.rel=\'stylesheet\'" />\n  <noscript><link rel="stylesheet" href="{font_url}" /></noscript>',ru,flags=re.I)
          # If already optimized from a previous build, normalize URL and retain nonblocking form.
          ru=re.sub(r'<link\s+rel=["\']preload["\']\s+as=["\']style["\']\s+href=["\']https://fonts\.bunny\.net/css\?family=[^"\']+["\'][^>]*>',
            f'<link rel="preload" as="style" href="{font_url}" onload="this.onload=null;this.rel=\'stylesheet\'" />',ru,flags=re.I)

          css_sources=[
            'visual-fix-v1.7.1b.css','visual-fix-v1.7.1c.css','visual-fix-v1.7.1d.css','visual-fix-v1.7.1f.css','visual-fix-v1.7.1g.css','visual-fix-v1.7.1h.css',
            'extended-research-set-v1.0.css','extended-research-navigation-v1.0.css','visual-fix-v1.7.1i.css','chapter-navigation-v1.0.css','language-switch-v1.0.css','depth-statement-v1.2.css','visual-fix-v1.7.1j.css'
          ]
          js_sources=['extended-research-navigation-v1.0.js','chapter-navigation-v1.0.js','language-switch-v1.0.js','depth-statement-v1.2.js']
          for f in css_sources+js_sources: assert Path(f).exists(), f'Missing bundle source: {f}'
          css_bundle='/* P-120 production public styles v1.0 — generated, source order preserved */\n'+''.join(f'\n/* === {f} === */\n'+Path(f).read_text(encoding='utf-8')+'\n' for f in css_sources)
          js_bundle='/* P-120 production public runtime v1.0 — generated, source order preserved */\n'+''.join(f'\n/* === {f} === */\n'+Path(f).read_text(encoding='utf-8')+'\n' for f in js_sources)
          Path('p120-public-styles-v1.0.css').write_text(css_bundle,encoding='utf-8')
          Path('p120-public-runtime-v1.0.js').write_text(js_bundle,encoding='utf-8')

          # Remove individual presentation links/scripts. Original source files remain in repository.
          for f in css_sources:
            ru=re.sub(r'\s*<link[^>]+href=["\']'+re.escape(f)+r'(?:\?[^"\']*)?["\'][^>]*>\s*','\n',ru,flags=re.I)
          for f in js_sources:
            ru=re.sub(r'\s*<script[^>]+src=["\']'+re.escape(f)+r'(?:\?[^"\']*)?["\'][^>]*></script>\s*','\n',ru,flags=re.I)
          ru=ru.replace('</head>','  <link rel="stylesheet" href="p120-public-styles-v1.0.css?v=pub16" data-p120-production-bundle="styles-v1.0" />\n</head>',1)
          ru=ru.replace('</body>','<script src="p120-public-runtime-v1.0.js?v=pub16" data-p120-production-bundle="runtime-v1.0"></script>\n</body>',1)

          assert h(cut(ru,'window.P120_INSTRUMENT =','window.P120_SCIENCE='))==instrument
          assert h(cut(ru,'function renderPreflight(){','function render(){'))==assessment
          assert h(cut(ru,'function renderMobileBottomNav(){','function renderMobileDrawer(){'))==mobile
          p.write_text(ru,encoding='utf-8')

          en=ru
          en=re.sub(r'<html([^>]*?)lang=["\']ru["\']',r'<html\1lang="en"',en,count=1,flags=re.I)
          asset_re=re.compile(r'(?P<a>\b(?:href|src)=["\'])(?P<p>(?!https?:|//|/|#|data:|mailto:|tel:|\.\./)[^"\']+\.(?:css|js|svg|webmanifest|png|jpe?g|webp|pdf)(?:\?[^"\']*)?)(?P<q>["\'])',re.I)
          en=asset_re.sub(lambda m:m.group('a')+'../'+m.group('p')+m.group('q'),en)
          en=re.sub(r'("pdf"\s*:\s*")assets/',r'\1../assets/',en)
          en=re.sub(r'<title>.*?</title>','<title>P-120 — architecture of attraction and intimacy</title>',en,count=1,flags=re.S|re.I)
          en=re.sub(r'<meta name="description" content="[^"]*"\s*/?>','<meta name="description" content="P-120 is a multilayer research architecture exploring attraction, intimacy, bodily response, touch, attachment regulation and desire durability. Research Candidate · 18+." />',en,count=1,flags=re.I)
          en=re.sub(r'<meta property="og:title" content="[^"]*"\s*/?>','<meta property="og:title" content="P-120 — architecture of attraction and intimacy" />',en,count=1,flags=re.I)
          en=re.sub(r'<meta property="og:description" content="[^"]*"\s*/?>','<meta property="og:description" content="A multilayer research system for attraction, intimacy, bodily response and desire durability." />',en,count=1,flags=re.I)
          en=re.sub(r'<meta name="twitter:title" content="[^"]*"\s*/?>','<meta name="twitter:title" content="P-120 — architecture of attraction and intimacy" />',en,count=1,flags=re.I)
          en=re.sub(r'<meta name="twitter:description" content="[^"]*"\s*/?>','<meta name="twitter:description" content="Research Candidate · 18+ · multilayer research architecture." />',en,count=1,flags=re.I)
          en=en.replace('</head>','  <link rel="alternate" hreflang="ru" href="../" />\n  <link rel="alternate" hreflang="en" href="./" />\n</head>',1)
          scripts=(
            '<script src="../public-en-home-dictionary-v1.0.js?v=en10"></script>\n'
            '<script src="../public-en-science-dictionary-v1.0.js?v=en10"></script>\n'
            '<script src="../public-en-localization-patch-v1.1.js?v=en12"></script>\n'
            '<script src="../public-en-runtime-v1.0.js?v=en13"></script>'
          )
          en=en.replace('</body>',scripts+'\n</body>',1)
          assert '<base ' not in en.lower()
          assert 'href="#science-' in en or "href='#science-" in en
          assert '"pdf":"../assets/' in en or '"pdf": "../assets/' in en
          assert h(cut(en,'window.P120_INSTRUMENT =','window.P120_SCIENCE='))==instrument
          assert h(cut(en,'function renderPreflight(){','function render(){'))==assessment
          Path('en').mkdir(exist_ok=True)
          Path('en/index.html').write_text(en,encoding='utf-8')
          Path('BILINGUAL_RELEASE_QA.txt').write_text(
            'P-120 Web Editorial — Bilingual Public RU/EN v1.6\nRU: /\nEN: /en/\nEnglish scope: public home, Extended Set, Scientific Base and navigation.\nQuestionnaire: Russian only.\nMeasurement changes: NONE\nScoring changes: NONE\nQuestion wording changes: NONE\nInstrument SHA256: '+instrument+'\nAssessment SHA256: '+assessment+'\nMobile bottom nav SHA256: '+mobile+'\nRU/EN instrument byte-equivalence: PASS\nRU/EN assessment byte-equivalence: PASS\nEmbedded PDF payloads in index.html: NONE\nExternal PDF routing RU/EN: PASS\nPublic CSS production requests: 1 bundle\nPublic presentation JS requests: 1 bundle\nWeb font stylesheet: non-render-blocking preload\nLocalization runtime: debounced v1.1\nFinal depth statement: v1.3 desktop-fit staircase Noto\nIvory frame/contour contrast: v1.7.1j\n',encoding='utf-8')
          print('Bilingual integration v1.6 PASS')
          PY
      - name: Check generated runtime and localization scripts
        run: |
          node --check p120-public-runtime-v1.0.js
          node --check public-en-home-dictionary-v1.0.js
          node --check public-en-science-dictionary-v1.0.js
          node --check public-en-localization-patch-v1.1.js
          node --check public-en-runtime-v1.0.js
      - name: Commit and push safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html BILINGUAL_RELEASE_QA.txt assets/*.pdf p120-public-styles-v1.0.css p120-public-runtime-v1.0.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bundle public assets and optimize first paint v1.6'
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
