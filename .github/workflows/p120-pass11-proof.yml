name: P120 PASS 11 Storage Security Negative Proof

on:
  push:
    paths:
      - '.github/workflows/p120-pass11-proof.yml'

permissions:
  contents: read

jobs:
  pass11-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify private bucket blocks public object URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://hvjgrpssjnnprazwhikn.supabase.co/storage/v1/object/public/p120-reports/reports/ASM-E2E-LIVE-A3/RPK-43AEEE1C3D9D7CBD4D8E/ART-45D158A5CC2409FEB326.pdf'
          CODE="$(curl --silent --show-error --output /tmp/p120_pass11_public_body.txt --write-out '%{http_code}' --max-time 30 "$URL")"
          printf 'PUBLIC_URL_HTTP_STATUS=%s\n' "$CODE"
          cat /tmp/p120_pass11_public_body.txt || true
          test "$CODE" != '200'
          echo 'P120_PASS11_PUBLIC_URL_NEGATIVE_ASSERTION=PASS'
