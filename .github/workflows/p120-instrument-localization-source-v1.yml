name: P-120 Instrument Localization Source v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-instrument-localization-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract canonical RU instrument source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          src = Path('system/index.html').read_text(encoding='utf-8')
          m = re.search(r'window\.P120_INSTRUMENT\s*=\s*(\{.*?\});\s*</script>', src, re.S)
          if not m:
              raise SystemExit('P120_INSTRUMENT not found')
          instrument = json.loads(m.group(1))
          items = instrument.get('items', [])
          if len(items) != 180 or len({x['id'] for x in items}) != 180:
              raise SystemExit(f'Expected 180 unique items, got {len(items)} / {len({x["id"] for x in items})}')
          Path('localization').mkdir(exist_ok=True)
          Path('localization/p120-instrument-ru-source-v1.0.json').write_text(
              json.dumps(instrument, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          lines = ['id\tmodule\ttype\ttext\toptionA\toptionB']
          for x in items:
              clean=lambda v: str(v or '').replace('\t',' ').replace('\n',' ')
              lines.append('\t'.join([
                  clean(x.get('id')), clean(x.get('module')), clean(x.get('type')),
                  clean(x.get('text')), clean(x.get('optionA')), clean(x.get('optionB'))
              ]))
          Path('localization/p120-instrument-ru-items-v1.0.tsv').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          digest=hashlib.sha256(m.group(1).encode('utf-8')).hexdigest()
          Path('localization/P120_INSTRUMENT_LOCALIZATION_SOURCE_v1.0.md').write_text(
              '# P-120 Instrument Localization Source v1.0\n\n'
              '**Status:** EXTRACTED / CANONICAL RU SOURCE\n\n'
              '- Source route: `/system/`\n'
              '- Item count: 180\n'
              '- IDs preserved: 180/180 unique\n'
              f'- Instrument JSON SHA-256: `{digest}`\n'
              '- Purpose: controlled language realization only; no scoring or measurement changes.\n',
              encoding='utf-8')
          print('Localization source extraction: PASS')
          PY

      - name: Commit source package
        shell: bash
        run: |
          if git diff --quiet -- localization; then
            echo 'Localization source already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add localization
            git commit -m 'Extract canonical RU instrument localization source'
            git push
          fi