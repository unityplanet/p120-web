name: P120 Independent Render v1.1 Harness Fix
on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/p120-independent-render-corrections-v1'
    paths:
      - '.github/scripts/p120_independent_render_v11_mobile_harness_fix.py'
      - '.github/workflows/p120-independent-render-v11-harness-fix.yml'
permissions:
  contents: write
jobs:
  patch-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p120-independent-render-corrections-v1
      - name: Patch mobile transition harness
        run: python3 .github/scripts/p120_independent_render_v11_mobile_harness_fix.py
      - name: Verify QA-only diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "qa/independent_render_audit_v1_1.mjs"
      - name: Commit harness correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/independent_render_audit_v1_1.mjs
          git commit -m 'Make mobile render audit drawer-aware'
          git push origin HEAD:fix/p120-independent-render-corrections-v1
