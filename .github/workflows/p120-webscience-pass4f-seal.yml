name: P120 WEB-SCIENCE PASS 4F Closure Reconciliation Seal

on:
  push:
    branches:
      - 'web-science-ext-pass4f-closure-reconciliation'
    paths:
      - '.github/workflows/p120-webscience-pass4f-seal.yml'
      - '.github/scripts/p120_webscience_pass4f_closure.py'
      - 'qa/webscience_pass4f_closure_reconciliation_gate_v1.0.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-pass4f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final PASS 4E authority is protected
        shell: bash
        run: |
          set -euo pipefail
          BASE='cd71bf494f72090e0a81cfd3702fd6049ab89bb0'
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --quiet "$BASE" HEAD -- \
            science/index.html en/science/index.html \
            p120-scientific-base-runtime-v1.0.js \
            p120-webscience-pass4b-renderer-v0.6.js \
            p120-webscience-pass4c-library-v0.7.js \
            p120-webscience-pass4e-visual-v0.9.css \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json \
            webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json \
            P120_WEBSCI_PRODUCTION_registry_v1.0_2026-09-02.json \
            p120-session-contract-v1.0.js p120-submission-intake-v1.0.js manual-report-handoff-v1.0.js
          echo 'PASS 4E protected authority: PASS'

      - name: Verify PASS 4F scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/webscience_pass4f_closure_reconciliation_gate_v1.0.py
          python3 -m py_compile .github/scripts/p120_webscience_pass4f_closure.py
          git diff --check

      - name: Re-run PASS 4A publication projection gate
        run: node qa/webscience_pass4a_projection_gate_v0.5.mjs

      - name: Re-materialize Global-70 reproducibility
        shell: bash
        run: |
          set -euo pipefail
          node qa/webscience_pass4c_materialize_global_library_v0.7.mjs
          git diff --exit-code -- webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json

      - name: Re-run PASS 4D static claim-boundary parity gate
        run: node qa/webscience_pass4d_claim_boundary_static_gate_v0.8.mjs

      - name: Run PASS 4F closure reconciliation gate
        run: python3 qa/webscience_pass4f_closure_reconciliation_gate_v1.0.py

      - name: Persist PASS 4F reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_EVIDENCE
          path: qa-evidence-webscience-pass4f/
          if-no-files-found: warn

      - name: Build controlled PASS 4F closure records
        run: python3 .github/scripts/p120_webscience_pass4f_closure.py

      - name: Verify closure records and manifest hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          w=Path('webscience/pass4')
          q=json.loads((w/'P120_WEBSCI_EXT_PASS4_PASS4F_QA_SUMMARY_v1.0.json').read_text())
          m=json.loads((w/'P120_WEBSCI_EXT_PASS4_PASS4F_MANIFEST_v1.0.json').read_text())
          assert q['status']=='PASS' and q['reconciliation_checks_failed']==0
          assert m['status']=='PASS4F_CLOSED_CONTROLLED'
          assert m['parent_pass4_status']=='OPEN_PENDING_PASS4G'
          assert m['unresolved_delta_count']==0
          for x in m['files']:
              actual=hashlib.sha256(Path(x['path']).read_bytes()).hexdigest()
              assert actual==x['sha256'], (x['path'],actual,x['sha256'])
          print('PASS 4F closure records: PASS')
          PY

      - name: Commit controlled PASS 4F closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P120 Research System'
          git config user.email '57597994+unityplanet@users.noreply.github.com'
          git add webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_* webscience/pass4/README.md
          git commit -m 'WEB-SCIENCE PASS 4F: close authority-chain reconciliation'
          git push origin HEAD:web-science-ext-pass4f-closure-reconciliation

      - name: Build sealed PASS 4F reconciliation package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_PACKAGE'
          mkdir -p "$ROOT/RELEASE_CONTROL" "$ROOT/RECONCILIATION" "$ROOT/UPSTREAM_AUTHORITY" "$ROOT/SOURCE_AUTHORITY" "$ROOT/QA"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_REPORT_v1.0.md "$ROOT/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_DECISION_v1.0.md "$ROOT/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_AUTHORITY_CHAIN_v1.0.json "$ROOT/RECONCILIATION/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_RECONCILIATION_MATRIX_v1.0.json "$ROOT/RECONCILIATION/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_DELTA_LEDGER_v1.0.json "$ROOT/RECONCILIATION/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_RECONCILIATION_QA_RESULT_v1.0.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_QA_SUMMARY_v1.0.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_MANIFEST_v1.0.json "$ROOT/RELEASE_CONTROL/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4F_SHA256SUMS_v1.0.txt "$ROOT/RELEASE_CONTROL/"
          cp qa/webscience_pass4f_closure_reconciliation_gate_v1.0.py "$ROOT/QA/"
          cp .github/scripts/p120_webscience_pass4f_closure.py "$ROOT/QA/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_MANIFEST_v0.5.json webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_SUMMARY_v0.5.json "$ROOT/UPSTREAM_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4B_MANIFEST_v0.6.json webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4B_QA_SUMMARY_v0.6.json "$ROOT/UPSTREAM_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4C_MANIFEST_v0.7.json webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4C_QA_SUMMARY_v0.7.json "$ROOT/UPSTREAM_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_MANIFEST_v0.8.json webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4D_QA_SUMMARY_v0.8.json "$ROOT/UPSTREAM_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4E_MANIFEST_v0.9.json webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4E_QA_SUMMARY_v0.9.json "$ROOT/UPSTREAM_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_integrated_v0.7.json "$ROOT/SOURCE_AUTHORITY/"
          cp webscience/pass4/README.md "$ROOT/PASS4_WORKSTREAM_README.md"
          printf '%s\n' \
            'Repository: unityplanet/p120-web' \
            'Branch: web-science-ext-pass4f-closure-reconciliation' \
            'PASS 4E baseline authority: cd71bf494f72090e0a81cfd3702fd6049ab89bb0' \
            "PASS 4F closure commit: $(git rev-parse HEAD)" \
            'Parent PASS 4 status: OPEN_PENDING_PASS4G' \
            'Production merge: NOT PERFORMED' \
            'Next gate: PASS 4G — Mandatory Full PASS Package / Final PASS 4 Sealing' \
            > "$ROOT/RELEASE_CONTROL/REPOSITORY_PROVENANCE.txt"
          (cd "$ROOT" && find . -type f ! -path './RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt)
          (cd "$ROOT" && sha256sum -c RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt)
          zip -qr "${ROOT}.zip" "$ROOT"
          sha256sum "${ROOT}.zip" > "${ROOT}.zip.sha256"

      - name: Independent post-build package verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT='P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_PACKAGE'
          unzip -t "${ROOT}.zip" >/dev/null
          EXPECTED=$(cut -d' ' -f1 "${ROOT}.zip.sha256")
          ACTUAL=$(sha256sum "${ROOT}.zip" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          TMP=$(mktemp -d)
          unzip -q "${ROOT}.zip" -d "$TMP"
          (cd "$TMP/$ROOT" && sha256sum -c RELEASE_CONTROL/PACKAGE_CONTENT_SHA256SUMS.txt >/dev/null)
          python3 - "$TMP/$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          q=json.loads((root/'RELEASE_CONTROL/P120_WEBSCI_EXT_PASS4_PASS4F_QA_SUMMARY_v1.0.json').read_text())
          m=json.loads((root/'RELEASE_CONTROL/P120_WEBSCI_EXT_PASS4_PASS4F_MANIFEST_v1.0.json').read_text())
          assert q['status']=='PASS' and q['reconciliation_checks_failed']==0
          assert m['status']=='PASS4F_CLOSED_CONTROLLED' and m['unresolved_delta_count']==0
          assert m['parent_pass4_status']=='OPEN_PENDING_PASS4G'
          print('PASS 4F post-build package verification: PASS')
          PY

      - name: Upload PASS 4F sealed reconciliation package
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_PACKAGE
          path: |
            P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_PACKAGE.zip
            P120_WEBSCI_EXT_PASS4F_v1.0_RECONCILIATION_PACKAGE.zip.sha256
          if-no-files-found: error
