name: Unpack P-120 hosting package

on:
  push:
    paths:
      - 'P120_Web_Editorial_v1.5_HOSTING_PACKAGE*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify hosting package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'P120_Web_Editorial_v1.5_HOSTING_PACKAGE*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No matching ZIP remains in the repository; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unpack package into web root
        if: steps.package.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.package.outputs.zip }}"
          rm -rf .p120-unpack
          mkdir .p120-unpack
          unzip -q "$ZIP" -d .p120-unpack
          SRC="$(find .p120-unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          test -f "$SRC/index.html"
          ACTUAL_SHA="$(sha256sum "$SRC/index.html" | awk '{print $1}')"
          EXPECTED_SHA="c36abe1816b791f7c946d0f2b080daed6899fe78f957ef01b72df5f8c420c67c"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "index.html SHA-256 mismatch: $ACTUAL_SHA" >&2
            exit 1
          fi
          cp -a "$SRC"/. ./
          rm -rf .p120-unpack
          git rm -- "$ZIP"

      - name: Commit P-120 Web Editorial v1.5
        if: steps.package.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy P-120 Web Editorial v1.5"
          git push
