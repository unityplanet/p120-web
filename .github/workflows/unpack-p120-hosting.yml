name: P-120 v1.6.1 release intake

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '*.ZIP'

permissions:
  contents: write

jobs:
  release-v161:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and verify exact v1.6.1 package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='5eea415384e0a05077e634d95bfffca4552d77314613caef2ca624a01e2e4880'
          MATCH=''
          for z in ./*.zip ./*.ZIP; do
            [ -f "$z" ] || continue
            SHA="$(sha256sum "$z" | awk '{print $1}')"
            if [ "$SHA" = "$EXPECTED" ]; then
              MATCH="$z"
              break
            fi
          done
          if [ -z "$MATCH" ]; then
            echo 'Exact v1.6.1 package is not present; nothing to deploy.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$MATCH" /tmp/P120_Web_Editorial_v1.6.1_HOSTING_PACKAGE.zip
          echo "zip=$MATCH" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"

      - name: Deploy v1.6.1 over v1.6.0
        if: steps.package.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf /tmp/p120-v161
          mkdir -p /tmp/p120-v161
          unzip -q /tmp/P120_Web_Editorial_v1.6.1_HOSTING_PACKAGE.zip -d /tmp/p120-v161

          INDEX="$(find /tmp/p120-v161 -type f -name index.html | head -n 1)"
          test -n "$INDEX" || { echo 'index.html not found in v1.6.1 package' >&2; exit 1; }
          SRC="$(dirname "$INDEX")"

          # Preserve this release-intake workflow. Optional CI workflows from the
          # source ZIP remain preserved in the immutable Release asset but are
          # not written into the Pages tree because GITHUB_TOKEN lacks workflow scope.
          rsync -a --exclude='.github/workflows/' "$SRC"/ ./

          # Keep the exact source package out of the live branch; it will be
          # attached to the immutable GitHub Release instead.
          git rm -- "${{ steps.package.outputs.zip }}"

          cat > README.md <<'EOF'
          # P-120 Web

          Public website repository for the P-120 research project.

          ## Current public release

          **P-120 Web Editorial v1.6.1 — Contrast Architecture Restoration**

          GitHub Pages staging URL: `https://unityplanet.github.io/p120-web/`

          v1.6.1 is a narrow corrective pass over v1.6.0. It restores stronger contrast architecture for semantic/scientific blocks while preserving the v1.6 HD/UHD stage system, mobile UX, typography, header and frozen measurement/scoring logic.

          Historical release tags: `v1.5.0`, `v1.6.0`, `v1.6.1`.

          ## Deployment

          GitHub Pages publishes from the `main` branch and repository root. The live staging website is represented by the current state of `main`.

          ## Public-repository boundary

          This repository contains public website code and public-facing assets only. Do not commit authoritative scoring keys, technical keys, controlled research documentation, respondent or personal data, credentials, API keys, `.env` files, or other non-public P-120 materials.

          Measurement changes in v1.6.1: **NONE**. Scoring changes: **NONE**.
          EOF

          cat > VERSION.txt <<'EOF'
          P-120 Web Editorial v1.6.1
          Contrast Architecture Restoration
          Baseline: v1.6.0 Desktop HD / UHD Master Pass
          Status: hosting-ready frontend corrective release / live correction stage
          Measurement changes: NONE
          Scoring changes: NONE
          EOF

          cat > CHANGELOG.md <<'EOF'
          # P-120 Web — Changelog

          ## [1.6.1] — 2026-08-31

          ### Contrast Architecture Restoration
          - Restored more visible contrast frames for semantic and scientific blocks.
          - Re-established `two systems`, distinction cards, orbital map and module/layer blocks as distinct architectural objects.
          - Clarified the questionnaire outer contour.
          - Preserved scientific de-cardification while restoring separation from the background.
          - Increased depth in report/examples surfaces.
          - Strengthened editorial dividing lines and chapter flash rules.
          - Added theme-specific frame tokens for Ivory, Graphite and Museum.
          - Museum framing uses teal/grey-green accents aligned with its cream/teal/sand palette.
          - Slightly strengthened frame/depth treatment at ≥1920px for large canvases.

          ### Preserved from v1.6.0
          - HD/UHD stage system unchanged.
          - 1366 / 1440 / 1920 / 2560 / 3440 / 3840 regimes preserved.
          - Mobile UX v1.2–v1.5 preserved.
          - Typography and header preserved.
          - Measurement/content/scoring logic unchanged.

          Full corrective release notes: `CHANGELOG_v1.6.1.md`.

          ### QA reported by release package
          - 7 JavaScript blocks byte-identical to v1.6.
          - JavaScript syntax: PASS.
          - CSS parser errors: 0.
          - Static build checker: PASS.
          - Source ZIP SHA-256: `5eea415384e0a05077e634d95bfffca4552d77314613caef2ca624a01e2e4880`.

          ## [1.6.0] — 2026-08-31

          ### Visual / layout
          - Desktop HD / UHD Master Pass over the v1.5 Unified Editorial Grammar baseline.
          - Dedicated HD, QHD, ultrawide and UHD stage systems.
          - Expanded questionnaire, science and report layouts for large displays.
          - Selective de-cardification and production-facing identity cleanup.

          ### Measurement governance
          - Measurement changes: NONE.
          - Scoring changes: NONE.
          - New thresholds: NONE.
          - Global total: NONE.

          ## [1.5.0] — 2026-08-31

          ### Release
          - P-120 Web Editorial v1.5 — Unified Editorial Grammar.
          - Updated editorial/block design baseline supplied as the final v1.5 autonomous HTML build.
          - Direct baseline for v1.6.

          ### Measurement governance
          - Measurement changes: NONE.
          - Scoring changes: NONE.
          EOF

          git add -A
          git commit -m 'Release P-120 Web Editorial v1.6.1 — Contrast Architecture Restoration'
          git tag -a v1.6.1 -m 'P-120 Web Editorial v1.6.1 — Contrast Architecture Restoration'

      - name: Publish v1.6.1 commit and tag
        if: steps.package.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          git push origin v1.6.1

      - name: Create v1.6.1 GitHub Release
        if: steps.package.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v161-notes.md <<'EOF'
          P-120 Web Editorial v1.6.1 — Contrast Architecture Restoration.

          Narrow corrective pass over v1.6.0 restoring stronger contrast architecture for semantic/scientific blocks while preserving the HD/UHD stage system, mobile UX, typography, header and frozen measurement/scoring logic.

          Package QA: 7 JavaScript blocks byte-identical to v1.6; JS syntax PASS; CSS parser errors 0; static build checker PASS.

          Measurement changes: NONE. Scoring changes: NONE.
          EOF
          gh release view v1.6.1 >/dev/null 2>&1 || gh release create v1.6.1 /tmp/P120_Web_Editorial_v1.6.1_HOSTING_PACKAGE.zip --title 'P-120 Web Editorial v1.6.1 — Contrast Architecture Restoration' --notes-file /tmp/v161-notes.md
