name: Apply P-120 Chapter Navigation v1.0

on:
  push:
    branches: [main]
    paths:
      - 'chapter-navigation-v1.0.css'
      - 'chapter-navigation-v1.0.js'
      - 'CHAPTER_NAVIGATION_v1.0.md'
      - '.github/workflows/apply-chapter-navigation-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: P120_Web_Editorial_CHAPTER_NAVIGATION_v1.0_FULL_HOSTING_PACKAGE

jobs:
  integrate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate chapter navigation into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.find('function renderMobileBottomNav(){')
          end = text.find('function renderMobileDrawer(){', start)
          if start < 0 or end < 0:
              raise SystemExit('Cannot locate mobile bottom navigation source')
          bottom_before = hashlib.sha256(text[start:end].encode()).hexdigest()

          text = re.sub(r'\s*<link[^>]+data-p120-chapter-navigation="v1\.0"[^>]*>\s*', '\n', text, flags=re.I)
          text = re.sub(r'\s*<script[^>]+data-p120-chapter-navigation="v1\.0"[^>]*></script>\s*', '\n', text, flags=re.I)

          css = '<link rel="stylesheet" href="chapter-navigation-v1.0.css?v=chapter10" data-p120-chapter-navigation="v1.0" />'
          js = '<script src="chapter-navigation-v1.0.js?v=chapter10" data-p120-chapter-navigation="v1.0"></script>'

          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('Missing HTML closing markers')
          text = text.replace('</head>', '  ' + css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)

          start2 = text.find('function renderMobileBottomNav(){')
          end2 = text.find('function renderMobileDrawer(){', start2)
          bottom_after = hashlib.sha256(text[start2:end2].encode()).hexdigest()

          checks = {
              'chapter-css-once': text.count('chapter-navigation-v1.0.css') == 1,
              'chapter-js-once': text.count('chapter-navigation-v1.0.js') == 1,
              'extended-nav-preserved': 'extended-research-navigation-v1.0.js' in text,
              'graphite-pass-preserved': 'visual-fix-v1.7.1i.css' in text,
              'bottom-navigation-byte-equivalent': bottom_before == bottom_after,
              'no-extended-total': 'P120_TOTAL_EXTENDED' not in text,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Integration assertions failed: ' + ', '.join(failed))

          path.write_text(text, encoding='utf-8')
          print('Chapter Navigation integration: PASS')
          print('Mobile bottom navigation SHA256:', bottom_after)
          print('index SHA256:', hashlib.sha256(text.encode()).hexdigest())
          PY

      - name: JavaScript syntax checks
        run: |
          node --check chapter-navigation-v1.0.js
          node --check extended-research-navigation-v1.0.js

      - name: Commit integrated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already contains Chapter Navigation v1.0.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Integrate Chapter Navigation v1.0'
            git push
          fi

      - name: Build full hosting archive
        shell: bash
        run: |
          rm -rf _chapter_nav_hosting
          mkdir -p _chapter_nav_hosting
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess, hashlib

          root = Path('.')
          out = Path('_chapter_nav_hosting')
          skip_dirs = {'.git','.github','_chapter_nav_hosting'}

          for p in root.iterdir():
              if p.name in skip_dirs or p.suffix.lower() == '.zip':
                  continue
              dest = out / p.name
              if p.is_dir():
                  if not p.name.startswith('_'):
                      shutil.copytree(p, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(p, dest)

          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          (out/'ARCHIVE_RELEASE.txt').write_text(
              'P-120 Web Editorial — Chapter Navigation v1.0\n'
              f'Git commit: {commit}\n'
              'Scope: full hosting archive; presentation/navigation additive pass.\n'
              'Measurement changes: NONE\nScoring changes: NONE\nQuestionnaire changes: NONE\n'
              'Mobile bottom navigation: UNCHANGED\n',
              encoding='utf-8'
          )

          required = [
              'index.html','chapter-navigation-v1.0.css','chapter-navigation-v1.0.js',
              'extended-research-set-v1.0.css','extended-research-navigation-v1.0.js',
              'visual-fix-v1.7.1i.css','CHAPTER_NAVIGATION_v1.0.md'
          ]
          missing = [x for x in required if not (out/x).exists()]
          if missing:
              raise SystemExit('Missing package files: ' + ', '.join(missing))
          PY

          cd _chapter_nav_hosting
          zip -qr "../${PACKAGE_NAME}.zip" .
          cd ..
          unzip -t "${PACKAGE_NAME}.zip"
          sha256sum "${PACKAGE_NAME}.zip" > CHAPTER_NAVIGATION_PACKAGE_SHA256.txt

      - name: Upload full hosting archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            CHAPTER_NAVIGATION_PACKAGE_SHA256.txt
          retention-days: 30
