name: P120 Reference Renderer Source Deploy

on:
  push:
    paths:
      - '.github/workflows/p120-reference-renderer-source-deploy.yml'

permissions:
  contents: write

jobs:
  deploy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize controlled reference renderer source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p120_reference_renderer_source.b64 <<'B64'

B64
          base64 -d /tmp/p120_reference_renderer_source.b64 > /tmp/p120_reference_renderer_source.tgz
          echo '3d89343b30f002fcdeecc98c8894208b61b409dfe9bc3b727b195e9c17d4db1a  /tmp/p120_reference_renderer_source.tgz' | sha256sum -c -
          git pull --rebase origin main
          rm -rf reference_renderer
          mkdir -p reference_renderer
          tar -xzf /tmp/p120_reference_renderer_source.tgz -C reference_renderer
          rm -f .github/workflows/p120-reference-renderer-introspect.yml
          rm -f .github/workflows/p120-reference-renderer-source-deploy.yml
          git config user.name 'P120 Controlled Automation'
          git config user.email 'p120-controlled@users.noreply.github.com'
          git add reference_renderer .github/workflows/p120-reference-renderer-introspect.yml .github/workflows/p120-reference-renderer-source-deploy.yml
          git diff --cached --check
          git commit -m 'P120 report: add controlled reference PDF renderer v1.0'
          git push origin HEAD:main
