name: Apply Founder Prata Secondary Serif

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-founder-prata-secondary-serif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach controlled Prata layer to shared Founder stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('founder-editorial-story-v1.0.css')
          s=p.read_text(encoding='utf-8')
          line='@import url("./founder-secondary-serif-v1.0.css?v=fndss10");\n\n'
          if 'founder-secondary-serif-v1.0.css' not in s:
              p.write_text(line+s,encoding='utf-8')
          PY
      - name: Commit production typography role
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add founder-editorial-story-v1.0.css
          git commit -m 'style: activate Prata secondary serif on Founder pages'
          git push
