name: Apply P-120 v1.7.1d manifesto art pass

on:
  push:
    branches:
      - main
    paths:
      - visual-fix-v1.7.1d.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-manifesto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch why-important renderer and stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Link the final visual layer after previous corrective layers.
          tag = '<link rel="stylesheet" href="visual-fix-v1.7.1d.css?v=171d" data-p120-visual-fix="v1.7.1d" />'
          link_re = re.compile(r'\s*<link[^>]+data-p120-visual-fix="v1\.7\.1d"[^>]*>\s*', re.I)
          if link_re.search(text):
              text = link_re.sub('\n  ' + tag + '\n', text, count=1)
          else:
              if '</head>' not in text:
                  raise SystemExit('index.html has no </head>')
              text = text.replace('</head>', '  ' + tag + '\n</head>', 1)

          # 2) Add a dedicated renderer for section 01 using the existing copy verbatim.
          helper = r'''function renderWhyImportantManifesto(section){
  const b=section.body;
  return `<div class="editorial-body why-important-manifesto"><div class="manifesto-stage"><p class="manifesto-lead">${esc(b[0])}</p><div class="manifesto-lines">${b.slice(1,7).map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="manifesto-closing"><div class="manifesto-closing-copy">${b.slice(7,9).map(x=>`<p>${esc(x)}</p>`).join('')}</div><p class="manifesto-final">${esc(b[9])}</p></div></div></div>`;
}
'''
          if 'function renderWhyImportantManifesto(section)' not in text:
              marker = 'function renderEditorialBody(section){'
              if marker not in text:
                  raise SystemExit('renderEditorialBody marker not found')
              text = text.replace(marker, helper + marker, 1)

          # 3) Route only why-important through the new renderer.
          body_marker = "function renderEditorialBody(section){\n  const b=section.body;"
          route = "function renderEditorialBody(section){\n  const b=section.body;\n  if(section.id==='why-important') return renderWhyImportantManifesto(section);"
          if "if(section.id==='why-important') return renderWhyImportantManifesto(section);" not in text:
              if body_marker not in text:
                  raise SystemExit('renderEditorialBody body marker not found')
              text = text.replace(body_marker, route, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Static guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'visual-fix-v1.7.1d.css?v=171d',
              'function renderWhyImportantManifesto(section)',
              "if(section.id==='why-important') return renderWhyImportantManifesto(section);",
              'manifesto-lead',
              'manifesto-lines',
              'manifesto-final'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing v1.7.1d markers: ' + ', '.join(missing))
          # Guard the exact existing copy remained present.
          copy_guard = [
              'Сексуальность начинается намного раньше секса.',
              'С того, кого мы замечаем.',
              'Как на нас действует красота.',
              'Как тело отвечает на взгляд, движение, голос или прикосновение.',
              'Как близко мы готовы подпустить другого человека.',
              'Что происходит с нашим желанием, когда отношения становятся знакомыми.',
              'Почему с одним человеком хочется приблизиться, а рядом с другим — сохранить пространство.',
              'Многие из этих процессов происходят почти автоматически.',
              'Мы чувствуем их — но редко можем точно назвать.',
              'P-120 создан, чтобы сделать эту внутреннюю систему видимой.'
          ]
          missing_copy = [x for x in copy_guard if x not in text]
          if missing_copy:
              raise SystemExit('Frozen copy guard failed')
          print('v1.7.1d static guard PASS')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "v1.7.1d already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply v1.7.1d manifesto editorial composition"
          git push
