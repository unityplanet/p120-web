name: P120 PASS 4 Post-Science Inventory

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass4'
    paths:
      - '.github/scripts/p120_pass4_post_science_inventory.py'
      - '.github/workflows/p120-pass4-post-science-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p120-runtime-reconciliation-pass4
          fetch-depth: 0

      - name: Verify PASS 4 baseline
        run: |
          test "$(git merge-base HEAD f46b7335e47d75672424136979f91a1a3997aa37)" = "f46b7335e47d75672424136979f91a1a3997aa37"
          echo 'PASS 4 baseline ancestry: PASS'

      - name: Run deterministic post-Science inventory
        run: python3 .github/scripts/p120_pass4_post_science_inventory.py

      - name: Verify inventory did not mutate production runtime
        run: |
          changed="$(git status --porcelain --untracked-files=no | grep -v 'P120_PASS4_POST_SCIENCE_INVENTORY_v1.0' || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo 'Unexpected runtime mutation during inventory.' >&2
            exit 1
          fi
          echo 'Inventory mutation boundary: PASS'

      - name: Commit controlled inventory record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add P120_PASS4_POST_SCIENCE_INVENTORY_v1.0.json P120_PASS4_POST_SCIENCE_INVENTORY_v1.0.md
          if git diff --cached --quiet; then
            echo 'Inventory record already current.'
          else
            git commit -m 'Record PASS 4 post-Science cleanup inventory'
            git push
          fi
