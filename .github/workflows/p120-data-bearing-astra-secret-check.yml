name: P120 Data-Bearing Astra Secret Check
on:
  push:
    branches:
      - 'p120/pass1-synthetic-e2e'
    paths:
      - '.github/workflows/p120-data-bearing-astra-secret-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Astra/OpenAI credential availability without disclosure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          P120_OPENAI_API_KEY: ${{ secrets.P120_OPENAI_API_KEY }}
          ASTRA_API_KEY: ${{ secrets.ASTRA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          check() { if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          check OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          check P120_OPENAI_API_KEY "${P120_OPENAI_API_KEY:-}"
          check ASTRA_API_KEY "${ASTRA_API_KEY:-}"
