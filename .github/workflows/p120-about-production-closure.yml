name: P120 About P-120 Production Closure QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qa/about_production_closure_live.mjs'
      - '.github/workflows/p120-about-production-closure.yml'
      - '.github/workflows/qa-web-explore-pass53.yml'
      - '.github/workflows/qa-main-quick-locale-theme-patch3-pass2.yml'
      - 'qa/main_quick_locale_theme_patch3_pass2_reconciled.mjs'

permissions:
  contents: read
  deployments: read

jobs:
  live-production-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P120_PRODUCTION_BASE: https://unityplanet.github.io/p120-web/
      P120_EXPECTED_PRODUCTION_SHA: aa2d101f8bd0dcb12b033df8643756da8a6f22a1
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub Pages deployment lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/about-production-closure-live
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" \
            > qa-artifacts/about-production-closure-live/deployments.json
          python3 - <<'PY'
          import json, os, sys
          p='qa-artifacts/about-production-closure-live/deployments.json'
          rows=json.load(open(p,encoding='utf-8'))
          expected=os.environ['P120_EXPECTED_PRODUCTION_SHA']
          matching=[r for r in rows if r.get('sha')==expected]
          if not matching:
              print('Expected GitHub Pages deployment SHA not found:',expected,file=sys.stderr)
              print('Observed:',[r.get('sha') for r in rows],file=sys.stderr)
              raise SystemExit(1)
          json.dump({'expected_sha':expected,'matching_deployment_ids':[r.get('id') for r in matching],'verdict':'PASS'},open('qa-artifacts/about-production-closure-live/deployment-lineage.json','w'),indent=2)
          print('PASS: deployment lineage contains', expected)
          PY

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Live RU/EN About production regression
        run: node qa/about_production_closure_live.mjs

      - name: Upload production closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_ABOUT_PRODUCTION_CLOSURE_QA
          path: qa-artifacts/about-production-closure-live/
          retention-days: 30
