name: P120 PASS 4 EN Science Link Probe

on:
  push:
    branches:
      - 'work/p120-runtime-reconciliation-pass4'
    paths:
      - 'qa/pass4_en_science_link_probe.mjs'
      - '.github/workflows/p120-pass4-en-science-link-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - run: |
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/p120-probe.log 2>&1 &
          sleep 2
          node qa/pass4_en_science_link_probe.mjs
