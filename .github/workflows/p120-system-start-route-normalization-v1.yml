name: P120 System Start Route Normalization v1
on:
  push:
    branches:
      - 'fix/p120-system-start-route-normalization-v1'
    paths:
      - '.github/scripts/p120_system_start_route_normalization_v1.py'
      - '.github/workflows/p120-system-start-route-normalization-v1.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p120-system-start-route-normalization-v1
          fetch-depth: 0
      - name: Normalize direct System start route
        run: python3 .github/scripts/p120_system_start_route_normalization_v1.py
      - name: Verify protected scope
        run: |
          git diff -- system/index.html en/system/index.html
          git diff --exit-code -- '*.json' 'localization/*.js' || exit 1
      - name: Commit controlled normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/index.html en/system/index.html
          if git diff --cached --quiet; then
            echo 'Start-route normalization already current.'
            exit 0
          fi
          git commit -m 'Normalize direct RU and EN System start routes'
          git push
