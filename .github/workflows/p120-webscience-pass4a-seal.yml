name: P120 WEB-SCIENCE PASS 4A Seal

on:
  push:
    branches:
      - 'web-science-ext-pass4-publication-projection'
    paths:
      - '.github/workflows/p120-webscience-pass4a-seal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-pass4a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize RU publication surface without changing scientific identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          ladder={x['level']:x for x in d['evidence_ladder']}
          ladder['E1']['meaning']['ru']='Проверки границ конструктов, владения измерительной территорией, избыточности, элементов, информационного прироста, границ применимости и доступности, безопасности, вычислительных контрактов и межмодульной непротиворечивости.'
          ladder['E2']['label']['ru']='Человеческие когнитивные и контрольные наблюдения'
          ladder['E3']['meaning']['ru']='Количественные данные выборок респондентов о надёжности, факторной структуре, дискриминантной и инкрементальной валидности, стабильности, инвариантности и иных явно проверяемых свойствах.'
          ladder['E4']['meaning']['ru']='Независимо воспроизведённые результаты в рамках отдельно определённой процедуры репликации.'
          m={x['module_id']:x for x in d['modules']}
          m['COM-12']['development_summary']['ru']='Пул из 32 элементов сокращён до 24-элементного когнитивного кандидата; поэлементный критический аудит, разграничение владения измерительными территориями и протокол C1/C2/C3 подготовлены на уровне архитектуры. Фактические наблюдения в поле остаются обязательными до решения о заморозке.'
          m['COM-12']['publication_ceiling']['ru']='Допустимы кандидатная архитектура, история разработки, методы внутренней проверки, выбранные научные источники и текущий этап полевой проверки. Не допускаются подтверждённая факторная структура, общий показатель COM, производственный расчёт баллов, нормы, диагностика или классификация валидности согласия.'
          mot={x['code']:x for x in m['MOT-12']['candidate_architecture']}
          mot['M-P']['label']['ru']='Отклик на партнёра / коммунальная мотивация'
          mot['M-K']['label']['ru']='Совладание / регуляция аффекта'
          mot['M0']['label']['ru']='Низкая доступность мотива / автоматичность'
          m['MOT-12']['development_summary']['ru']='После аудита доказательной базы и границ сформирован контролируемый пул из 36 элементов, затем 24-элементный когнитивный кандидат и трассируемый резерв из 12 элементов. Экспертная проверка, CVI и когнитивная программа готовы к исполнению; M-V остаётся спорной территорией, требующей отдельной проверки.'
          m['MOT-12']['publication_ceiling']['ru']='Допустимы только кандидатные мотивационные территории и история разработки. Не допускаются общий показатель MOT, деление мотивов на здоровые и нездоровые, подтверждённая факторная модель, производственный расчёт баллов или заявление о психометрической валидности.'
          m['SELF-12']['development_summary']['ru']='Широкая карта из 12 территорий после сокращения и согласования владения измерительными территориями сведена к кандидатной архитектуре 5 CORE + 2 LIMITED и 21-элементному когнитивному кандидату. Экспертная проверка, CVI и когнитивная программа остаются зависимыми от фактических данных.'
          m['SELF-12']['publication_ceiling']['ru']='Допустимы кандидатная архитектура 5 CORE + 2 LIMITED, история разработки, границы и выбранные научные источники. Не допускаются общий показатель SELF, подтверждённая семифакторная модель, нормы или интерпретация результата участника.'
          m['RPE-MOD']['role']['ru']='Опциональный специализированный слой предпочтений и координат вознаграждения под отдельными правилами безопасности, конфиденциальности и публикации.'
          m['RPE-MOD']['development_summary']['ru']='На текущем этапе публично разрешены только минимальная роль, статус, границы, приостановка полевого применения и принцип независимого измерения с последующим совместным чтением.'
          m['RPE-MOD']['publication_ceiling']['ru']='Только существующее минимальное публичное резюме роли, статуса и границ. Детальные семейства конструктов, операционные детали повышенного риска, расчёт баллов, нормы, архетипы и интерпретация для респондента остаются скрыты до отдельного разрешения на публикацию RPE.'
          m['LIFE-12/18']['public_science_label']['ru']='Кандидатный слой исходов'
          m['LIFE-12/18']['role']['ru']='Отдельный слой исходов и переноса в другие сферы жизни. LIFE измеряет наблюдаемые последующие состояния, а не психосексуальную черту и не причинный эффект близости.'
          m['LIFE-12/18']['development_summary']['ru']='Первичная карта из 12 целевых исходов сокращена до 8 территорий, доступных респонденту, и до 6 CORE + CCO в ограниченной/вспомогательной роли; GLS вынесен во внешний сопоставительный показатель. Временные режимы T0/T1, недавнего паттерна и глобального внешнего сопоставления не взаимозаменяемы; LIFE-18 остаётся предпочтительной глубиной разработки.'
          qs={x['id']:x for x in d['cross_layer']['questions']}
          qs['CLQ-07']['theme']['ru']='Телесный отклик и оценочная сосредоточенность на себе'
          qs['CLQ-09']['question']['ru']='Как изменения эротической и реляционной системы после события связаны с аффектом, жизненной энергией, сном, вовлечённостью и смыслом?'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run deterministic PASS 4A projection gate
        run: node qa/webscience_pass4a_projection_gate_v0.5.mjs

      - name: Build controlled PASS 4A closure records
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          qa_path=Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_RESULT_v0.5.json')
          qa=json.loads(qa_path.read_text(encoding='utf-8'))
          if qa['status']!='PASS': raise SystemExit('PASS4A QA did not pass')
          report=f'''# P-120 WEB-SCIENCE EXT PASS 4A — RU/EN Publication Data Projection\n\n**Document ID:** P120-WEBSCI-EXT-004-PASS4A-REPORT  \n**Version:** v0.5  \n**Date:** 2026-09-06  \n**Status:** PASS / CLOSED / CONTROLLED  \n**Parent PASS:** WEB-SCIENCE EXT PASS 4 remains OPEN.\n\n## Scope\nPASS 4A projects the adjudicated v0.4 Extended/Outcomes scientific corpus into a public-safe bilingual data contract. It does not activate the renderer and does not modify measurement, scoring, thresholds, respondent sessions, persistence, reports or production main.\n\n## Controlled outputs\n1. `P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json` — RU/EN public-safe scientific projection.\n2. `P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json` — separate Core-45 / Global-70 library contract.\n3. `qa/webscience_pass4a_projection_gate_v0.5.mjs` — deterministic gate.\n4. PASS report, decision, QA result/summary, repository manifest and SHA-256 record.\n\n## Scientific boundaries retained\n- COM-12, MOT-12, SELF-12 and LIFE-12/18 remain `summary_only`.\n- RPE-MOD remains minimal role/status/boundary only; detailed construct and reference payload is suppressed.\n- DYADIC remains hidden.\n- E0 external foundation, E1 internal architecture verification, E2 human/cognitive evidence, E3 psychometric validation and E4 external replication remain distinct.\n- Empirical cross-layer discriminant validity is not established.\n- Empirical incremental validity is not established.\n- Validated cross-layer synergy is not authorized.\n- Join after independent measurement remains mandatory; no Extended super-score is authorized.\n\n## Library contract\nCore remains 45 references. PASS 4 adds 25 separately bound references, REF-046 through REF-070. Candidate global library = 70. The Core array is not replaced or renumbered. Reference count is not a validity metric.\n\n## RU/EN publication projection\nRussian publication strings were normalized to Russian while preserving canonical module IDs, construct codes and English labels in traceability/EN fields. English publication strings contain no Cyrillic.\n\n## QA\nDeterministic repository gate: **{qa['checks_passed']}/{qa['checks_total']} PASS; failed = {qa['checks_failed']}**.\n\n## No-change declaration\nMeasurement = NONE · Scoring = NONE · Thresholds = NONE · Respondent sessions = NONE · Persistence = NONE · Report calculations = NONE · Production renderer = NONE · Production main = NONE · Scientific status upgrade = NONE.\n\n## Verdict\n**PASS / RU-EN PUBLICATION DATA PROJECTION ESTABLISHED.**\n\nNext authorized gate: **WEB-SCIENCE EXT PASS 4B — Renderer Activation**.\n'''
          decision='''# P-120 WEB-SCIENCE EXT PASS 4A — Decision Record\n\n**Decision:** PASS / CLOSED / CONTROLLED  \n**Version:** v0.5 · 2026-09-06\n\nPASS 4A establishes the bilingual public-safe publication data contract and the separate Core-45 / Global-70 scientific-library projection.\n\nLocked for the next gate:\n- Core scientific payload remains unchanged and authoritative for Core.\n- COM/MOT/SELF/RPE/LIFE visibility remains summary-only.\n- RPE detailed public activation remains blocked.\n- DYADIC remains hidden.\n- Cross-layer content remains research-question/ownership/validation-plan content only.\n- E3/E4 states may not be inferred from E0/E1/E2.\n- 45 Core references + 25 extension references = candidate Global 70, without replacing Core-45.\n- Renderer activation is not part of PASS 4A.\n\nNext gate: **PASS 4B — Renderer Activation**.\n'''
          Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_REPORT_v0.5.md').write_text(report,encoding='utf-8')
          Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_DECISION_v0.5.md').write_text(decision,encoding='utf-8')
          summary={k:qa[k] for k in ['document_id','version','date','status','checks_total','checks_passed','checks_failed']}
          summary['gate']='PASS 4A — RU/EN Publication Data Projection'
          summary['next_gate']='PASS 4B — Renderer Activation'
          Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_SUMMARY_v0.5.json').write_text(json.dumps(summary,indent=2)+'\n')
          controlled=[
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json',
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_global_library_projection_v0.5.json',
            'qa/webscience_pass4a_projection_gate_v0.5.mjs',
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_REPORT_v0.5.md',
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_DECISION_v0.5.md',
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_RESULT_v0.5.json',
            'webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_SUMMARY_v0.5.json'
          ]
          entries=[]
          for rel in controlled:
            b=Path(rel).read_bytes(); entries.append({'path':rel,'sha256':hashlib.sha256(b).hexdigest()})
          manifest={
            'standard':'P120','document_id':'P120-WEBSCI-EXT-004-PASS4A-MANIFEST','version':'v0.5','date':'2026-09-06',
            'status':'PASS4A_CLOSED_CONTROLLED','branch':'web-science-ext-pass4-publication-projection',
            'baseline_commit':'5295b50d1082e83e6e4e36f26286cdc2ccaca841','production_main_mutated':False,
            'production_activation':'NOT_ACTIVATED','files':entries,'next_gate':'PASS 4B — Renderer Activation'
          }
          mp=Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_MANIFEST_v0.5.json')
          mp.write_text(json.dumps(manifest,indent=2)+'\n')
          sums=[]
          for rel in controlled+[str(mp)]:
            b=Path(rel).read_bytes(); sums.append(f'{hashlib.sha256(b).hexdigest()}  {rel}')
          Path('webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_SHA256SUMS_v0.5.txt').write_text('\n'.join(sums)+'\n')
          PY

      - name: Advance PASS 4 README to PASS 4B
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('webscience/pass4/README.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('9. RU/EN Publication Projection — **NEXT ACTIVE STAGE**','9. RU/EN Publication Projection — **PASS / CLOSED / v0.5**')
          t=t.replace('10. Renderer activation / Science QA preparation — **NEXT ACTIVE STAGE**','10. Renderer activation — **NEXT ACTIVE STAGE / PASS 4B**')
          t=t.replace('**WEB-SCIENCE EXT PASS 4 — RU/EN Publication Projection, Renderer Activation & Science QA Preparation.**','**WEB-SCIENCE EXT PASS 4B — Renderer Activation.**')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit controlled PASS 4A closure
        shell: bash
        run: |
          git config user.name 'P120 Research System'
          git config user.email '57597994+unityplanet@users.noreply.github.com'
          git add webscience/pass4/P120_WEBSCI_EXT_PASS4_publication_projection_v0.5.json \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_REPORT_v0.5.md \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_DECISION_v0.5.md \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_RESULT_v0.5.json \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_SUMMARY_v0.5.json \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_MANIFEST_v0.5.json \
                  webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_SHA256SUMS_v0.5.txt \
                  webscience/pass4/README.md
          git diff --cached --stat
          git commit -m 'WEB-SCIENCE PASS 4A: close RU/EN publication data projection'
          git push origin HEAD:web-science-ext-pass4-publication-projection

      - name: Upload PASS 4A QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_WEBSCI_PASS4A_QA
          path: webscience/pass4/P120_WEBSCI_EXT_PASS4_PASS4A_QA_RESULT_v0.5.json
          retention-days: 30
