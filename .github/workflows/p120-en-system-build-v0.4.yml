name: P-120 Native System Route Build

on:
  push:
    branches: [main]
    paths:
      - 'system/index.html'
      - 'localization/p120-en-items-*.js'
      - 'localization/p120-en-pass4-overrides-v0.4.js'
      - '.github/scripts/p120_pass2_native_routes.py'
      - '.github/scripts/p120_pass2_native_routes_runner.py'
      - '.github/workflows/p120-en-system-build-v0.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-system-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize native RU and EN System routes
        run: python .github/scripts/p120_pass2_native_routes_runner.py

      - name: Verify native route contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          ru=Path('system/index.html').read_text(encoding='utf-8')
          en=Path('en/system/index.html').read_text(encoding='utf-8')
          required_ru=['<html lang="ru">','data-p120-route-authority="native-ru"','<base href="../" />']
          required_en=['<html lang="en">','data-p120-route-authority="native-en"','<base href="../../" />']
          for token in required_ru:
              if token not in ru: raise SystemExit('RU native route requirement missing: '+token)
          for token in required_en:
              if token not in en: raise SystemExit('EN native route requirement missing: '+token)
          forbidden=['p120-en-system-runtime-v0.4.js','p120-en-instrument-bind-v0.4.js','p120-public-runtime-v1.0.js','founder-route-v1.1.js','extended-research-navigation-v1.0.js','science-navigation-reconciliation-v1.0.js']
          for token in forbidden:
              if token in ru or token in en: raise SystemExit('Forbidden System runtime coupling: '+token)
          def inst(s):
              m=re.search(r'window\.P120_INSTRUMENT\s*=\s*(\{.*?\});\s*</script>',s,re.S)
              if not m: raise SystemExit('instrument missing')
              return json.loads(m.group(1))
          def manifest(x):
              return [(i['id'],i.get('module'),i.get('type'),tuple(c.get('value') for c in i.get('choices',[]))) for i in x['items']]
          if manifest(inst(ru)) != manifest(inst(en)): raise SystemExit('coded response manifest mismatch')
          if len(manifest(inst(ru))) != 180: raise SystemExit('item count != 180')
          print('Native System route contract: PASS')
          PY

      - name: Commit generated route materialization
        shell: bash
        run: |
          files=(system/index.html en/system/index.html manual-report-handoff-v1.0.js p120-submission-intake-v1.0.js P120_WEB_RECONCILIATION_PASS2_NATIVE_ROUTE_QA.json)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo 'Native System routes already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'Build native RU and EN P-120 System routes'
            git push
          fi
