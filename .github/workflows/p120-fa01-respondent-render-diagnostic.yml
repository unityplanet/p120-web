name: P120 FA01 Respondent Render Diagnostic

on:
  push:
    branches:
      - audit/fa01-respondent-render-20260905

permissions:
  contents: read

jobs:
  render-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build non-sensitive Founder Alpha render harness
        run: |
          mkdir -p qa/fa01-render
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const sha=s=>crypto.createHash('sha256').update(s,'utf8').digest('hex');
          function assignedObject(html,name){
            const tok=name+' = ',t=html.indexOf(tok),start=html.indexOf('{',t+tok.length);
            if(t<0||start<0)throw new Error('assignment_missing');
            let dep=0,str=false,esc=false;
            for(let i=start;i<html.length;i++){
              const c=html[i];
              if(str){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c==='"')str=false;continue}
              if(c==='"'){str=true;continue}if(c==='{')dep++;if(c==='}'&&--dep===0)return JSON.parse(html.slice(start,i+1));
            }
            throw new Error('assignment_unterminated');
          }
          const system=fs.readFileSync('system/index.html','utf8');
          const I=assignedObject(system,'window.P120_INSTRUMENT');
          const runtimeHash=sha(system);
          const instrumentHash=sha(JSON.stringify({modules:I.modules,items:I.items}));
          const roleDefs=[['COM12',24],['MOT12',24],['SELF12',21],['LIFE_T3',4]];
          const modules=roleDefs.map(([id,n])=>({id,name:'Synthetic '+id,alpha_role:id,count:n}));
          const items=[];
          for(const [role,n] of roleDefs){
            for(let i=1;i<=n;i++)items.push({
              id:`QA_${role}_${String(i).padStart(2,'0')}`,module:role,type:'single_choice',text:`Synthetic render item ${role} ${i}`,
              choices:[{value:'1',label:'Synthetic option',response_state:'ANSWERED'}],candidate_scoring:false,
              scope_class:'QA_RENDER',source_version:'qa-render-v1',temporal_mode:role==='LIFE_T3'?'T3':'MAIN',eligibility_state:'NOT_ASSESSED'
            });
          }
          const extHash=sha(JSON.stringify({modules,items}));
          const source_authorities={};
          for(const [role] of roleDefs)source_authorities[role]={version:'qa-render-v1',sha256:'1'.repeat(64),document_id:'QA-NON-SCIENTIFIC'};
          const pkg={schema:'p120.fa01.extension-package.v1',locale:'ru',candidate_scoring:false,
            manifest:{corpus_id:'QA-FA01-RENDER',corpus_version:'qa-render-v1',base_item_count:180,extension_item_count:73,main_item_count:253,
              runtime_build_sha:'563176ed7c31e98d8c150458499c8e157deff0be',base_runtime_sha256:runtimeHash,base_instrument_sha256:instrumentHash,
              extension_payload_sha256:extHash,rpe_mode:'DEFERRED',life_main_temporal_mode:'T3',candidate_scoring:false,source_authorities},modules,items};
          const pkgText=JSON.stringify(pkg),contentHash=sha(pkgText);
          fs.writeFileSync('qa/fa01-render/package.json',pkgText);
          fs.writeFileSync('qa/fa01-render/stub-config.js',`window.P120_SUBMISSION_CONFIG={projectUrl:'https://qa.invalid',publishableKey:'qa'};`);
          const session={session_id:'11111111-1111-4111-8111-111111111111',user_id:'22222222-2222-4222-8222-222222222222',resource_id:'33333333-3333-4333-8333-333333333333',run_type:'FOUNDER_ALPHA',environment:'PRODUCTION',locale:'ru',release_version:'FA-P1',content_sha256:'${contentHash}',status:'CREATED',runtime_build_sha:'563176ed7c31e98d8c150458499c8e157deff0be',base_runtime_sha256:'${runtimeHash}',base_instrument_sha256:'${instrumentHash}',temporal_mode:'MAIN'};
          const resource={resource_id:session.resource_id,resource_key:'founder-alpha-core-v1',run_type:'FOUNDER_ALPHA',release_state:'INTERNAL_ALPHA',is_launchable:true,storage_bucket:'qa',storage_object_path:'package.json',content_sha256:'${contentHash}',runtime_build_sha:session.runtime_build_sha,base_runtime_sha256:'${runtimeHash}',base_instrument_sha256:'${instrumentHash}'};
          const profile={user_id:session.user_id,status:'ACTIVE',role:'FOUNDER_ADMIN'};
          fs.writeFileSync('qa/fa01-render/stub-supabase.js',`(()=>{const profile=${JSON.stringify(profile)},session=${JSON.stringify(session)},resource=${JSON.stringify(resource)},pkg=${JSON.stringify(pkgText)};const row=t=>t==='p120_profiles'?profile:t==='p120_assessment_sessions'?session:t==='p120_resources'?resource:null;const chain=t=>{const q={select(){return q},eq(){return q},maybeSingle:async()=>({data:row(t),error:null})};return q};window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:{user:{id:profile.user_id}}}})},from:t=>chain(t),rpc:async(name,args)=>name==='p120_can_access_resource'?({data:true,error:null}):({data:null,error:null}),storage:{from:()=>({download:async()=>({data:new Blob([pkg],{type:'application/json'}),error:null})})}})}})();`);
          let outer=fs.readFileSync('internal/runtime/index.html','utf8');
          outer=outer.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>','<script src="/qa/fa01-render/stub-supabase.js"></script>');
          outer=outer.replace('<script src="../../p120-submission-config-v1.0.js"></script>','<script src="/qa/fa01-render/stub-config.js"></script>');
          outer=outer.replace('<script src="./p120-alpha-system-adapter-v1.0.js"></script>','<script src="/internal/runtime/p120-alpha-system-adapter-v1.0.js"></script>');
          fs.writeFileSync('qa/fa01-render/index.html',outer);
          console.log(JSON.stringify({runtimeHash,instrumentHash,contentHash,items:I.items.length,modules:I.modules.length}));
          NODE
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/p120-http.log 2>&1 &
          echo $! > /tmp/p120-http.pid
          sleep 2
      - name: Run exact-adapter render diagnostic
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const consoleEvents=[],pageErrors=[];
            page.on('console',m=>consoleEvents.push(`[${m.type()}] ${m.text()}`));
            page.on('pageerror',e=>pageErrors.push(String(e&&e.stack||e)));
            await page.goto('http://127.0.0.1:4173/qa/fa01-render/?session=11111111-1111-4111-8111-111111111111',{waitUntil:'domcontentloaded'});
            await page.locator('#runtimeLayout:not(.hidden)').waitFor({timeout:15000});
            await page.waitForTimeout(3500);
            const frame=page.frames().find(f=>f!==page.mainFrame());
            if(!frame)throw new Error('iframe_missing');
            const state=await frame.evaluate(()=>({href:location.href,bodyText:(document.body?.innerText||'').slice(0,1200),appHTMLLength:document.getElementById('app')?.innerHTML.length||0,itemCount:window.P120_INSTRUMENT?.items?.length||0,moduleCount:window.P120_INSTRUMENT?.modules?.length||0,sessionKey:window.P120_SESSION_KEY||null}));
            console.log('FRAME_STATE='+JSON.stringify(state));
            console.log('PAGE_ERRORS='+JSON.stringify(pageErrors));
            console.log('CONSOLE_EVENTS='+JSON.stringify(consoleEvents));
            const outer=await page.locator('#runtimeStatus').innerText();
            console.log('OUTER_RUNTIME_STATUS='+JSON.stringify(outer));
            if(state.itemCount!==253||state.moduleCount!==9)throw new Error('composed_instrument_not_253_9');
            if(state.appHTMLLength<50||state.bodyText.trim().length<30)throw new Error('respondent_ui_blank');
            if(pageErrors.length)throw new Error('browser_page_errors_present');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
