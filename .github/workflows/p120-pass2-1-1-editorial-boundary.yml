name: P120 PASS 2.1.1 Editorial Boundary

on:
  push:
    branches:
      - work/p120-editorial-boundary-pass2-1
    paths:
      - '.github/scripts/p120_pass2_1_editorial_boundary.py'
      - '.github/workflows/p120-pass2-1-1-editorial-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled editorial boundary patch
        run: python .github/scripts/p120_pass2_1_editorial_boundary.py

      - name: Verify boundary invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ru=Path('index.html').read_text(encoding='utf-8')
          en=Path('en/index.html').read_text(encoding='utf-8')
          for name,s in [('RU',ru),('EN',en)]:
              required=[
                  "if(['preflight','test','transition','results'].includes(state.screen)) state.screen='home';",
                  "function startOrResume(){location.href='system/';return false}",
                  "document.querySelectorAll('[data-mobile-resume]').forEach(b=>b.onclick=()=>{closeMobileMenu();location.href='system/'});",
                  "const start=()=>{location.href='system/'};",
                  "if(entryParams.get('start')==='1'){location.replace('system/');return}",
              ]
              for marker in required:
                  assert marker in s, f'{name} missing boundary invariant: {marker}'
          # Design/science/system files are not touched by the patch script.
          assert Path('system/index.html').exists()
          assert Path('en/system/index.html').exists()
          print('PASS 2.1.1 static boundary QA: PASS')
          PY

      - name: Commit controlled patch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- en/index.html P120_PASS2_1_1_EDITORIAL_BOUNDARY_CONTROL.md)" ]; then
            echo 'Boundary files already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add en/index.html P120_PASS2_1_1_EDITORIAL_BOUNDARY_CONTROL.md
            git commit -m 'Implement PASS 2.1.1 editorial runtime boundary guard'
            git push
          fi
