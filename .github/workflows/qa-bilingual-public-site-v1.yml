name: QA bilingual public site v1.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qa-bilingual-public-site-v1.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-http.log 2>&1 &
          sleep 2
      - name: Run public EN render audit
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          const failures=[];
          const allowed=[/^Русский$/,/^RU$/];
          const cyr=text=>[...new Set(text.split(/\n+/).map(x=>x.trim()).filter(x=>x&&/[А-Яа-яЁё]/.test(x)&&!allowed.some(r=>r.test(x))))];

          async function inspectHome(width,height,label){
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:4173/en/',{waitUntil:'networkidle'});
            await page.waitForTimeout(1000);
            const lines=cyr(await page.locator('body').innerText());
            report.push(`${label} HOME cyrillic=${lines.length}`);
            if(lines.length){report.push(`${label} HOME CYR: ${lines.join(' | ')}`);failures.push(`${label}: visible Cyrillic remains on EN home`);}

            const depth=page.getByText('But to see yourself in greater depth.',{exact:true});
            if(await depth.count()){
              const style=await depth.evaluate(el=>({size:parseFloat(getComputedStyle(el).fontSize),family:getComputedStyle(el).fontFamily,weight:getComputedStyle(el).fontWeight,cls:el.className}));
              report.push(`${label} DEPTH size=${style.size} family=${style.family} weight=${style.weight} class=${style.cls}`);
              if(width>=1000 && style.size<54) failures.push(`${label}: depth statement too small (${style.size}px)`);
              if(!/Noto Serif/i.test(style.family)) failures.push(`${label}: depth statement not assigned Noto Serif`);
            } else failures.push(`${label}: depth statement missing`);
            await page.screenshot({path:`qa_${label}_home.png`,fullPage:true});

            if(width<700){
              const menu=page.locator('[data-mobile-menu]').first();
              if(await menu.count()){
                await menu.click();await page.waitForTimeout(250);
                const mt=await page.locator('.mobile-menu').innerText();
                report.push(`${label} MENU language=${/Language/.test(mt)} chapters=${/Chapters/.test(mt)}`);
              }
            }
            await page.close();
          }

          async function inspectScience(){
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:4173/en/',{waitUntil:'networkidle'});await page.waitForTimeout(600);
            const btn=page.locator('[data-science]').first();
            if(!await btn.count()){failures.push('Science button missing');await page.close();return;}
            await btn.click();await page.waitForTimeout(1000);
            const lines=cyr(await page.locator('body').innerText());
            report.push(`SCIENCE cyrillic=${lines.length}`);
            if(lines.length){report.push(`SCIENCE CYR: ${lines.join(' | ')}`);failures.push('visible Cyrillic remains in EN Science');}
            await page.screenshot({path:'qa_science.png',fullPage:true});
            await page.close();
          }

          await inspectHome(1440,1000,'desktop');
          await inspectHome(390,844,'mobile');
          await inspectScience();
          await browser.close();
          fs.writeFileSync('BILINGUAL_RENDER_QA.txt',report.join('\n')+'\n'+(failures.length?'FAIL\n'+failures.join('\n'):'PASS')+'\n');
          console.log(report.join('\n'));
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P120_BILINGUAL_RENDER_QA_v1.2
          path: |
            BILINGUAL_RENDER_QA.txt
            qa_*.png
          retention-days: 30
