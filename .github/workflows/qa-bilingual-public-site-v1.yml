name: QA bilingual public site v1.5 bundled
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qa-bilingual-public-site-v1.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production bundle wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'p120-public-styles-v1.0.css?v=pub16' in s
          assert 'p120-public-runtime-v1.0.js?v=pub16' in s
          assert Path('p120-public-styles-v1.0.css').exists()
          assert Path('p120-public-runtime-v1.0.js').exists()
          presentation_css=re.findall(r'<link[^>]+href=["\']([^"\']*(?:visual-fix|extended-research|chapter-navigation|language-switch|depth-statement)[^"\']*\.css[^"\']*)',s,re.I)
          presentation_js=re.findall(r'<script[^>]+src=["\']([^"\']*(?:extended-research-navigation|chapter-navigation|language-switch|depth-statement)[^"\']*\.js[^"\']*)',s,re.I)
          assert not presentation_css, presentation_css
          assert not presentation_js, presentation_js
          print('Production bundle wiring PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-http.log 2>&1 &
          sleep 2
      - name: Run render, staircase, overflow and Ivory contrast audit
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          const failures=[];
          const allowed=[/^Русский$/,/^RU$/];
          const cyr=text=>[...new Set(text.split(/\n+/).map(x=>x.trim()).filter(x=>x&&/[А-Яа-яЁё]/.test(x)&&!allowed.some(r=>r.test(x))))];
          function alphaOf(color){const m=color.match(/rgba?\(([^)]+)\)/i);if(!m)return color==='transparent'?0:1;const p=m[1].split(',').map(x=>x.trim());return p.length>3?parseFloat(p[3]):1;}
          async function inspectStair(page,label){
            await page.waitForTimeout(900);await page.evaluate(()=>document.fonts?.ready);
            for(const [sel,name] of [['.p120-depth-lead','lead'],['.p120-depth-statement','depth']]){
              const el=page.locator(sel).first();if(!await el.count()){failures.push(`${label}: ${name} statement missing`);continue;}
              const data=await el.evaluate(el=>{const cs=getComputedStyle(el);const frame=el.closest('.p120-depth-frame')?.getBoundingClientRect();const lines=[...el.querySelectorAll('.p120-stair-line')].map(x=>{const r=x.getBoundingClientRect();return{x:r.x,right:r.right,width:r.width}});return{family:cs.fontFamily,size:parseFloat(cs.fontSize),lines,frame:frame?{left:frame.left,right:frame.right,width:frame.width}:null};});
              report.push(`${label} ${name} family=${data.family} size=${data.size} lines=${data.lines.length} x=${data.lines.map(x=>x.x).join(',')} right=${data.lines.map(x=>x.right).join(',')} frame=${data.frame?`${data.frame.left}..${data.frame.right}`:'none'}`);
              if(!/Noto Serif Display/i.test(data.family))failures.push(`${label}: ${name} is not Noto Serif Display`);
              if(data.lines.length!==3)failures.push(`${label}: ${name} staircase does not have 3 lines`);
              if(data.lines.length===3&&!(data.lines[0].x<data.lines[1].x&&data.lines[1].x<data.lines[2].x))failures.push(`${label}: ${name} staircase offsets are not increasing`);
              if(label.includes('desktop')&&name==='depth'&&data.size<54)failures.push(`${label}: depth statement too small (${data.size}px)`);
              if(label.includes('desktop')&&data.frame){const pad=8;const bad=data.lines.filter(x=>x.x<data.frame.left+pad||x.right>data.frame.right-pad);if(bad.length)failures.push(`${label}: ${name} staircase crosses frame boundary`);}
            }
          }
          async function inspectEnglish(width,height,label){const page=await browser.newPage({viewport:{width,height}});await page.goto('http://127.0.0.1:4173/en/',{waitUntil:'networkidle'});await page.waitForTimeout(700);const lines=cyr(await page.locator('body').innerText());report.push(`${label} EN cyrillic=${lines.length}`);if(lines.length){report.push(`${label} CYR: ${lines.join(' | ')}`);failures.push(`${label}: visible Cyrillic remains`);}await inspectStair(page,label);await page.screenshot({path:`qa_${label}.png`,fullPage:true});await page.close();}
          async function inspectIvory(){const page=await browser.newPage({viewport:{width:1600,height:1000}});await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.waitForTimeout(700);await page.evaluate(()=>{document.body.dataset.theme='ivory';localStorage.setItem('p120-theme','ivory')});await page.waitForTimeout(150);await inspectStair(page,'RU ivory desktop');const token=await page.evaluate(()=>getComputedStyle(document.body).getPropertyValue('--frame-secondary').trim());const tokenAlpha=alphaOf(token);report.push(`IVORY frame-secondary=${token} alpha=${tokenAlpha}`);if(tokenAlpha<.22)failures.push(`Ivory frame token too weak: ${token}`);const stats=await page.locator('[class*="-card"],[class*="-panel"],[class*="-frame"],details,summary,button,input').evaluateAll(els=>{const out=[];for(const el of els){const cs=getComputedStyle(el);const w=parseFloat(cs.borderTopWidth)||0;if(w>0)out.push({c:cs.borderTopColor,w});if(out.length>=120)break;}return out;});const strong=stats.filter(x=>alphaOf(x.c)>=.20).length;report.push(`IVORY bordered-samples=${stats.length} readable=${strong}`);if(stats.length<8||strong<Math.min(8,Math.floor(stats.length*.55)))failures.push('Ivory framed elements still have insufficient structural contrast');await page.screenshot({path:'qa_ivory_full.png',fullPage:true});await page.close();}
          async function inspectScience(){const page=await browser.newPage({viewport:{width:1440,height:1000}});await page.goto('http://127.0.0.1:4173/en/',{waitUntil:'networkidle'});await page.waitForTimeout(500);const btn=page.locator('[data-science]').first();if(!await btn.count()){failures.push('Science button missing');await page.close();return;}await btn.click();await page.waitForTimeout(800);const lines=cyr(await page.locator('body').innerText());report.push(`SCIENCE cyrillic=${lines.length}`);if(lines.length){report.push(`SCIENCE CYR: ${lines.join(' | ')}`);failures.push('visible Cyrillic remains in EN Science');}await page.close();}
          await inspectEnglish(1440,1000,'EN desktop');await inspectEnglish(1920,1080,'EN desktop 1920');await inspectEnglish(390,844,'EN mobile');await inspectIvory();await inspectScience();await browser.close();
          fs.writeFileSync('BILINGUAL_RENDER_QA.txt',report.join('\n')+'\n'+(failures.length?'FAIL\n'+failures.join('\n'):'PASS')+'\n');console.log(report.join('\n'));if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P120_BILINGUAL_RENDER_QA_v1.5_BUNDLED
          path: |
            BILINGUAL_RENDER_QA.txt
            qa_*.png
          retention-days: 30
