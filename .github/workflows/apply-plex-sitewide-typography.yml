name: Apply P-120 Plex Sitewide Typography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_plex_sitewide_typography.py'
      - '.github/workflows/apply-plex-sitewide-typography.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typography migration and Founder distance correction
        run: python .github/scripts/apply_plex_sitewide_typography.py
      - name: Static syntax checks
        run: |
          set -euo pipefail
          node --check founder-editorial-story-v1.0.js
          node --check founder-visual-objects-v1.0.js
          if [ -f qa/check_build.py ]; then python qa/check_build.py; fi
      - name: Commit controlled typography update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No typography changes required.'
            exit 0
          fi
          git config user.name 'P-120 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html en/index.html why-p120/index.html why-p120/why-p120.css founder-editorial-story-v1.0.css en/creator/index.html founder-visual-objects-v1.0.css
          git commit -m 'feat: adopt Plex Sans as P-120 functional typography'
          git push
