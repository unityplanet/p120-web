name: P120 PASS 4A Deployment Path Gate

on:
  push:
    branches:
      - 'work/p120-deployment-path-reconciliation-pass4a'
      - 'work/p120-pass4a-science-qa-reconciliation'
      - 'web-science-prod-g1-deployment-path-reconcile'
      - 'main'
    paths:
      - 'science/index.html'
      - 'en/science/index.html'
      - 'qa/pass4a_deployment_path_gate.mjs'
      - 'qa/webscience_prod_g1_deployment_path_baseline_reconciliation_v1.0.py'
      - '.github/workflows/p120-pass4a-deployment-path-gate.yml'
      - '.github/workflows/p120-scientific-base-production-gate.yml'
      - 'P120_PASS4A_DEPLOYMENT_PATH_RECONCILIATION_v1.0.md'
      - 'webscience/production/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original PASS 4A path invariant in current production authority
        run: |
          python3 -m py_compile qa/webscience_prod_g1_deployment_path_baseline_reconciliation_v1.0.py
          python3 qa/webscience_prod_g1_deployment_path_baseline_reconciliation_v1.0.py

  project-subpath-science-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: protected-contract
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local GitHub-Pages-equivalent project-subpath server
        shell: bash
        run: |
          cd ..
          python3 -m http.server 4179 --bind 127.0.0.1 >/tmp/p120-pass4a-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4179/p120-web/science/ >/dev/null
          curl -fsS http://127.0.0.1:4179/p120-web/en/science/ >/dev/null
      - name: Run PASS 4A project-subpath Science regression
        run: node qa/pass4a_deployment_path_gate.mjs
      - name: Upload PASS 4A QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P120_PASS4A_DEPLOYMENT_PATH_QA
          path: |
            qa-evidence-pass4a/
            qa-evidence-webscience-prod-g1-deployment-path-reconcile/
          retention-days: 90
          if-no-files-found: error
