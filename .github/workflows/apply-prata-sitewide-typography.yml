name: Apply P-120 Prata Sitewide Typography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_prata_sitewide_typography.py'
      - '.github/workflows/apply-prata-sitewide-typography.yml'
      - 'prata-literary-voice-v1.0.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and publish controlled Prata literary voice
        run: |
          set -euo pipefail
          git config user.name 'P-120 Release Bot'
          git config user.email 'actions@users.noreply.github.com'

          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python .github/scripts/apply_prata_sitewide_typography.py

            python - <<'PY'
          from pathlib import Path
          for f in ['index.html','en/index.html','why-p120/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'prata:400' in s, f'Prata font source missing in {f}'
          why=Path('why-p120/why-p120.css').read_text(encoding='utf-8')
          assert 'P-120 Why P-120 — Prata literary voice v1.0' in why
          print('Prata content conformance: PASS')
          PY

            if [ -f qa/check_build.py ]; then python qa/check_build.py; fi

            git add index.html en/index.html why-p120/index.html why-p120/why-p120.css
            if git diff --cached --quiet; then
              echo 'No Prata typography changes required.'
              exit 0
            fi

            git commit -m 'feat: integrate Prata as P-120 literary voice'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt $i; reapplying on latest main."
            sleep 2
          done

          exit 1
