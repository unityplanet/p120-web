name: Apply P-120 Prata Sitewide Typography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_prata_sitewide_typography.py'
      - '.github/workflows/apply-prata-sitewide-typography.yml'
      - 'prata-literary-voice-v1.0.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Apply controlled Prata literary voice
        run: python .github/scripts/apply_prata_sitewide_typography.py

      - name: Static conformance checks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for f in ['index.html','en/index.html','why-p120/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'prata:400' in s, f'Prata font source missing in {f}'
          why=Path('why-p120/why-p120.css').read_text(encoding='utf-8')
          assert 'P-120 Why P-120 — Prata literary voice v1.0' in why
          wf=Path('.github/workflows/integrate-bilingual-public-site-v1.yml').read_text(encoding='utf-8')
          assert "'prata-literary-voice-v1.0.css'" in wf
          assert 'pub21' in wf
          print('Prata static conformance: PASS')
          PY
          if [ -f qa/check_build.py ]; then python qa/check_build.py; fi

      - name: Commit controlled typography update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Prata typography changes required.'
            exit 0
          fi
          git config user.name 'P-120 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html en/index.html why-p120/index.html why-p120/why-p120.css .github/workflows/integrate-bilingual-public-site-v1.yml
          git commit -m 'feat: integrate Prata as P-120 literary voice'
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
