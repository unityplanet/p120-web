name: Founder Web PASS 4 QA (Historical)

# Historical baseline only. PASS 4 was superseded by FOUNDER-WEB PASS 6 after
# controlled visual-object and typography changes. Keep this workflow manually
# runnable for release archaeology; it must not gate current /creator/ changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  founder-pass4-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Historical static contract and privacy audit
        run: |
          set -euo pipefail
          python qa/check_founder_separate_page.py
          node --check founder-route-v1.1.js
          node --check founder-editorial-story-v1.0.js
          if [ -f qa/check_build.py ]; then python qa/check_build.py; fi

      - name: Notice
        run: |
          echo 'Historical PASS 4 gate only.'
          echo 'Current controlled visual/release authority: FOUNDER-WEB PASS 6.'
