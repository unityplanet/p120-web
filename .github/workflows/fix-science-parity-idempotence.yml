name: Fix Science Parity Idempotence
on:
  push:
    paths:
      - '.github/workflows/fix-science-parity-idempotence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/restore-science-visual-parity-v1.yml')
          t=p.read_text(encoding='utf-8')
          old="const h=document.querySelector('.science-page h1');if(h)h.textContent='Scientific Base P-120.';"
          new="const h=document.querySelector('.science-page h1');if(h&&h.textContent.trim()!=='Scientific Base P-120.')h.textContent='Scientific Base P-120.';"
          if old not in t: raise SystemExit('target not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "p120-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/restore-science-visual-parity-v1.yml
          git commit -m "SCIENCE: make English surface localization idempotent"
          git push
