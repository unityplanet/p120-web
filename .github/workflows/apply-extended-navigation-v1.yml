name: Apply P-120 Extended Research Navigation v1.0

on:
  push:
    branches: [main]
    paths:
      - 'extended-research-navigation-v1.0.css'
      - 'extended-research-navigation-v1.0.js'
      - '.github/workflows/apply-extended-navigation-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate navigation and contextual entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          before = text

          # Record mobile bottom-navigation source markers. This pass must not touch it.
          bottom_count_before = text.count('mobile-bottom-bar-grid')
          bottom_item_before = text.count('mobile-bottom-item')

          # Remove the obsolete one-shot placement script. The new SPA-safe navigation
          # integration recreates the section after every home render.
          text = re.sub(
              r'\s*<!-- P120 EXTENDED PLACEMENT:START -->.*?<!-- P120 EXTENDED PLACEMENT:END -->\s*',
              '\n', text, flags=re.S
          )

          # Remove the obsolete one-shot responsive UI script; its behavior is now
          # handled for every recreated section by the navigation integration.
          text = re.sub(
              r'\s*<script[^>]+data-p120-extended-ui="v1\.0"[^>]*></script>\s*',
              '\n', text, flags=re.I
          )

          # Idempotently replace this release's CSS/JS links.
          text = re.sub(
              r'\s*<link[^>]+data-p120-extended-navigation="v1\.0"[^>]*>\s*',
              '\n', text, flags=re.I
          )
          text = re.sub(
              r'\s*<script[^>]+data-p120-extended-navigation="v1\.0"[^>]*></script>\s*',
              '\n', text, flags=re.I
          )

          css = '<link rel="stylesheet" href="extended-research-navigation-v1.0.css?v=ersnav10" data-p120-extended-navigation="v1.0" />'
          js = '<script src="extended-research-navigation-v1.0.js?v=ersnav10" data-p120-extended-navigation="v1.0"></script>'

          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('Missing head/body closing marker')
          text = text.replace('</head>', '  ' + css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)

          checks = {
              'extended-source-once': text.count('id="extended-research-set"') == 1,
              'nav-css-once': text.count('extended-research-navigation-v1.0.css') == 1,
              'nav-js-once': text.count('extended-research-navigation-v1.0.js') == 1,
              'obsolete-placement-removed': 'P120 EXTENDED PLACEMENT:START' not in text,
              'obsolete-ui-link-removed': 'data-p120-extended-ui="v1.0"' not in text,
              'bottom-grid-unchanged': text.count('mobile-bottom-bar-grid') == bottom_count_before,
              'bottom-items-unchanged': text.count('mobile-bottom-item') == bottom_item_before,
              'no-extended-total': 'P120_TOTAL_EXTENDED' not in text,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Navigation integration assertions failed: ' + ', '.join(failed))

          path.write_text(text, encoding='utf-8')
          print('Extended navigation integration: PASS')
          print('Mobile bottom navigation markers unchanged:', bottom_count_before, bottom_item_before)
          print('index sha256:', hashlib.sha256(text.encode()).hexdigest())
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check extended-research-navigation-v1.0.js
          node --check extended-research-set-v1.0.js

      - name: Commit integrated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already integrated.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Integrate Extended Set navigation and report bridge'
            git push
          fi

      - name: Build navigation hosting package
        shell: bash
        run: |
          rm -rf _ers_nav_hosting
          mkdir -p _ers_nav_hosting
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.')
          out=Path('_ers_nav_hosting')
          skip={'.git','.github','_ers_nav_hosting'}
          for p in root.iterdir():
              if p.name in skip or p.name.startswith('.git') or p.suffix.lower()=='.zip':
                  continue
              if p.is_dir():
                  if not p.name.startswith('_'):
                      shutil.copytree(p,out/p.name,dirs_exist_ok=True)
              else:
                  shutil.copy2(p,out/p.name)
          PY
          cd _ers_nav_hosting
          zip -qr ../P120_Web_Editorial_EXTENDED_NAVIGATION_v1.0_HOSTING_PACKAGE.zip .
          cd ..
          unzip -t P120_Web_Editorial_EXTENDED_NAVIGATION_v1.0_HOSTING_PACKAGE.zip
          sha256sum P120_Web_Editorial_EXTENDED_NAVIGATION_v1.0_HOSTING_PACKAGE.zip > EXTENDED_NAV_PACKAGE_SHA256.txt

      - name: Upload hosting package
        uses: actions/upload-artifact@v4
        with:
          name: P120_Web_Editorial_EXTENDED_NAVIGATION_v1.0_HOSTING_PACKAGE
          path: |
            P120_Web_Editorial_EXTENDED_NAVIGATION_v1.0_HOSTING_PACKAGE.zip
            EXTENDED_NAV_PACKAGE_SHA256.txt
          retention-days: 30
