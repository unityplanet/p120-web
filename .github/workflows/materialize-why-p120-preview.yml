name: Materialize Why P-120 Preview

on:
  push:
    paths:
      - '.github/workflows/materialize-why-p120-preview.yml'
      - 'why-p120/payload-v14.part1'
      - 'why-p120/payload-v14.part2'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  materialize-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize native Why P-120 HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          target='8f8b1bf2d8ba288d4c233a6e3392663dcf81d42df8124844ada0fb07d0a0f584'
          p1=''.join(Path('why-p120/payload-v14.part1').read_text().split())
          p2=''.join(Path('why-p120/payload-v14.part2').read_text().split())
          raw=p1+p2
          print('input_lengths', len(p1), len(p2), len(raw))

          candidates=[]
          if len(raw)==9136 and hashlib.sha256(raw.encode()).hexdigest()==target:
              candidates=[raw]
          elif len(p1)==5001 and len(p2)==4136:
              for i in range(len(p1)):
                  candidate=p1[:i]+p1[i+1:]+p2
                  if hashlib.sha256(candidate.encode()).hexdigest()==target:
                      print('removed_extra_character_at_part1_index', i)
                      candidates.append(candidate)
                      break

          if len(candidates)!=1:
              raise SystemExit('Could not reconstruct exact expected payload')
          Path('/tmp/payload-v14.b64').write_text(candidates[0])
          print('recovered_length', len(candidates[0]))
          print('recovered_sha', hashlib.sha256(candidates[0].encode()).hexdigest())
          PY

          base64 --decode /tmp/payload-v14.b64 | gunzip > why-p120/index.html
          echo '176976ed565cee294bbfef91c9e66e3be4d0cedb1af35ef40fcba412260e97bf  why-p120/index.html' | sha256sum -c -
          grep -q '<section class="wp-act wp-act4' why-p120/index.html
          if grep -q 'DecompressionStream\|payload-v14\|Preview load error' why-p120/index.html; then
            echo 'Loader markers still present in materialized HTML' >&2
            exit 1
          fi

      - name: Persist native index to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add why-p120/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize Why P-120 v1.4 native preview HTML'
            git push origin HEAD:main
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
