name: HG-CGA PASS2 cross-surface regression

on:
  push:
    branches:
      - feat/hgcga-web-implementation-pass2
    paths:
      - .github/workflows/hgcga-pass2-cross-surface-qa.yml

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-hgcga-pass2-http.log 2>&1 &
          sleep 2
      - name: Run cross-surface browser matrix
        run: |
          cat > hgcga-pass2-cross-surface.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const failures=[]; const report=[];
          const check=(ok,msg)=>{report.push(`${ok?'PASS':'FAIL'} ${msg}`);if(!ok)failures.push(msg)};
          const routes=['/','/about/','/why-p120/','/creator/','/extended/','/together/','/science/','/contact/','/research/how-we-decide/'];
          const enRoutes=routes.map(r=>r==='/'?'/en/':`/en${r}`);

          async function visit(path,viewport,label){
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|font|Failed to load resource/i.test(m.text()))errors.push(`console:${m.text()}`)});
            const resp=await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
            await page.waitForTimeout(350);
            check(!!resp && resp.status()<400,`${label} ${path} HTTP <400`);
            check(await page.locator('body').count()===1,`${label} ${path} body exists`);
            check(errors.length===0,`${label} ${path} no JS/page errors${errors.length?` :: ${errors.join(' | ')}`:''}`);

            const isMain=path==='/'||path==='/en/';
            const isScience=path.endsWith('/science/');
            const isResearch=path.endsWith('/research/how-we-decide/');
            if(isMain){
              const decision=page.locator('[data-ecosystem-route="decisionResearch"]');
              const n=await decision.count();
              check(n===1,`${label} ${path} decision research exists in ecosystem DOM`);
              if(n) check((await decision.getAttribute('aria-disabled'))!=='true',`${label} ${path} decision research active`);
              const mobileDecision=page.locator('[data-ecosystem-mobile="decisionResearch"]');
              check(await mobileDecision.count()===1,`${label} ${path} decision research exists in mobile ecosystem DOM`);
            } else if(isScience){
              // Science intentionally retains its mature application-header authority.
              // Global research discovery is therefore asserted through the unified chapter navigation.
              const chapterLink=page.locator('.p120-site-footer__chapters a[href*="research/how-we-decide"]');
              check(await chapterLink.count()===1,`${label} ${path} unified research chapter route exists`);
            } else if(!isResearch){
              const navCard=page.locator('.p120-brand53-mega-card[href*="research/how-we-decide"]');
              check(await navCard.count()===1,`${label} ${path} global research mega-card exists`);
              const explicitMobileNav=page.locator('[aria-label="Мобильная навигация"],[aria-label="Mobile navigation"]');
              if(await explicitMobileNav.count()){
                check(await explicitMobileNav.locator('a[href*="research/how-we-decide"]').count()>=1,`${label} ${path} explicit mobile research route exists`);
              }
            }
            if(isResearch){
              const text=await page.locator('body').innerText();
              const isEn=path.startsWith('/en/');
              check(text.includes(isEn?'The empirical effectiveness of the system has not been established.':'Эмпирическая эффективность системы не установлена.'),`${label} ${path} evidence-status disclaimer preserved`);
              check(text.includes(isEn?'HUMAN JUDGMENT':'ЧЕЛОВЕЧЕСКОЕ СУЖДЕНИЕ'),`${label} ${path} human terminal authority preserved`);
              check(await page.locator('.arms article').count()===3,`${label} ${path} three comparative arms preserved`);
            }
            await page.close();
          }

          for(const [kind,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const p of routes) await visit(p,viewport,`RU ${kind}`);
            for(const p of enRoutes) await visit(p,viewport,`EN ${kind}`);
          }
          await browser.close();
          const summary=`TOTAL_CHECKS=${report.length}\nFAILURES=${failures.length}\n`;
          fs.writeFileSync('HGCGA_PASS2_CROSS_SURFACE_QA.txt',summary+report.join('\n')+'\n');
          console.log(summary+report.join('\n'));
          if(failures.length) process.exit(1);
          JS
          node hgcga-pass2-cross-surface.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P120_HGCGA_PASS2_CROSS_SURFACE_QA
          path: HGCGA_PASS2_CROSS_SURFACE_QA.txt
          retention-days: 30
