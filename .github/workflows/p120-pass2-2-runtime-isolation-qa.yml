name: P120 PASS 2.2 Runtime Isolation QA

on:
  push:
    branches:
      - work/p120-editorial-boundary-pass2-1
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'system/index.html'
      - 'en/system/index.html'
      - '.github/scripts/p120_pass2_2_runtime_isolation_qa.py'
      - '.github/workflows/p120-pass2-2-runtime-isolation-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PASS 2.2 static QA
        run: python .github/scripts/p120_pass2_2_runtime_isolation_qa.py

      - name: Commit QA record
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- P120_PASS2_2_RUNTIME_ISOLATION_QA.md)" ]; then
            echo 'QA record already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add P120_PASS2_2_RUNTIME_ISOLATION_QA.md
            git commit -m 'Record PASS 2.2 runtime isolation QA'
            git push
          fi
