name: P120 FA01 Existing Runtime QA

on:
  push:
    branches:
      - access-control/pass1c-v1
  pull_request:
    paths:
      - 'system/**'
      - 'en/system/**'
      - 'internal/runtime/**'
      - 'internal/contracts/**'
      - 'p120-session-contract-v1.0.js'
      - 'p120-submission-intake-v1.0.js'
      - 'p120-submission-config-v1.0.js'
      - '.github/scripts/p120_fa01_existing_runtime_qa.js'
      - '.github/workflows/p120-fa01-existing-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fa01-no-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check internal/runtime/p120-alpha-system-adapter-v1.0.js
          node --check internal/p120-internal-cabinet-v1.0.js
          node --check p120-submission-intake-v1.0.js
      - name: Package contract JSON
        run: node -e "JSON.parse(require('fs').readFileSync('internal/contracts/p120-fa01-extension-package.schema.json','utf8')); console.log('PASS: schema JSON')"
      - name: Frozen runtime and integration QA
        run: node .github/scripts/p120_fa01_existing_runtime_qa.js
