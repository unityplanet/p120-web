name: Fix Science Navigation Direction v1.1

on:
  push:
    paths:
      - '.github/workflows/fix-science-navigation-direction-v1-1.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply route correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js='''/* P-120 Science Navigation Reconciliation v1.0 — presentation/navigation only. */\n(()=>{\n'use strict';\nconst H=new Set(['#scientific-base','#science-base']);\nconst reduced=()=>!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;\nfunction chapter(attempt=0){const home=document.querySelector('.editorial-home'),t=document.getElementById('science-foundation');if(home&&t){const top=document.querySelector('.topbar'),bar=document.querySelector('.chapter-jump-nav-inner');const o=Math.max(58,Math.round(top?.getBoundingClientRect().height||70))+(innerWidth>=1121?Math.max(0,Math.round(bar?.getBoundingClientRect().height||48))+18:14);scrollTo({top:Math.max(0,scrollY+t.getBoundingClientRect().top-o),behavior:reduced()?'auto':'smooth'});document.documentElement.dataset.p120ScienceDirection='chapter';return}if(attempt<45)setTimeout(()=>chapter(attempt+1),45)}\nfunction clean(){if(H.has(location.hash))history.replaceState(null,'',location.pathname+location.search)}\nfunction base(attempt=0){if(document.querySelector('.science-page,[data-science-root],#science-top')){clean();document.documentElement.dataset.p120ScienceDirection='base';return}const b=document.querySelector('.topnav [data-science],button[data-science],.science-navlink[data-science]');if(b){clean();b.click();document.documentElement.dataset.p120ScienceDirection='base';return}if(attempt<60)setTimeout(()=>base(attempt+1),45)}\ndocument.addEventListener('click',e=>{const b=e.target.closest?.('[data-chapter-jump="science"],[data-chapter-mobile="science"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();chapter()},true);\nfunction hash(){if(H.has(location.hash))setTimeout(()=>base(),0)}\naddEventListener('hashchange',hash);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hash,{once:true});else hash();document.documentElement.dataset.p120ScienceNavigation='reconciled-v1';\n})();\n'''
          Path('science-navigation-reconciliation-v1.0.js').write_text(js,encoding='utf-8')
          p=Path('p120-brand-system-v1.0.js');t=p.read_text(encoding='utf-8')
          old="${homeAnchor('science-foundation')}";new="${localeRoot(isEn)}#scientific-base"
          if old not in t and new not in t: raise SystemExit('brand Science route not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          for fn,src in [('index.html','science-navigation-reconciliation-v1.0.js?v=scinav10'),('en/index.html','../science-navigation-reconciliation-v1.0.js?v=scinav10')]:
              p=Path(fn);t=p.read_text(encoding='utf-8');marker='data-p120-science-navigation="reconciled-v1"'
              if marker not in t:t=t.replace('</body>',f'<script src="{src}" {marker}></script>\n</body>')
              p.write_text(t,encoding='utf-8')
          Path('P120_SCIENCE_NAVIGATION_RECONCILIATION_v1.0.md').write_text('# P-120 Science Navigation Reconciliation v1.0\n\nPASS invariant target:\n\n- Home Chapter **Science / Наука** → `#science-foundation` on Home.\n- Global **Scientific Base / Научная база** → dedicated Science screen.\n- Dedicated pages → locale root `#scientific-base` → application-native Science screen.\n- RU/EN symmetric.\n\nNo measurement, scoring, scientific-content or report-engine changes.\n',encoding='utf-8')
          PY

      - name: Static QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('p120-brand-system-v1.0.js').read_text();j=Path('science-navigation-reconciliation-v1.0.js').read_text();ru=Path('index.html').read_text();en=Path('en/index.html').read_text()
          assert "${localeRoot(isEn)}#scientific-base" in b and "homeAnchor('science-foundation')" not in b
          assert '[data-chapter-jump="science"]' in j and '#scientific-base' in j
          assert 'science-navigation-reconciliation-v1.0.js?v=scinav10' in ru
          assert '../science-navigation-reconciliation-v1.0.js?v=scinav10' in en
          print('STATIC PASS')
          PY

      - name: Browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p120-science-nav-http.log 2>&1 &
          sleep 2
          cat > science-nav-qa.mjs <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});const bad=[];const ok=(v,m)=>{console.log(`${v?'PASS':'FAIL'} ${m}`);if(!v)bad.push(m)};
          async function root(path,lang,pdf){const p=await browser.newPage({viewport:{width:1440,height:1000}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});await p.waitForTimeout(700);const c=p.locator('[data-chapter-jump="science"]').first();ok(await c.count()===1,lang+' chapter control');if(await c.count()){await c.click();await p.waitForTimeout(1000);ok(await p.locator('.editorial-home').count()===1,lang+' chapter stays Home');ok(await p.locator('.science-page,[data-science-root],#science-top').count()===0,lang+' chapter not Base');const r=await p.locator('#science-foundation').boundingBox();ok(!!r&&r.y<280&&r.y>-40,lang+' chapter scroll target')}const s=p.locator('.topnav [data-science]').first();ok(await s.count()===1,lang+' global Base control');if(await s.count()){await s.click();await p.waitForTimeout(500);ok(await p.locator('.science-page,[data-science-root],#science-top').count()>0,lang+' global opens Base');const h=await p.locator('a[href*="p120-scientific-concept-paper"]').first().getAttribute('href').catch(()=>null);ok(!!h&&h.endsWith(pdf),lang+' locale PDF')}await p.close()}
          async function pageRoute(path,lang,label){const p=await browser.newPage({viewport:{width:1440,height:1000}});await p.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});await p.waitForTimeout(600);const a=p.locator('.p120-brand53-navitem').filter({hasText:label}).first();ok(await a.count()===1,lang+' dedicated Base link');if(await a.count()){const h=await a.getAttribute('href');ok(h?.includes('#scientific-base')&&!h.includes('#science-foundation'),lang+' distinct Base route');await a.click();await p.waitForTimeout(1100);ok(await p.locator('.science-page,[data-science-root],#science-top').count()>0,lang+' dedicated resolves Base')}await p.close()}
          await root('/','RU','assets/p120-scientific-concept-paper-v1.2.pdf');await root('/en/','EN','assets/p120-scientific-concept-paper-en-v1.2.pdf');await pageRoute('/why-p120/','RU','Научная база');await pageRoute('/en/why-p120/','EN','Scientific Base');await browser.close();if(bad.length){console.error(bad.join('\n'));process.exit(1)}
          JS
          node science-nav-qa.mjs

      - name: Commit production correction
        run: |
          git config user.name "p120-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add science-navigation-reconciliation-v1.0.js p120-brand-system-v1.0.js index.html en/index.html P120_SCIENCE_NAVIGATION_RECONCILIATION_v1.0.md
          git diff --cached --quiet && exit 0
          git commit -m "NAV: separate Science chapter from Scientific Base"
          git push
