name: P-120 System Controlled Migration v1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p120-system-controlled-migration-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-frozen-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controlled migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          ROOT=Path('index.html')
          SYSTEM=Path('system/index.html')
          AUDIT=Path('P120_WEB_SYSTEM_MIGRATION_v1.0.md')
          CHANGELOG=Path('CHANGELOG.md')
          source=ROOT.read_text(encoding='utf-8')

          required=[
              '<!-- inlined: instrument.js -->','<!-- inlined: app.js -->',
              'window.P120_INSTRUMENT = ',"const KEY='p120_web_prototype_v01';",
              'function renderPreflight()','function renderQuestion()','function renderResults()',
              '<div id="app"></div>'
          ]
          missing=[x for x in required if x not in source]
          if missing:
              raise SystemExit('Migration precondition failed: '+', '.join(missing))

          def sha(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          marker='<!-- inlined: instrument.js -->'
          s=source.index(marker)
          e=source.index('<!-- inlined:',s+len(marker))
          instrument_block=source[s:e]
          match=re.search(r'window\.P120_INSTRUMENT\s*=\s*(\{.*\});\s*</script>',instrument_block,re.S)
          if not match:
              raise SystemExit('Unable to parse frozen instrument payload')
          instrument=json.loads(match.group(1))
          module_ids=[m['id'] for m in instrument.get('modules',[])]
          item_ids=[i['id'] for i in instrument.get('items',[])]
          expected=['SAT24','P72','P72D','AO12','SOMA24']
          if module_ids!=expected:
              raise SystemExit('Unexpected module order: '+repr(module_ids))
          if len(item_ids)!=180 or len(set(item_ids))!=180:
              raise SystemExit(f'Frozen item registry mismatch: {len(item_ids)} / {len(set(item_ids))}')

          critical_start=source.index('function renderPreflight()')
          critical_end=source.index('\nfunction render(){',critical_start)
          critical_runtime=source[critical_start:critical_end]

          # SYSTEM: derive from the exact deployed source, then change only route/presentation boundaries.
          system=source
          system=system.replace('<head>','<head>\n  <base href="../" />',1)
          system=re.sub(r'<meta name="description" content="[^"]*"\s*/>',
                        '<meta name="description" content="P-120 System — каноническая страница замороженного исследовательского инструмента P-120." />',
                        system,count=1)
          system=re.sub(r'<title>.*?</title>','<title>System — P-120</title>',system,count=1,flags=re.S)
          system=system.replace('<body>','<body data-p120-page="system" data-p120-runtime="frozen">',1)
          system=re.sub(r'\s*<!-- P120 EXTENDED RESEARCH SET:START -->.*?<!-- P120 EXTENDED RESEARCH SET:END -->\s*',
                        '\n',system,count=1,flags=re.S)

          bootstrap="""  <!-- P120 SYSTEM CONTROLLED MIGRATION:START -->
          <script id="p120-system-route-bootstrap-v1">
          (() => {
            'use strict';
            const KEY='p120_web_prototype_v01';
            try {
              const raw=localStorage.getItem(KEY);
              const s=raw?JSON.parse(raw):{};
              const I=window.P120_INSTRUMENT;
              const answered=Object.keys(s.responses||{}).length;
              const finished=Boolean(I && Number(s.itemIndex)>=I.items.length);
              if (!s.screen || ['home','science','welcome'].includes(s.screen)) {
                s.screen=finished?'results':answered>0?'test':'preflight';
                localStorage.setItem(KEY,JSON.stringify(s));
              }
            } catch (_) {}
          })();
          </script>
          <!-- P120 SYSTEM CONTROLLED MIGRATION:END -->
          """
          system=system.replace('  <!-- inlined: app.js -->',bootstrap+'  <!-- inlined: app.js -->',1)

          old_nav="""function goHome(anchor){
            state.screen='home';save();renderHome();
            if(anchor) setTimeout(()=>elegantScrollTo(anchor),70);
          }
          function goScience(anchor){
            state.screen='science';save();renderScience();
            if(anchor) setTimeout(()=>elegantScrollTo(anchor),70);
          }"""
          new_nav="""function goHome(anchor){
            const suffix=anchor?('#'+encodeURIComponent(anchor)):'';
            location.href='../'+suffix;
          }
          function goScience(anchor){
            location.href='../#science-foundation';
          }"""
          if old_nav not in system:
              raise SystemExit('System navigation replacement precondition failed')
          system=system.replace(old_nav,new_nav,1)
          system=system.replace("location.href='why-p120/'","location.href='../why-p120/'")
          system=system.replace(
              "if(initialRouteHash&&homeRouteAnchors.includes(initialRouteHash)){state.screen='home';save()}",
              "if(initialRouteHash&&homeRouteAnchors.includes(initialRouteHash)){location.replace('../#'+encodeURIComponent(initialRouteHash));return}",1)

          nav_anchor='<button class="navlink science-navlink" data-science>Научная база</button>'
          if nav_anchor not in system:
              raise SystemExit('System top navigation anchor not found')
          system=system.replace(nav_anchor,
              '<a class="navlink system-navlink" href="system/" aria-current="page" style="text-decoration:none">Система</a>\n          '+nav_anchor,1)

          # ROOT: editorial site remains root; all test-entry controls now hand off to /system/.
          root=source
          root=root.replace("let state=load();\nlet theme=loadTheme();",
              "let state=load();\nif(['preflight','test','transition','results'].includes(state.screen)) state.screen='home';\nlet theme=loadTheme();",1)
          root=root.replace("function startOrResume(){return hasProgress()?resumeTest():openPreflight()}",
              "function startOrResume(){location.href='system/';return false}",1)
          root=root.replace("const start=()=>progress?resumeTest():openPreflight();",
              "const start=()=>{location.href='system/'};",1)
          root=root.replace("document.querySelectorAll('[data-mobile-resume]').forEach(b=>b.onclick=()=>{closeMobileMenu();resumeTest()});",
              "document.querySelectorAll('[data-mobile-resume]').forEach(b=>b.onclick=()=>{closeMobileMenu();location.href='system/'});",1)
          root=root.replace("if(entryParams.get('start')==='1'){state.screen=hasProgress()?'test':'preflight';save()}",
              "if(entryParams.get('start')==='1'){location.replace('system/');return}",1)
          if nav_anchor not in root:
              raise SystemExit('Root top navigation anchor not found')
          root=root.replace(nav_anchor,
              '<a class="navlink system-navlink" href="system/" style="text-decoration:none">Система</a>\n          '+nav_anchor,1)

          # Integrity gate: System frozen payload and assessment runtime must be byte-identical.
          ss=system.index(marker)
          se=system.index('<!-- inlined:',ss+len(marker))
          system_instrument=system[ss:se]
          if system_instrument!=instrument_block:
              raise SystemExit('Frozen instrument block changed during migration')
          cs=system.index('function renderPreflight()')
          ce=system.index('\nfunction render(){',cs)
          if system[cs:ce]!=critical_runtime:
              raise SystemExit('Frozen assessment runtime changed during migration')
          if '<!-- P120 EXTENDED RESEARCH SET:START -->' in system:
              raise SystemExit('Extended Research Set leaked into System page')
          if 'href="system/"' not in root or "const start=()=>{location.href='system/'};" not in root:
              raise SystemExit('Root handoff to System is incomplete')

          ROOT.write_text(root,encoding='utf-8')
          SYSTEM.parent.mkdir(parents=True,exist_ok=True)
          SYSTEM.write_text(system,encoding='utf-8')

          record_lines=[
              '# P-120 WEB — System Controlled Migration v1.0','',
              '**Date:** 2026-09-02  ','**Status:** CONTROLLED / IMPLEMENTED  ',
              '**Canonical route:** `/system/`  ','**Source:** pre-migration root `index.html`','',
              '## Decision','',
              'The existing frozen P-120 respondent runtime was relocated to `/system/` by deriving the System page directly from the deployed monolith. The questionnaire was not recreated or rewritten.','',
              '## Frozen boundary','',
              '- Instrument payload: byte-identical.','- Module order: `SAT24 → P72 → P72D → AO12 → SOMA24`.','- Item registry: 180 unique items, same order and IDs.','- Question wording and choices: unchanged.','- Assessment runtime from `renderPreflight()` through `renderResults()`: byte-identical.','- Storage key `p120_web_prototype_v01`: retained for continuity of saved local progress.','',
              '## Web-only changes','',
              '- `/system/index.html` is the canonical respondent runtime page.','- Root editorial CTAs now route to `/system/`.','- Root header now contains a visible `Система` entry.','- Root remains the editorial website even when assessment progress exists.','- `/system/` resumes progress, opens results for a completed session, or opens preflight for a new session.','- System navigation returns to the editorial site instead of rendering the editorial homepage inside `/system/`.','- Extended Research Set remains outside the frozen runtime page.','',
              '## Integrity evidence','',
              f'- Source root SHA-256 before migration: `{sha(source)}`',f'- Frozen instrument block SHA-256: `{sha(instrument_block)}`',f'- System frozen instrument block SHA-256: `{sha(system_instrument)}`','- Frozen instrument parity: **PASS**','- Assessment runtime parity: **PASS**','- Item count / uniqueness: **180 / 180 — PASS**','- Measurement changes: **NONE**','- Scoring changes: **NONE**','- Questionnaire changes: **NONE**','',
              '## Rollback boundary','',
              'The root document retains the previous frozen runtime source as a dormant rollback copy, but respondent entry controls no longer expose it. `/system/` is the operational and canonical runtime route from this migration onward.',''
          ]
          AUDIT.write_text('\n'.join(record_lines),encoding='utf-8')

          if CHANGELOG.exists():
              changelog=CHANGELOG.read_text(encoding='utf-8')
              if '## System Controlled Migration v1.0' not in changelog:
                  entry='\n'.join([
                      '## System Controlled Migration v1.0 — 2026-09-02','',
                      '- Created `/system/` as the canonical P-120 respondent runtime route.',
                      '- Relocated the existing frozen instrument directly from the deployed source.',
                      '- Preserved all 180 item IDs, wording, choices, module order and assessment runtime.',
                      '- Redirected root test-entry CTAs to `/system/` while retaining saved local progress.',
                      '- Kept the Extended Research Set in the editorial architecture, outside the frozen runtime page.',
                      '- Measurement changes: NONE. Scoring changes: NONE. Questionnaire changes: NONE.','',
                      'Control record: `P120_WEB_SYSTEM_MIGRATION_v1.0.md`.',''
                  ])
                  changelog=changelog.replace('# P-120 Web — Changelog\n\n','# P-120 Web — Changelog\n\n'+entry+'\n',1)
                  CHANGELOG.write_text(changelog,encoding='utf-8')

          print('P-120 System controlled migration: PASS')
          print('items:',len(item_ids))
          print('instrument_sha256:',sha(instrument_block))
          PY

      - name: Static migration QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page,label in [('index.html','root'),('system/index.html','system')]:
              text=Path(page).read_text(encoding='utf-8')
              files=[]
              for i,m in enumerate(re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S),1):
                  p=Path('/tmp')/f'{label}_{i}.js'
                  p.write_text(m.group(1),encoding='utf-8')
                  files.append(str(p))
              Path(f'/tmp/{label}_scripts.txt').write_text('\n'.join(files),encoding='utf-8')
          PY
          while IFS= read -r f; do [ -z "$f" ] || node --check "$f"; done < /tmp/root_scripts.txt
          while IFS= read -r f; do [ -z "$f" ] || node --check "$f"; done < /tmp/system_scripts.txt
          grep -q 'href="system/"' index.html
          grep -q 'data-p120-page="system"' system/index.html
          grep -q 'p120-system-route-bootstrap-v1' system/index.html
          ! grep -q 'P120 EXTENDED RESEARCH SET:START' system/index.html
          echo 'Static migration QA: PASS'

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- index.html system/index.html P120_WEB_SYSTEM_MIGRATION_v1.0.md CHANGELOG.md; then
            echo 'Migration already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html system/index.html P120_WEB_SYSTEM_MIGRATION_v1.0.md CHANGELOG.md
            git commit -m 'Migrate frozen P-120 runtime to System page'
            git push
          fi
