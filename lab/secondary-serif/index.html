<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>P-120 · Secondary Serif Full-Page Lab</title>
  <style>
    :root{--lab-bg:rgba(20,19,17,.95);--lab-ink:#f5f0e8;--lab-muted:#aaa39a;--lab-line:rgba(255,255,255,.14);--lab-accent:#8fb5b0}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#171614;font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif}body{overflow:hidden}
    .labbar{position:fixed;z-index:20;inset:0 0 auto 0;min-height:72px;padding:10px 16px;display:grid;grid-template-columns:minmax(180px,.7fr) minmax(420px,1.4fr) minmax(210px,.7fr);gap:16px;align-items:center;background:var(--lab-bg);color:var(--lab-ink);border-bottom:1px solid var(--lab-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .identity{display:grid;gap:3px}.identity strong{font:600 12px/1.1 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}.identity span{font:400 9px/1.25 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--lab-muted)}
    .controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.control{appearance:none;border:1px solid var(--lab-line);background:transparent;color:var(--lab-muted);border-radius:999px;min-height:38px;padding:8px 14px;font:500 11px/1 "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}.control:hover{color:var(--lab-ink);border-color:rgba(255,255,255,.28)}.control.active{background:rgba(143,181,176,.14);border-color:rgba(143,181,176,.54);color:var(--lab-ink)}
    .right{display:flex;align-items:center;justify-content:flex-end;gap:10px}.status{font:400 9px/1.2 "IBM Plex Mono",monospace;color:var(--lab-muted);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.production{color:var(--lab-ink);text-decoration:none;border-bottom:1px solid var(--lab-line);font:500 10px/1.2 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:2px;white-space:nowrap}
    .legend{position:fixed;z-index:18;left:14px;bottom:14px;max-width:420px;padding:9px 12px;border:1px solid var(--lab-line);border-radius:12px;background:rgba(20,19,17,.78);color:var(--lab-muted);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:400 9px/1.5 "IBM Plex Sans",system-ui,sans-serif;pointer-events:none}.legend b{color:var(--lab-ink);font-weight:500}
    iframe{position:absolute;inset:72px 0 0;width:100%;height:calc(100% - 72px);border:0;background:#f7f4ec}
    @media(max-width:920px){.labbar{grid-template-columns:1fr;gap:7px;padding:8px 10px;min-height:116px}.identity{display:none}.controls{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.right{justify-content:space-between}.status{display:none}.legend{display:none}iframe{inset:116px 0 0;height:calc(100% - 116px)}}
  </style>
</head>
<body>
  <header class="labbar" aria-label="Secondary serif lab controls">
    <div class="identity"><strong>P-120 · Secondary Serif Lab</strong><span>полная Founder page · display Noto и Plex не меняются</span></div>
    <div class="controls" role="group" aria-label="Выбор художественного serif">
      <button class="control" type="button" data-font="prata">A · Prata</button>
      <button class="control" type="button" data-font="cormorant">B · Cormorant Garamond</button>
      <button class="control" type="button" data-font="playfair">C · Playfair Display</button>
    </div>
    <div class="right"><span class="status" id="status">loading</span><a class="production" href="../../creator/" target="_blank" rel="noopener">Production ↗</a></div>
  </header>
  <div class="legend"><b>Меняется:</b> длинный художественный reading-copy по всей странице. <b>Не меняется:</b> Noto Display, крупные вопросы/manifesto, Plex UI/labels, Plex Light Italic notes.</div>
  <iframe id="preview" src="../../creator/" title="P-120 Founder page — full-page secondary serif lab"></iframe>
  <script>
    (()=>{
      'use strict';
      const frame=document.getElementById('preview');
      const status=document.getElementById('status');
      const configs={
        prata:{label:'A · Prata',family:'"Prata", "Noto Serif", serif',weight:'400',tracking:'-.006em',line:'1.64',scale:1,fontUrl:'https://fonts.bunny.net/css?family=prata:400&display=swap'},
        cormorant:{label:'B · Cormorant Garamond',family:'"Cormorant Garamond", "Noto Serif", serif',weight:'500',tracking:'.002em',line:'1.55',scale:1.105,fontUrl:'https://fonts.bunny.net/css?family=cormorant-garamond:500,600&display=swap'},
        playfair:{label:'C · Playfair Display',family:'"Playfair Display", "Noto Serif", serif',weight:'500',tracking:'-.006em',line:'1.60',scale:1.025,fontUrl:'https://fonts.bunny.net/css?family=playfair-display:500,600&display=swap'}
      };
      const bodySelectors=[
        '.founder-story__reading > p:not(.founder-story__marginal-note)',
        '.founder-story__lead',
        '.founder-story__coordinate-copy > p',
        '.founder-story__boundary-copy > p:not(.founder-story__marginal-note)',
        '.founder-story__north-copy > p'
      ].join(',');
      function param(){const p=new URLSearchParams(location.search).get('font');return configs[p]?p:'prata'}
      function updateUrl(key){const u=new URL(location.href);u.searchParams.set('font',key);history.replaceState(null,'',u)}
      async function apply(key){
        const current=configs[key]?key:'prata';updateUrl(current);
        document.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font===current));
        const doc=frame.contentDocument;if(!doc)return;
        doc.getElementById('p120-secondary-serif-lab-font')?.remove();
        doc.getElementById('p120-secondary-serif-lab-style')?.remove();
        const cfg=configs[current];
        const link=doc.createElement('link');link.id='p120-secondary-serif-lab-font';link.rel='stylesheet';link.href=cfg.fontUrl;doc.head.appendChild(link);
        const s=cfg.scale;
        const style=doc.createElement('style');style.id='p120-secondary-serif-lab-style';style.textContent=`
          ${bodySelectors}{font-family:${cfg.family}!important;font-weight:${cfg.weight}!important;font-style:normal!important;letter-spacing:${cfg.tracking}!important;line-height:${cfg.line}!important}
          .founder-story__reading{font-size:clamp(${(18*s).toFixed(2)}px,${(1.26*s).toFixed(3)}vw,${(23*s).toFixed(2)}px)!important}
          .founder-story__coordinate-copy{font-size:clamp(${(20*s).toFixed(2)}px,${(1.5*s).toFixed(3)}vw,${(27*s).toFixed(2)}px)!important}
          .founder-story__boundary-copy{font-size:clamp(${(18*s).toFixed(2)}px,${(1.25*s).toFixed(3)}vw,${(23*s).toFixed(2)}px)!important}
          .founder-story__north-copy{font-size:clamp(${(18*s).toFixed(2)}px,${(1.3*s).toFixed(3)}vw,${(24*s).toFixed(2)}px)!important}
          .founder-story__lead{font-size:clamp(${(19*s).toFixed(2)}px,${(1.45*s).toFixed(3)}vw,${(26*s).toFixed(2)}px)!important}
          @media(max-width:820px){.founder-story__reading,.founder-story__boundary-copy{font-size:${(18*s).toFixed(2)}px!important}}
          .founder-story__display,.founder-story__beat,.founder-story__question-text,.founder-story__doctrine-row span:last-child,.founder-story__boundary-title,.founder-story__signature-mark{font-family:var(--fnd-serif)!important}
          .founder-story__marginal-note{font-family:"IBM Plex Sans",sans-serif!important;font-weight:300!important;font-style:italic!important}
        `;doc.head.appendChild(style);
        status.textContent=`${cfg.label} · loading`;
        try{await doc.fonts.ready;if(current==='prata')await doc.fonts.load('400 24px Prata');if(current==='cormorant')await doc.fonts.load('500 26px "Cormorant Garamond"');if(current==='playfair')await doc.fonts.load('500 24px "Playfair Display"');status.textContent=`${cfg.label} · loaded`}catch(_){status.textContent=`${cfg.label} · fallback`}
      }
      frame.addEventListener('load',()=>apply(param()));
      document.addEventListener('click',e=>{const b=e.target.closest('[data-font]');if(b)apply(b.dataset.font)});
    })();
  </script>
</body>
</html>
